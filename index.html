      flashcards:[
        {tag:"Obj 4.1",term:"Secure Baseline",def:"A documented, approved standard configuration for a system. You establish it, deploy it to systems, and maintain it over time so every device starts from a known secure state."},
        {tag:"Obj 4.1",term:"Hardening",def:"Reducing a system's attack surface: applying baselines, disabling unnecessary ports and services, removing unneeded software, changing defaults, and adding endpoint protection. Targets include servers, workstations, mobile, IoT, and ICS."},
        {tag:"Obj 4.1",term:"MDM & Deployment Models",def:"Mobile device management enforces policy on mobile devices. Deployment models: BYOD (personal devices), COPE (corporate-owned, personally enabled), and CYOD (choose your own device from an approved list)."},
        {tag:"Obj 4.1",term:"WPA3",def:"The current Wi-Fi security standard, stronger than WPA2. It improves encryption and protects against offline password-guessing attacks. Enterprise Wi-Fi often pairs it with RADIUS."},
        {tag:"Obj 4.1",term:"Input Validation & Code Signing",def:"Input validation checks and sanitizes user input to prevent injection attacks. Code signing uses a digital signature to prove software came from a trusted publisher and was not altered."},
        {tag:"Obj 4.1",term:"Site Survey / Heat Map",def:"Wireless planning tools. A site survey measures signal and interference in a space; a heat map visualizes coverage so access points are placed for strength and security without over-spilling signal."},
        {tag:"Obj 4.2",term:"Asset Management",def:"Tracking hardware, software, and data through their lifecycle: acquisition, assignment with ownership and classification, inventory and enumeration, and secure disposal. You cannot protect what you do not know you have."},
        {tag:"Obj 4.2",term:"Sanitization vs Destruction",def:"At end of life, sanitization securely wipes data so media can be reused, while destruction physically destroys the media. Certification documents that it was done, and data retention policy governs how long to keep data first."},
        {tag:"Obj 4.3",term:"CVE vs CVSS",def:"A CVE is a unique identifier for one specific known vulnerability. CVSS is a scoring system (0 to 10) that rates a vulnerability's severity to help prioritize remediation."},
        {tag:"Obj 4.3",term:"False Positive vs False Negative",def:"A false positive is an alert or finding for something that is not actually a problem. A false negative is a real problem that was missed. False negatives are more dangerous because the threat goes unnoticed."},
        {tag:"Obj 4.3",term:"Penetration Testing",def:"Authorized simulated attack to find exploitable weaknesses. Can be offensive or defensive, and use known, partially known, or unknown environment knowledge. Reconnaissance may be passive or active."},
        {tag:"Obj 4.3",term:"Responsible Disclosure / Bug Bounty",def:"A responsible disclosure program lets researchers report vulnerabilities safely. A bug bounty pays them for valid findings, crowdsourcing security testing."},
        {tag:"Obj 4.4",term:"SIEM",def:"Security Information and Event Management aggregates and correlates logs from across the environment, generates alerts, and supports investigation, archiving, and reporting from one place."},
        {tag:"Obj 4.4",term:"Alert Tuning",def:"Adjusting detection rules to cut noise and false positives so real alerts stand out. Poorly tuned alerting causes fatigue and missed incidents."},
        {tag:"Obj 4.4",term:"DLP",def:"Data loss prevention monitors and blocks sensitive data from leaving the organization through channels like email, web, or USB, based on content and policy."},
        {tag:"Obj 4.4",term:"SCAP / Benchmarks",def:"The Security Content Automation Protocol standardizes how security tools express and check configuration and vulnerability data, enabling automated compliance against benchmarks."},
        {tag:"Obj 4.4",term:"Agent vs Agentless",def:"Agent-based monitoring installs software on each host for deep, continuous data. Agentless monitoring collects remotely without installing software, easier to deploy but often less detailed."},
        {tag:"Obj 4.5",term:"EDR / XDR",def:"Endpoint detection and response continuously monitors endpoints to detect, investigate, and respond to threats. XDR extends this correlation across endpoints, network, cloud, and email."},
        {tag:"Obj 4.5",term:"NAC",def:"Network access control checks a device's identity and security posture before allowing it onto the network, quarantining or restricting devices that fail policy."},
        {tag:"Obj 4.5",term:"SPF, DKIM, DMARC",def:"Email authentication. SPF lists authorized sending servers, DKIM adds a cryptographic signature, and DMARC ties them together with a policy and reporting to fight spoofing and phishing."},
        {tag:"Obj 4.5",term:"File Integrity Monitoring (FIM)",def:"Watches critical files and configurations for unauthorized changes and alerts when they are modified, a strong detective control against tampering."},
        {tag:"Obj 4.6",term:"SSO & Federation",def:"Single sign-on lets a user authenticate once and access many systems. Federation extends trust across organizations so one identity works across domains, often via SAML or OpenID Connect."},
        {tag:"Obj 4.6",term:"SAML vs OAuth vs LDAP",def:"SAML handles browser-based enterprise SSO with XML assertions. OAuth is an authorization framework granting delegated access via tokens (often for APIs). LDAP queries and authenticates against a directory."},
        {tag:"Obj 4.6",term:"Access Control Models",def:"MAC uses system-enforced labels, DAC lets the data owner decide, RBAC grants by role, rule-based uses defined rules like ACLs, and ABAC decides from attributes (user, resource, context)."},
        {tag:"Obj 4.6",term:"MFA Factors",def:"Multifactor authentication combines factors from different categories: something you know (password), something you have (token, security key), something you are (biometric), and somewhere you are (location)."},
        {tag:"Obj 4.6",term:"PAM",def:"Privileged access management secures high-power accounts using just-in-time permissions, password vaulting, and ephemeral credentials that exist only as long as needed."},
        {tag:"Obj 4.6",term:"Passwordless & Password Best Practices",def:"Best practices weigh length over pure complexity and limit reuse. Passwordless authentication replaces passwords with factors like biometrics or security keys, removing the weakest link."},
        {tag:"Obj 4.7",term:"Automation & Orchestration",def:"Scripting and orchestration handle repetitive security tasks such as provisioning, ticketing, and enabling or disabling access. Benefits include speed, consistent baselines, and scale; risks include complexity and single points of failure."},
        {tag:"Obj 4.8",term:"Incident Response Lifecycle",def:"Preparation, detection, analysis, containment, eradication, recovery, and lessons learned. A continuous cycle where lessons feed back into preparation. Aligns with NIST SP 800-61."},
        {tag:"Obj 4.8",term:"Chain of Custody",def:"Documentation of who handled evidence, when, and how, from collection onward. It preserves integrity and admissibility so evidence holds up in legal proceedings."},
        {tag:"Obj 4.8",term:"Legal Hold & E-Discovery",def:"A legal hold preserves data that may be relevant to litigation so it is not deleted. E-discovery is the process of identifying and producing that electronic information."},
        {tag:"Obj 4.9",term:"Log Sources & Packet Capture",def:"Investigations draw on firewall, application, endpoint, OS security, IDS/IPS, and network logs, plus metadata. Packet captures record actual traffic for deep analysis."}
      ],
      questions:[
        {obj:"4.1",q:"An administrator creates one approved, documented configuration and applies it to every new server so each starts from a known secure state. This is a:",opts:["Secure baseline","Honeypot","Load balancer","Bug bounty"],a:0,e:"A secure baseline is a standard approved configuration that is established, deployed, and maintained across systems. (Obj 4.1)"},
        {obj:"4.1",q:"Which action is an example of hardening a workstation?",opts:["Disabling unused ports and removing unnecessary software","Adding more user accounts","Turning off logging","Sharing the admin password"],a:0,e:"Hardening reduces attack surface by disabling unneeded services and ports and removing unnecessary software. (Obj 4.1)"},
        {obj:"4.1",q:"A company lets employees use their own personal phones for work under a policy. Which deployment model is this?",opts:["BYOD","COPE","CYOD","MDM"],a:0,e:"Bring your own device (BYOD) uses employees' personal devices. COPE and CYOD involve corporate-provided or corporate-approved devices. (Obj 4.1)"},
        {obj:"4.1",q:"Which wireless security standard best protects against offline password-guessing attacks on the pre-shared key?",opts:["WPA3","WEP","WPA","Open"],a:0,e:"WPA3 strengthens encryption and defends the handshake against offline guessing better than WPA2 and far better than WEP. (Obj 4.1)"},
        {obj:"4.1",q:"Checking and sanitizing user-supplied data before processing it primarily prevents:",opts:["Injection attacks","Power failures","Physical theft","Slow performance"],a:0,e:"Input validation blocks malformed or malicious input, a core defense against injection attacks like SQLi and XSS. (Obj 4.1)"},
        {obj:"4.1",q:"Running an untrusted program in an isolated environment to observe its behavior safely is called:",opts:["Sandboxing","Federation","Clustering","Journaling"],a:0,e:"Sandboxing isolates code so it can be executed and analyzed without risking the host. (Obj 4.1)"},
        {obj:"4.1",q:"Before deploying wireless access points across an office, a technician measures signal strength and interference and produces a heat map. This planning step is a:",opts:["Site survey","Penetration test","Chain of custody","Root cause analysis"],a:0,e:"A site survey with a heat map guides access point placement for coverage and security. (Obj 4.1)"},
        {obj:"4.1",q:"Code signing provides assurance that software:",opts:["Came from a trusted publisher and was not altered","Runs faster","Needs no updates","Cannot contain bugs"],a:0,e:"A code signature verifies the publisher's identity and the integrity of the software since signing. (Obj 4.1)"},
        {obj:"4.2",q:"Maintaining an accurate inventory and enumeration of all hardware and software primarily supports security by:",opts:["Ensuring you can protect and track what you actually have","Increasing network speed","Replacing encryption","Eliminating the need for patching"],a:0,e:"You cannot secure unknown assets, so inventory and enumeration underpin the whole security program. (Obj 4.2)"},
        {obj:"4.2",q:"At end of life, securely wiping a drive so it can be safely reused is called:",opts:["Sanitization","Destruction","Enumeration","Provisioning"],a:0,e:"Sanitization removes data so media can be reused; destruction physically destroys the media instead. (Obj 4.2)"},
        {obj:"4.2",q:"A signed certificate confirming that storage media was properly wiped or destroyed provides:",opts:["Certification of destruction","A legal hold","A false positive","A secure baseline"],a:0,e:"Certification documents that sanitization or destruction was carried out, useful for audits and compliance. (Obj 4.2)"},
        {obj:"4.2",q:"Assigning each asset an owner and a data classification is part of which asset-management activity?",opts:["Assignment and accounting","Disposal","Reconnaissance","Alert tuning"],a:0,e:"Assignment and accounting record ownership and classification so responsibility and handling are clear. (Obj 4.2)"},
        {obj:"4.2",q:"A policy specifying how long different records must be kept before disposal is a:",opts:["Data retention policy","Chain of custody","Site survey","Bug bounty"],a:0,e:"Data retention policy defines how long data is kept, balancing legal needs and minimizing unnecessary exposure. (Obj 4.2)"},
        {obj:"4.3",q:"A tool reports a vulnerability that, on investigation, does not actually exist. This is a:",opts:["False positive","False negative","Zero-day","CVE"],a:0,e:"A false positive is a finding for something that is not truly a problem. A false negative is a real issue that was missed. (Obj 4.3)"},
        {obj:"4.3",q:"Which resource provides a numeric severity score from 0 to 10 to help prioritize a vulnerability?",opts:["CVSS","CVE","OSINT","SPF"],a:0,e:"The Common Vulnerability Scoring System (CVSS) rates severity to guide prioritization. A CVE is just the identifier. (Obj 4.3)"},
        {obj:"4.3",q:"A unique identifier such as CVE-2024-12345 refers to:",opts:["One specific publicly known vulnerability","A severity score","A firewall rule","An encryption key"],a:0,e:"A CVE (Common Vulnerabilities and Exposures) entry uniquely identifies a specific known vulnerability. (Obj 4.3)"},
        {obj:"4.3",q:"A program that pays external researchers for valid vulnerability reports is a:",opts:["Bug bounty program","Honeynet","Secure baseline","Legal hold"],a:0,e:"A bug bounty rewards researchers for responsibly disclosing valid findings, crowdsourcing testing. (Obj 4.3)"},
        {obj:"4.3",q:"Analyzing source code without executing it to find flaws is called:",opts:["Static analysis","Dynamic analysis","Penetration testing","Packet capture"],a:0,e:"Static analysis inspects code without running it; dynamic analysis tests the running application. (Obj 4.3)"},
        {obj:"4.3",q:"After patching a vulnerability, an analyst runs the scanner again to confirm it is resolved. This is:",opts:["Validation of remediation via rescanning","A false negative","A tabletop exercise","Alert tuning"],a:0,e:"Rescanning validates that remediation actually closed the vulnerability. (Obj 4.3)"},
        {obj:"4.3",q:"When a vulnerability cannot be patched immediately, applying extra monitoring and isolation as a stopgap is using:",opts:["Compensating controls","Root cause analysis","A right-to-audit clause","Passwordless authentication"],a:0,e:"Compensating controls reduce risk when direct remediation is not yet possible. (Obj 4.3)"},
        {obj:"4.3",q:"Gathering vulnerability intelligence from publicly available sources like blogs, advisories, and forums is known as:",opts:["Open-source intelligence (OSINT)","A packet capture","A legal hold","Federation"],a:0,e:"OSINT collects threat and vulnerability information from public sources as part of threat feeds. (Obj 4.3)"},
        {obj:"4.4",q:"Which tool centralizes logs from across the enterprise, correlates them, and generates alerts for investigation?",opts:["SIEM","UPS","VPN","WAF"],a:0,e:"A SIEM aggregates and correlates log data, producing alerts and supporting investigation and reporting. (Obj 4.4)"},
        {obj:"4.4",q:"Adjusting detection rules to reduce false positives and alert fatigue is called:",opts:["Alert tuning","Sanitization","Federation","Journaling"],a:0,e:"Alert tuning refines rules so meaningful alerts are not buried in noise. (Obj 4.4)"},
        {obj:"4.4",q:"A control that inspects outbound email and USB transfers to stop sensitive data from leaving the company is:",opts:["Data loss prevention (DLP)","Network access control","A load balancer","A jump server"],a:0,e:"DLP monitors and blocks sensitive data from exfiltration across channels based on content and policy. (Obj 4.4)"},
        {obj:"4.4",q:"Which protocol standardizes security configuration and vulnerability data so tools can automate compliance checks?",opts:["SCAP","SMTP","LDAP","SNMP"],a:0,e:"The Security Content Automation Protocol (SCAP) standardizes security content for automated assessment against benchmarks. (Obj 4.4)"},
        {obj:"4.4",q:"An organization wants deep, continuous host data and is willing to install software on each system. This is which monitoring approach?",opts:["Agent-based","Agentless","Passive tap","Air-gapped"],a:0,e:"Agent-based monitoring installs software on hosts for detailed, continuous telemetry. Agentless collects remotely without an installed agent. (Obj 4.4)"},
        {obj:"4.4",q:"Collecting flow records that summarize network conversations for traffic analysis uses:",opts:["NetFlow","DMARC","SELinux","Code signing"],a:0,e:"NetFlow captures metadata about network flows, useful for detecting anomalies and understanding traffic. (Obj 4.4)"},
        {obj:"4.4",q:"Moving a suspicious endpoint to a restricted network in response to an alert is an example of:",opts:["Quarantine","Enumeration","Attestation","Replication"],a:0,e:"Quarantine isolates a suspected compromised system as part of alert response and remediation. (Obj 4.4)"},
        {obj:"4.5",q:"A solution that continuously monitors endpoints to detect, investigate, and respond to threats is:",opts:["EDR","DNS filtering","SPF","A UPS"],a:0,e:"Endpoint detection and response (EDR) provides continuous endpoint monitoring and response; XDR extends it across more layers. (Obj 4.5)"},
        {obj:"4.5",q:"Which technology checks a device's identity and security posture before permitting it onto the network?",opts:["Network access control (NAC)","File integrity monitoring","A reverse proxy","A generator"],a:0,e:"NAC evaluates a device before granting access and can quarantine noncompliant devices. (Obj 4.5)"},
        {obj:"4.5",q:"Which email authentication mechanism publishes the list of servers authorized to send mail for a domain?",opts:["SPF","DKIM","DMARC","TLS"],a:0,e:"Sender Policy Framework (SPF) lists authorized sending servers in DNS. DKIM signs messages; DMARC sets policy and reporting on top. (Obj 4.5)"},
        {obj:"4.5",q:"DMARC builds on SPF and DKIM primarily to:",opts:["Set a policy for handling failures and provide reporting on spoofing","Encrypt message bodies","Replace TLS","Store passwords"],a:0,e:"DMARC uses SPF and DKIM results with alignment, tells receivers how to handle failures, and provides reporting. (Obj 4.5)"},
        {obj:"4.5",q:"Watching critical system files and alerting when they are changed without authorization is:",opts:["File integrity monitoring","Load balancing","Tokenization","Sandboxing"],a:0,e:"File integrity monitoring (FIM) detects unauthorized changes to important files and configurations. (Obj 4.5)"},
        {obj:"4.5",q:"On Windows, which feature centrally enforces security configuration across many machines in a domain?",opts:["Group Policy","SELinux","NetFlow","DKIM"],a:0,e:"Group Policy centrally manages configuration and security settings across domain-joined Windows systems. SELinux is the Linux equivalent concept of mandatory access control. (Obj 4.5)"},
        {obj:"4.5",q:"Blocking access to known-malicious domains at resolution time is achieved with:",opts:["DNS filtering","Code signing","A UPS","Clustering"],a:0,e:"DNS filtering prevents devices from resolving and reaching malicious or disallowed domains. (Obj 4.5)"},
        {obj:"4.5",q:"A web filter that assigns sites a trust level based on their history uses:",opts:["Reputation","Journaling","A heat map","A right-to-audit clause"],a:0,e:"Reputation-based web filtering blocks or allows sites according to their known trustworthiness. (Obj 4.5)"},
        {obj:"4.6",q:"A user authenticates once and then reaches many applications without logging in again. This is:",opts:["Single sign-on (SSO)","Multifactor authentication","A packet capture","Sanitization"],a:0,e:"Single sign-on lets one authentication grant access to multiple systems. (Obj 4.6)"},
        {obj:"4.6",q:"Which access control model grants permissions based on a user's job role?",opts:["Role-based access control","Discretionary access control","Mandatory access control","Rule-based access control"],a:0,e:"RBAC assigns permissions to roles, and users inherit them by role membership. (Obj 4.6)"},
        {obj:"4.6",q:"In which model does the system enforce access using classification labels that users cannot change?",opts:["Mandatory access control","Discretionary access control","Role-based access control","Attribute-based access control"],a:0,e:"MAC enforces access through system-assigned labels and clearances, common in high-security environments. (Obj 4.6)"},
        {obj:"4.6",q:"A cloud service grants an app limited, delegated access to a user's data using tokens rather than sharing the password. Which framework does this?",opts:["OAuth","SAML","LDAP","SPF"],a:0,e:"OAuth is an authorization framework for delegated access via tokens, common for API and app access. SAML handles browser SSO assertions. (Obj 4.6)"},
        {obj:"4.6",q:"Requiring a password plus a code from a hardware token satisfies multifactor authentication because it combines:",opts:["Something you know and something you have","Two things you know","Two things you have","Something you are and where you are"],a:0,e:"MFA requires factors from different categories; a password (know) and a token (have) qualify. (Obj 4.6)"},
        {obj:"4.6",q:"Which access control model decides access from attributes like department, device, time, and sensitivity?",opts:["Attribute-based access control","Discretionary access control","Role-based access control","Mandatory access control"],a:0,e:"ABAC evaluates multiple attributes of the user, resource, and context to make dynamic decisions. (Obj 4.6)"},
        {obj:"4.6",q:"Granting an administrator elevated rights only for the moment they are needed, then revoking them, describes:",opts:["Just-in-time permissions","Permanent admin rights","Shared accounts","Password reuse"],a:0,e:"Just-in-time permissions, part of privileged access management, grant elevated access only when required. (Obj 4.6)"},
        {obj:"4.6",q:"Storing privileged credentials in a secured, audited vault that checks them out as needed is:",opts:["Password vaulting","Federation","Tokenization","Sandboxing"],a:0,e:"Password vaulting secures privileged credentials in a managed vault, a core PAM capability. (Obj 4.6)"},
        {obj:"4.6",q:"Which SSO protocol uses XML assertions and is common for enterprise browser-based single sign-on?",opts:["SAML","OAuth","RADIUS","NetFlow"],a:0,e:"Security Assertion Markup Language (SAML) exchanges XML authentication assertions for web SSO. (Obj 4.6)"},
        {obj:"4.6",q:"Verifying that a person is who they claim to be before issuing them credentials is:",opts:["Identity proofing","Alert tuning","Enumeration","Replication"],a:0,e:"Identity proofing validates a user's real-world identity during onboarding before credentials are issued. (Obj 4.6)"},
        {obj:"4.6",q:"Extending trust so a single identity works across separate organizations or domains is:",opts:["Federation","Segmentation","Journaling","Sanitization"],a:0,e:"Federation links identity across organizations so users authenticate once and access partner systems. (Obj 4.6)"},
        {obj:"4.6",q:"Current password guidance emphasizes which factor as most important for resisting guessing?",opts:["Length","Frequent forced expiration","Reuse across sites","Short complex strings"],a:0,e:"Length contributes the most entropy; modern guidance favors longer passphrases over frequent forced rotation. (Obj 4.6)"},
        {obj:"4.7",q:"Automatically creating accounts and access for new hires through a script is an example of:",opts:["User provisioning automation","Manual enumeration","A tabletop exercise","Packet capture"],a:0,e:"Automating user provisioning speeds onboarding and enforces consistent, correct access. (Obj 4.7)"},
        {obj:"4.7",q:"Which is a benefit of automation and orchestration in security operations?",opts:["Faster reaction time and consistent enforcement of baselines","Guaranteed elimination of all risk","No need for staff","Automatic legal compliance"],a:0,e:"Automation improves speed, consistency, and scale and acts as a workforce multiplier. (Obj 4.7)"},
        {obj:"4.7",q:"Which is a genuine risk to weigh when adopting heavy automation?",opts:["Complexity and a potential single point of failure","It always reduces cost to zero","It removes the need for monitoring","It makes systems unpatchable"],a:0,e:"Automation can add complexity, technical debt, cost, and single points of failure that must be managed. (Obj 4.7)"},
        {obj:"4.7",q:"Automated guard rails in a deployment pipeline primarily serve to:",opts:["Enforce secure configurations and prevent risky changes automatically","Slow down all deployments","Replace all human staff","Delete logs"],a:0,e:"Guard rails automatically keep deployments within safe, compliant boundaries. (Obj 4.7)"},
        {obj:"4.8",q:"Which sequence correctly orders the core incident response phases?",opts:["Preparation, detection, analysis, containment, eradication, recovery, lessons learned","Detection, recovery, preparation, analysis","Containment, preparation, recovery, detection","Recovery, lessons learned, detection, analysis"],a:0,e:"The lifecycle runs preparation, detection, analysis, containment, eradication, recovery, then lessons learned, and repeats. (Obj 4.8)"},
        {obj:"4.8",q:"During incident response, isolating affected systems to stop a threat from spreading is which phase?",opts:["Containment","Eradication","Recovery","Preparation"],a:0,e:"Containment limits the incident's spread before the threat is removed (eradication) and systems are restored (recovery). (Obj 4.8)"},
        {obj:"4.8",q:"Documenting exactly who handled a piece of evidence, when, and how, to keep it admissible, is called:",opts:["Chain of custody","Legal hold","Root cause analysis","Threat hunting"],a:0,e:"Chain of custody records evidence handling to preserve its integrity and admissibility. (Obj 4.8)"},
        {obj:"4.8",q:"A process that preserves potentially relevant data so it is not deleted during litigation is a:",opts:["Legal hold","Site survey","False positive","Snapshot"],a:0,e:"A legal hold suspends normal deletion so data relevant to a legal matter is preserved. (Obj 4.8)"},
        {obj:"4.8",q:"Investigating an incident to determine the underlying reason it happened, not just the symptoms, is:",opts:["Root cause analysis","Alert tuning","Enumeration","Provisioning"],a:0,e:"Root cause analysis identifies the fundamental cause so the same incident can be prevented in future. (Obj 4.8)"},
        {obj:"4.8",q:"Proactively searching the environment for hidden threats that evaded existing defenses is called:",opts:["Threat hunting","Sanitization","Code signing","Load balancing"],a:0,e:"Threat hunting actively looks for undetected adversaries rather than waiting for alerts. (Obj 4.8)"},
        {obj:"4.8",q:"A discussion-based session where the response team walks through a hypothetical incident is a:",opts:["Tabletop exercise","Failover test","Penetration test","Packet capture"],a:0,e:"A tabletop exercise validates the incident response plan through discussion without touching production. (Obj 4.8)"},
        {obj:"4.8",q:"In digital forensics, capturing a bit-for-bit copy of a drive while preserving the original is part of:",opts:["Acquisition and preservation","Recovery","Alert tuning","Provisioning"],a:0,e:"Forensic acquisition creates a verifiable copy while preservation keeps the original evidence intact. (Obj 4.8)"},

        {obj:"4.9",q:"When investigating a suspected firewall bypass, which log is the most directly relevant?",opts:["Firewall logs","Payroll records","A site survey","A heat map"],a:0,e:"Firewall logs record allowed and denied traffic and are the direct source for investigating firewall activity. (Obj 4.9)"},
        {obj:"4.9",q:"Data that describes other data, such as timestamps, sender, and file properties, is called:",opts:["Metadata","Ciphertext","A baseline","A token"],a:0,e:"Metadata provides context (who, when, where, how) and is a valuable investigative data source. (Obj 4.9)"},
        {obj:"4.9",q:"Consolidated visual displays that summarize security status and trends for analysts are:",opts:["Dashboards","Legal holds","Snapshots","Site surveys"],a:0,e:"Dashboards present aggregated data and trends to support monitoring and investigation. (Obj 4.9)"}

      topics:[
        {id:"t4ov",name:"Overview",html:`
          <h3>What Domain 4 covers and what to expect</h3>
          <p>Security Operations is the largest domain at 28 percent, so it deserves the most study time. It is where security becomes a daily practice rather than a design on paper. The questions are heavily scenario-based and hands-on in flavor: you are given a situation and asked what to do, which tool fits, or what the logs are telling you. Nine objectives sit under it, which is why this section has the most breakdown pages.</p>
          <p>The material clusters into a few themes. Keeping systems secure day to day comes from <b>4.1</b> secure baselines and hardening, <b>4.2</b> asset management, and <b>4.7</b> automation. Finding and fixing weaknesses is <b>4.3</b> vulnerability management. Watching for and reacting to trouble spans <b>4.4</b> monitoring and alerting, <b>4.5</b> the many enterprise controls like EDR, NAC, and email security, <b>4.8</b> incident response, and <b>4.9</b> using log and data sources for investigations. Controlling who gets access is <b>4.6</b> identity and access management, one of the densest and most tested areas.</p>
          <p>Because this domain is broad, focus your effort where the exam concentrates: know the incident response phases in order, be able to tell the identity protocols apart (SAML, OAuth, LDAP) and the access control models (MAC, DAC, RBAC, ABAC), recognize which monitoring tool solves which problem (SIEM, DLP, EDR, NAC, FIM), and understand the difference between a CVE and a CVSS score. If you can read a scenario and name the right tool or the right next step, you will do well here.</p>`},
        {id:"t41",name:"4.1 Secure Computing",html:`
          <h3>Applying security techniques to computing resources</h3>
          <p>This objective is about making individual systems secure and keeping them that way. It starts with the <b>secure baseline</b>: a documented, approved configuration that you establish once, deploy to every system, and maintain over time so nothing drifts into an insecure state. <b>Hardening</b> then reduces each system's attack surface by disabling unnecessary ports and services, removing unneeded software, changing default credentials, and adding endpoint protection. The exam lists many hardening targets, from workstations and servers to switches, routers, cloud infrastructure, mobile devices, IoT, embedded systems, and ICS, and the principle is the same across all of them: turn off what you do not need.</p>
          <h4>Mobile and wireless</h4>
          <p>Mobile devices are managed with <b>mobile device management</b>, which enforces policy, encryption, and remote wipe. Deployment models set who owns the device: <b>BYOD</b> uses personal devices, <b>COPE</b> is corporate-owned but personally usable, and <b>CYOD</b> lets employees choose from an approved list. Wireless deserves planning: a <b>site survey</b> and <b>heat map</b> guide access point placement so coverage is strong without signal spilling where attackers could reach it. Secure the wireless itself with <b>WPA3</b>, and in enterprises pair it with <b>AAA and RADIUS</b> so each user authenticates individually.</p>
          <h4>Application security</h4>
          <p>Software needs its own controls. <b>Input validation</b> checks and sanitizes user input to stop injection. <b>Secure cookies</b> protect session data. <b>Static code analysis</b> reviews code without running it to catch flaws early. <b>Code signing</b> proves software came from a trusted publisher unaltered. <b>Sandboxing</b> runs untrusted code in isolation, and continuous <b>monitoring</b> keeps watch once systems are live.</p>`},
        {id:"t42",name:"4.2 Asset Management",html:`
          <h3>Hardware, software, and data asset management</h3>
          <p>You cannot protect what you do not know you have, which is why asset management underpins security operations. It begins at <b>acquisition and procurement</b>, where security requirements should be considered before anything is bought. Once an asset exists, <b>assignment and accounting</b> record its <b>ownership</b> and <b>classification</b>, so there is always a responsible party and a known sensitivity level.</p>
          <h4>Tracking and disposal</h4>
          <p>Throughout its life, an asset is tracked through <b>inventory and enumeration</b>, giving the organization an accurate picture of what it operates. The riskiest moment is often the end of life. <b>Sanitization</b> securely wipes data so media can be reused, while <b>destruction</b> physically destroys media that will not be. <b>Certification</b> documents that disposal was done correctly, which matters for audits, and a <b>data retention</b> policy governs how long data must be kept before it can be destroyed. Skipping secure disposal is a common way sensitive data leaks after hardware leaves the building.</p>`},
        {id:"t43",name:"4.3 Vulnerability Mgmt",html:`
          <h3>Vulnerability management</h3>
          <p>Vulnerability management is the ongoing cycle of finding weaknesses, judging their importance, fixing them, and confirming the fix. <b>Identification</b> uses several methods: automated <b>vulnerability scans</b>, application testing through <b>static analysis</b> (reading code) and <b>dynamic analysis</b> (testing the running app) and <b>package monitoring</b>, <b>threat feeds</b> including <b>OSINT</b> and proprietary and dark web sources, <b>penetration testing</b>, <b>responsible disclosure</b> and <b>bug bounty</b> programs, and system audits.</p>
          <h4>Analysis and prioritization</h4>
          <p>Not every finding is real or urgent. <b>Confirmation</b> separates true issues from <b>false positives</b>, and you must also worry about <b>false negatives</b>, real problems the scan missed, which are more dangerous because they hide. To prioritize, analysts use a <b>CVE</b>, the unique identifier for a specific vulnerability, and its <b>CVSS</b> score from 0 to 10 that rates severity, then weigh <b>exposure factor</b>, <b>environmental variables</b>, organizational impact, and <b>risk tolerance</b> to decide what to fix first.</p>
          <h4>Response and validation</h4>
          <p>Remediation options include <b>patching</b>, <b>segmentation</b>, <b>compensating controls</b> when a patch is not yet possible, transferring risk through <b>insurance</b>, and formally documented <b>exceptions and exemptions</b> when a risk is knowingly accepted. After acting, you validate through <b>rescanning</b>, <b>audit</b>, and <b>verification</b>, and you close the loop with <b>reporting</b> so stakeholders see the current risk picture.</p>`},
        {id:"t44",name:"4.4 Monitoring",html:`
          <h3>Security alerting and monitoring</h3>
          <p>Monitoring gives you the visibility to notice problems across <b>systems, applications, and infrastructure</b>. The core activities are <b>log aggregation</b> to pull data together, <b>alerting</b> to flag suspicious events, <b>scanning</b>, <b>reporting</b>, and <b>archiving</b>, followed by <b>alert response and remediation</b> that may include <b>quarantine</b> of a suspect host and <b>alert tuning</b> to reduce noise.</p>
          <div class="diagram">${SVG.siem()}<div class="cap">Logs flow into a SIEM for correlation; SOAR automates the response</div></div>
          <h4>The tools</h4>
          <p>The centerpiece is the <b>SIEM</b>, which collects and correlates logs from everywhere into alerts and supports investigation and reporting. Around it sit many tools: <b>SCAP</b> and <b>benchmarks</b> for standardized, automated configuration checks, <b>agent-based or agentless</b> collection depending on how much depth you need versus ease of deployment, <b>antivirus</b>, <b>data loss prevention</b> to stop sensitive data leaving, <b>SNMP traps</b> for device events, <b>NetFlow</b> for traffic flow metadata, and <b>vulnerability scanners</b>. A common exam skill is matching the tool to the goal: SIEM for correlation, DLP for exfiltration, NetFlow for traffic patterns.</p>`},
        {id:"t45",name:"4.5 Enterprise Controls",html:`
          <h3>Modifying enterprise capabilities to enhance security</h3>
          <p>This objective is a tour of the controls that defend the enterprise, and the exam expects you to know what each one does. <b>Firewalls</b> enforce rules, access lists, and allowed ports and protocols, and create <b>screened subnets</b>. <b>IDS and IPS</b> detect and, for IPS, block based on signatures and trends. <b>Web filters</b> control browsing through agent-based or centralized proxy deployment, URL scanning, content categorization, block rules, and <b>reputation</b> scoring. Operating systems are locked down with <b>Group Policy</b> on Windows and <b>SELinux</b> on Linux.</p>
          <h4>Protocols, email, and data</h4>
          <p>Secure operations depend on choosing <b>secure protocols</b>, the right ports, and safe transport, and on <b>DNS filtering</b> to block malicious domains at resolution. Email security combines three mechanisms worth memorizing: <b>SPF</b> lists which servers may send for a domain, <b>DKIM</b> adds a cryptographic signature, and <b>DMARC</b> ties them together with a handling policy and reporting to fight spoofing. <b>File integrity monitoring</b> catches unauthorized changes, and <b>DLP</b> again guards against data leaving.</p>
          <h4>Detection and access</h4>
          <p>On endpoints, <b>EDR</b> continuously detects and responds, and <b>XDR</b> extends that correlation across endpoints, network, cloud, and email. <b>Network access control</b> checks a device's posture before letting it on the network, and <b>user behavior analytics</b> spots anomalies in how accounts act. This objective also touches identity operations like provisioning and de-provisioning accounts and assigning permissions, which connects directly to the identity work in the next objective.</p>`},
        {id:"t46",name:"4.6 Identity & Access",html:`
          <h3>Identity and access management</h3>
          <p>Identity and access management decides who can do what, and it is one of the most heavily tested areas of the exam. Accounts are <b>provisioned</b> when people join and <b>de-provisioned</b> promptly when they leave, with <b>permission assignments</b> kept tight. <b>Identity proofing</b> verifies a person really is who they claim before credentials are issued. <b>Federation</b> extends trust across organizations so one identity works across domains, and <b>single sign-on</b> lets a user authenticate once to reach many systems.</p>
          <h4>The identity protocols</h4>
          <p>Three names get confused constantly, so anchor them. <b>SAML</b> uses XML assertions for browser-based enterprise SSO. <b>OAuth</b> is an authorization framework that grants delegated access with tokens, common for apps and APIs. <b>LDAP</b> queries and authenticates against a directory. If a scenario is about a web app logging you into a partner site, think SAML; if it is about granting an app limited access to your data without your password, think OAuth.</p>
          <h4>Access control models and stronger authentication</h4>
          <p>Five access control models appear repeatedly. <b>MAC</b> enforces access with system-set labels users cannot change. <b>DAC</b> lets the data owner decide. <b>RBAC</b> grants by role. <b>Rule-based</b> uses defined rules like ACLs. <b>ABAC</b> decides from attributes such as user, resource, and context. Layered on top, <b>multifactor authentication</b> combines factors from different categories: something you know, something you have, something you are, and somewhere you are, implemented through biometrics, hardware or soft tokens, and security keys. <b>Password practices</b> favor length over complexity and discourage reuse, while <b>passwordless</b> approaches remove the password entirely. Finally, <b>privileged access management</b> secures powerful accounts with just-in-time permissions, password vaulting, and ephemeral credentials that exist only as long as needed.</p>`},
        {id:"t47",name:"4.7 Automation",html:`
          <h3>Automation and orchestration</h3>
          <p>Automation and orchestration take repetitive security work off human hands and make it fast, consistent, and scalable. Common <b>use cases</b> include automated <b>user and resource provisioning</b>, <b>guard rails</b> that keep deployments within safe boundaries, managing <b>security groups</b>, <b>ticket creation</b> and <b>escalation</b>, enabling or disabling services and access, <b>continuous integration and testing</b>, and connecting systems through <b>APIs</b>.</p>
          <h4>Benefits and tradeoffs</h4>
          <p>The <b>benefits</b> are real: efficiency and time savings, enforced baselines, standard configurations, secure scaling, faster reaction time, and acting as a workforce multiplier so a small team covers more ground. But automation is not free of risk. The <b>considerations</b> include added <b>complexity</b>, <b>cost</b>, the danger of creating a <b>single point of failure</b>, accumulating <b>technical debt</b>, and the need for <b>ongoing supportability</b>. A poorly designed automation can propagate a mistake everywhere at once, so guard rails and testing matter.</p>`},
        {id:"t48",name:"4.8 Incident Response",html:`
          <h3>Incident response</h3>
          <p>When prevention fails, incident response limits the damage and restores normal operations. The lifecycle has seven phases that you should know cold and in order: <b>preparation</b>, <b>detection</b>, <b>analysis</b>, <b>containment</b>, <b>eradication</b>, <b>recovery</b>, and <b>lessons learned</b>. It is a loop, because lessons learned feed straight back into better preparation. Containment stops the spread, eradication removes the threat, and recovery brings systems safely back.</p>
          <div class="diagram">${SVG.irLifecycle()}<div class="cap">The incident response lifecycle, aligned with NIST SP 800-61</div></div>
          <h4>Readiness and investigation</h4>
          <p>Teams stay ready through <b>training</b> and <b>testing</b>, using <b>tabletop exercises</b> to talk through scenarios and <b>simulations</b> for realism. After an incident, <b>root cause analysis</b> finds why it happened so it will not recur, and <b>threat hunting</b> proactively looks for adversaries that slipped past defenses. When evidence matters legally, <b>digital forensics</b> applies discipline: a <b>legal hold</b> preserves relevant data, <b>chain of custody</b> documents every handoff to keep evidence admissible, and careful <b>acquisition</b>, <b>preservation</b>, <b>reporting</b>, and <b>e-discovery</b> ensure the investigation holds up.</p>`},
        {id:"t49",name:"4.9 Investigation Data",html:`
          <h3>Using data sources to support an investigation</h3>
          <p>An investigation is only as good as the data behind it, and this objective is about knowing where to look. <b>Log data</b> is the backbone: <b>firewall logs</b> show allowed and denied traffic, <b>application logs</b> record software behavior, <b>endpoint logs</b> and <b>OS-specific security logs</b> capture host activity, <b>IPS and IDS logs</b> show detected threats, and <b>network logs</b> trace communications. <b>Metadata</b>, the data about data such as timestamps and senders, often provides the crucial who, when, and where.</p>
          <h4>Beyond logs</h4>
          <p>Other sources round out the picture. <b>Vulnerability scans</b> reveal weaknesses that may have been exploited, <b>automated reports</b> and <b>dashboards</b> summarize status and surface trends quickly, and <b>packet captures</b> record the actual contents of network traffic for the deepest analysis. The exam skill is matching the question to the source: to investigate a suspected firewall bypass you read firewall logs, and to see exactly what was sent over the wire you examine a packet capture.</p>`}
      ],

      id:"d5", n:5, name:"Security Program Management & Oversight", weight:20, ready:true,
      objectives:"5.1 governance · 5.2 risk management · 5.3 third-party risk · 5.4 compliance · 5.5 audits & assessments · 5.6 security awareness",
      flashcards:[
        {tag:"Obj 5.1",term:"Governance",def:"The overall system of policies, standards, procedures, and oversight structures that directs and controls how security is run. It sets the rules and the accountability, from the board down to daily procedures."},
        {tag:"Obj 5.1",term:"Policy vs Standard vs Procedure",def:"A policy is a high-level statement of intent (what and why). A standard is a specific mandatory requirement (for example minimum password length). A procedure is the step-by-step how-to. Guidelines are recommended, not mandatory."},
        {tag:"Obj 5.1",term:"Acceptable Use Policy (AUP)",def:"A policy defining how employees may use organizational systems and data, and what is prohibited. Signed at onboarding, it sets expectations and supports enforcement."},
        {tag:"Obj 5.1",term:"Data Roles",def:"Owner is accountable for the data. Controller determines why and how it is processed. Processor handles it on the controller's behalf. Custodian or steward manages it day to day (storage, protection)."},
        {tag:"Obj 5.1",term:"Governance Structures",def:"Who provides oversight: boards, committees, and government entities. Governance can be centralized (one authority) or decentralized (distributed across units), each with tradeoffs in consistency versus flexibility."},
        {tag:"Obj 5.2",term:"Risk Identification & Assessment",def:"Identification finds risks; assessment evaluates them. Assessments can be one-time, ad hoc, recurring, or continuous, depending on how often the organization re-examines its risk."},
        {tag:"Obj 5.2",term:"Qualitative vs Quantitative Risk",def:"Qualitative analysis rates risk subjectively (high, medium, low). Quantitative analysis uses numbers and money, such as SLE, ARO, and ALE, to express expected loss."},
        {tag:"Obj 5.2",term:"SLE, ARO, ALE",def:"Single Loss Expectancy = Asset Value multiplied by Exposure Factor. Annualized Rate of Occurrence is how many times per year it is expected. Annualized Loss Expectancy = SLE multiplied by ARO."},
        {tag:"Obj 5.2",term:"Risk Appetite vs Tolerance",def:"Risk appetite is the broad level of risk an organization is willing to pursue (expansionary, neutral, or conservative). Risk tolerance is the acceptable variation around a specific risk."},
        {tag:"Obj 5.2",term:"Risk Response Strategies",def:"Transfer (shift to a third party, like insurance), Accept (acknowledge and take no action, sometimes via exception), Avoid (stop the risky activity), or Mitigate (reduce with controls)."},
        {tag:"Obj 5.2",term:"Risk Register",def:"A living record of identified risks, each with a risk owner, key risk indicators, and a defined threshold. It is the central tool for tracking and reporting risk."},
        {tag:"Obj 5.2",term:"BIA: RTO, RPO, MTTR, MTBF",def:"Recovery Time Objective is how fast you must restore a system. Recovery Point Objective is how much data loss (time) is acceptable. MTTR is mean time to repair. MTBF is mean time between failures."},
        {tag:"Obj 5.3",term:"Third-Party Risk",def:"Risk introduced through vendors, suppliers, and partners. Managed through vendor assessment, due diligence in selection, contractual agreements, and ongoing monitoring."},
        {tag:"Obj 5.3",term:"Right-to-Audit Clause",def:"A contract term letting the customer audit the vendor's security controls, ensuring the vendor actually meets agreed requirements rather than just claiming to."},
        {tag:"Obj 5.3",term:"MOU vs MOA",def:"A Memorandum of Understanding is a non-binding statement of intent between parties. A Memorandum of Agreement is more formal, defining specific responsibilities, though still often not a full contract."},
        {tag:"Obj 5.3",term:"SLA vs MSA vs SOW",def:"An SLA defines measurable service levels and penalties. An MSA sets master terms for an ongoing relationship. A Statement of Work (or Work Order) details the specific tasks and deliverables of a project."},
        {tag:"Obj 5.3",term:"NDA & BPA",def:"A Non-Disclosure Agreement legally protects shared confidential information. A Business Partners Agreement governs the terms and responsibilities between business partners."},
        {tag:"Obj 5.4",term:"Consequences of Non-Compliance",def:"Failing to meet legal or regulatory requirements can bring fines, sanctions, reputational damage, loss of license, and contractual impacts. Compliance is a business risk, not just paperwork."},
        {tag:"Obj 5.4",term:"Controller vs Processor",def:"In privacy law, the controller decides why and how personal data is processed and bears primary responsibility. The processor acts only on the controller's instructions."},
        {tag:"Obj 5.4",term:"Right to Be Forgotten",def:"A privacy right allowing a data subject to request deletion of their personal data. Part of regulations like the GDPR, with local, national, and global variations."},
        {tag:"Obj 5.4",term:"Due Care vs Due Diligence",def:"Due diligence is the investigation and ongoing effort to understand risks (doing your homework). Due care is acting reasonably to address them (taking prudent action)."},
        {tag:"Obj 5.4",term:"Attestation",def:"A formal declaration, often signed, that controls are in place and requirements are met. Used in compliance to hold parties accountable for their statements."},
        {tag:"Obj 5.5",term:"Internal vs External Audit",def:"Internal audits and self-assessments are run by the organization itself, sometimes overseen by an audit committee. External audits are performed by outside parties, including regulators and independent third parties, giving greater objectivity."},
        {tag:"Obj 5.5",term:"Pen Test Environments",def:"Known environment (white box) gives full information, unknown environment (black box) gives none, and partially known (gray box) gives some. They trade realism against efficiency."},
        {tag:"Obj 5.5",term:"Passive vs Active Reconnaissance",def:"Passive recon gathers information without touching the target (public records, OSINT). Active recon interacts directly (scanning, probing), which is more revealing but more detectable."},
        {tag:"Obj 5.6",term:"Security Awareness Training",def:"Ongoing education so users recognize threats and act safely. Covers phishing, social engineering, password management, removable media, insider threat, and secure remote work."},
        {tag:"Obj 5.6",term:"Phishing Campaigns",def:"Simulated phishing sent to employees to measure and build resistance. Success is judged by recognition and proper reporting of suspicious messages, and results guide further training."},
        {tag:"Obj 5.6",term:"Anomalous Behavior Recognition",def:"Training users and systems to spot behavior that is risky, unexpected, or unintentional, so potential insider threats or compromised accounts are noticed and reported."}
      ],
      questions:[
        {obj:"5.1",q:"Which document is a high-level statement of management intent, such as committing the organization to protect customer data?",opts:["A policy","A procedure","A standard","A packet capture"],a:0,e:"A policy is a high-level statement of intent. Standards give specific requirements and procedures give step-by-step instructions. (Obj 5.1)"},
        {obj:"5.1",q:"A rule requiring all passwords to be at least 14 characters is best classified as a:",opts:["Standard","Policy","Guideline","Playbook"],a:0,e:"A standard is a specific mandatory requirement that supports a broader policy. (Obj 5.1)"},
        {obj:"5.1",q:"Which document defines how employees may and may not use company systems, and is typically signed during onboarding?",opts:["Acceptable use policy","Business impact analysis","Service-level agreement","Risk register"],a:0,e:"The acceptable use policy (AUP) sets expectations for appropriate use of organizational systems and data. (Obj 5.1)"},
        {obj:"5.1",q:"In data governance, who determines the purposes and means for processing personal data?",opts:["The data controller","The data custodian","The data processor","The end user"],a:0,e:"The controller decides why and how data is processed; the processor acts on the controller's behalf and the custodian handles day-to-day protection. (Obj 5.1)"},
        {obj:"5.1",q:"A step-by-step incident response playbook is an example of a:",opts:["Procedure","Policy","Standard","Guideline"],a:0,e:"Procedures, including playbooks, provide the detailed how-to steps that carry out policies and standards. (Obj 5.1)"},
        {obj:"5.1",q:"An organization concentrates all security decision-making in a single central authority. This governance approach is:",opts:["Centralized","Decentralized","Ad hoc","Federated"],a:0,e:"Centralized governance places authority in one place, improving consistency but reducing local flexibility compared with decentralized structures. (Obj 5.1)"},
        {obj:"5.1",q:"The data custodian or steward is primarily responsible for:",opts:["Day-to-day storage, protection, and management of the data","Deciding the purpose of processing","Signing vendor contracts","Setting the company mission"],a:0,e:"The custodian or steward handles the hands-on protection and management of data, distinct from the owner or controller who set direction. (Obj 5.1)"},
        {obj:"5.1",q:"Laws and regulations that vary by local, regional, national, and global jurisdiction are examples of which governance input?",opts:["External considerations","Internal playbooks","Risk appetite","A honeypot"],a:0,e:"External considerations such as regulatory, legal, and industry requirements shape governance and differ across jurisdictions. (Obj 5.1)"},
        {obj:"5.2",q:"Which formula correctly expresses Single Loss Expectancy?",opts:["Asset Value multiplied by Exposure Factor","SLE multiplied by ARO","Asset Value divided by ARO","Exposure Factor multiplied by ARO"],a:0,e:"SLE = Asset Value x Exposure Factor. It represents the expected loss from one occurrence. (Obj 5.2)"},
        {obj:"5.2",q:"If the SLE is 10,000 dollars and the event is expected twice per year, what is the Annualized Loss Expectancy?",opts:["20,000 dollars","10,000 dollars","5,000 dollars","2,000 dollars"],a:0,e:"ALE = SLE x ARO = 10,000 x 2 = 20,000 dollars per year. (Obj 5.2)"},
        {obj:"5.2",q:"A risk analysis that rates risks as high, medium, or low without assigning dollar values is:",opts:["Qualitative","Quantitative","Annualized","Continuous"],a:0,e:"Qualitative analysis uses subjective ratings, while quantitative analysis uses numeric and monetary values like SLE and ALE. (Obj 5.2)"},
        {obj:"5.2",q:"A company buys cyber insurance to offset the financial impact of a breach. Which risk response is this?",opts:["Transfer","Accept","Avoid","Mitigate"],a:0,e:"Transferring risk shifts its financial impact to a third party, such as an insurer. (Obj 5.2)"},
        {obj:"5.2",q:"An organization decides to discontinue a risky product line entirely to eliminate its associated risk. This strategy is:",opts:["Avoid","Transfer","Accept","Mitigate"],a:0,e:"Risk avoidance stops the activity that generates the risk altogether. (Obj 5.2)"},
        {obj:"5.2",q:"Deploying additional controls to reduce the likelihood or impact of a risk is which response?",opts:["Mitigate","Accept","Transfer","Avoid"],a:0,e:"Mitigation reduces risk by applying controls that lower its probability or consequences. (Obj 5.2)"},
        {obj:"5.2",q:"Management formally acknowledges a low-level risk and chooses to take no further action, documenting the decision. This is:",opts:["Acceptance","Avoidance","Transference","Mitigation"],a:0,e:"Risk acceptance recognizes a risk and consciously takes no additional action, often within tolerance and documented as an exception. (Obj 5.2)"},
        {obj:"5.2",q:"Which term describes the maximum acceptable amount of data loss measured in time after an incident?",opts:["Recovery Point Objective (RPO)","Recovery Time Objective (RTO)","Mean time to repair (MTTR)","Annualized rate of occurrence (ARO)"],a:0,e:"RPO defines how far back in time data loss is tolerable, guiding backup frequency. RTO is how quickly service must be restored. (Obj 5.2)"},
        {obj:"5.2",q:"Recovery Time Objective (RTO) specifies:",opts:["The maximum acceptable time to restore a system after an outage","The acceptable amount of data loss","The average time between failures","The number of incidents per year"],a:0,e:"RTO is the target time to bring a system back online after disruption. (Obj 5.2)"},
        {obj:"5.2",q:"A central record listing each identified risk with its owner, indicators, and threshold is a:",opts:["Risk register","Business partners agreement","Chain of custody","Site survey"],a:0,e:"A risk register tracks risks along with risk owners, key risk indicators, and thresholds. (Obj 5.2)"},
        {obj:"5.2",q:"A startup pursuing rapid growth is willing to take on significant risk to gain market share. Its risk appetite is best described as:",opts:["Expansionary","Conservative","Neutral","Zero"],a:0,e:"An expansionary risk appetite accepts greater risk in pursuit of growth, versus a conservative appetite that minimizes it. (Obj 5.2)"},
        {obj:"5.2",q:"Mean Time Between Failures (MTBF) measures:",opts:["The average time a system operates before it fails","The time to repair a failed system","The acceptable data loss window","The cost of a single loss"],a:0,e:"MTBF is the average operational time between failures, a reliability metric; MTTR is the average time to repair. (Obj 5.2)"},
        {obj:"5.3",q:"A contract clause allowing a customer to inspect a vendor's security controls directly is a:",opts:["Right-to-audit clause","Non-disclosure agreement","Recovery point objective","Risk threshold"],a:0,e:"A right-to-audit clause lets the customer verify the vendor's controls rather than relying on assurances. (Obj 5.3)"},
        {obj:"5.3",q:"Which agreement is a non-binding statement of intent between two parties?",opts:["Memorandum of understanding (MOU)","Service-level agreement (SLA)","Statement of work (SOW)","Business partners agreement (BPA)"],a:0,e:"An MOU expresses mutual intent without the binding force of a contract. An MOA is more formal, and an SLA defines measurable service commitments. (Obj 5.3)"},
        {obj:"5.3",q:"Which document defines measurable service levels, such as uptime, and the penalties for missing them?",opts:["Service-level agreement (SLA)","Non-disclosure agreement (NDA)","Memorandum of understanding (MOU)","Master service agreement (MSA)"],a:0,e:"An SLA specifies the service metrics a provider must meet and consequences for falling short. (Obj 5.3)"},
        {obj:"5.3",q:"Two companies sign a document legally protecting confidential information they will share. This is an:",opts:["Non-disclosure agreement (NDA)","Statement of work (SOW)","Service-level agreement (SLA)","Acceptable use policy (AUP)"],a:0,e:"An NDA legally binds parties to protect shared confidential information. (Obj 5.3)"},
        {obj:"5.3",q:"Investigating a potential vendor's financial stability, security posture, and reputation before signing is called:",opts:["Due diligence","Attestation","Journaling","Alert tuning"],a:0,e:"Due diligence is the investigation performed before entering a relationship to understand the vendor's risk. (Obj 5.3)"},
        {obj:"5.3",q:"A master service agreement (MSA) primarily serves to:",opts:["Set overarching terms for an ongoing relationship so future work needs only a short order","Define one project's specific deliverables","Protect confidential information","Measure uptime"],a:0,e:"An MSA establishes master terms once; individual projects are then handled with a work order or statement of work. (Obj 5.3)"},
        {obj:"5.3",q:"Analyzing the risks introduced by a vendor's own suppliers and dependencies is called:",opts:["Supply chain analysis","Penetration testing","Right-to-be-forgotten","Attestation"],a:0,e:"Supply chain analysis examines risk beyond the direct vendor to their suppliers and dependencies. (Obj 5.3)"},
        {obj:"5.4",q:"Which is a direct consequence an organization may face for failing to meet regulatory requirements?",opts:["Fines, sanctions, and loss of license","Faster network speeds","Automatic risk acceptance","Reduced attack surface"],a:0,e:"Non-compliance can bring fines, sanctions, reputational damage, loss of license, and contractual impacts. (Obj 5.4)"},
        {obj:"5.4",q:"Under privacy regulations, a data subject requests that their personal data be deleted. This right is the:",opts:["Right to be forgotten","Right-to-audit clause","Recovery point objective","Chain of custody"],a:0,e:"The right to be forgotten lets individuals request erasure of their personal data, a feature of regulations like GDPR. (Obj 5.4)"},
        {obj:"5.4",q:"Which best distinguishes due diligence from due care?",opts:["Due diligence is investigating risks; due care is acting reasonably to address them","They are identical","Due care comes before due diligence always","Due diligence means ignoring risk"],a:0,e:"Due diligence is doing the homework to understand risk; due care is taking prudent action based on it. (Obj 5.4)"},
        {obj:"5.4",q:"A signed statement declaring that required security controls are in place is an example of:",opts:["Attestation","A packet capture","A honeytoken","A load balancer"],a:0,e:"Attestation is a formal, often signed, declaration used in compliance to affirm that controls or requirements are met. (Obj 5.4)"},

      topics:[
        {id:"t5ov",name:"Overview",html:`
          <h3>What Domain 5 covers and what to expect</h3>
          <p>Security Program Management and Oversight is 20 percent of the exam and represents the management and governance side of security. If Domain 4 was the hands-on work, Domain 5 is the leadership layer above it: the policies, risk decisions, vendor relationships, compliance obligations, audits, and training that hold a program together. Many people from technical backgrounds find this the least familiar domain, so it rewards focused study.</p>
          <p>Six objectives sit here. <b>5.1</b> is governance, the structure of policies, standards, and roles. <b>5.2</b> is the risk management process, including the few formulas the exam expects you to calculate. <b>5.3</b> is third-party and vendor risk, heavy on agreement types. <b>5.4</b> is compliance and privacy. <b>5.5</b> is audits and assessments, including penetration testing types. <b>5.6</b> is security awareness training.</p>
          <p>Expect definition and scenario questions rather than deeply technical ones. The highest-value things to lock in are the risk formulas (SLE equals asset value times exposure factor, and ALE equals SLE times ARO), the difference between the risk response strategies (transfer, accept, avoid, mitigate), the many vendor agreement acronyms (SLA, MOU, MOA, MSA, SOW, NDA, BPA), the data and privacy roles (owner, controller, processor, custodian), and the penetration testing environments (known, partially known, unknown). Get those straight and this domain becomes very approachable.</p>`},
        {id:"t51",name:"5.1 Governance",html:`
          <h3>Effective security governance</h3>
          <p>Governance is the framework that directs and controls security. It is built from a hierarchy of documents. A <b>policy</b> is a high-level statement of intent, such as a commitment to protect customer data. A <b>standard</b> is a specific, mandatory requirement that supports a policy, like a minimum password length. A <b>procedure</b> is the detailed step-by-step how-to, and a <b>playbook</b> is a procedure for a specific scenario. <b>Guidelines</b> sit apart as recommended, not mandatory, best practice. Knowing which is which is a common exam question.</p>
          <h4>The documents that matter</h4>
          <p>CompTIA lists several key policies to recognize: the <b>acceptable use policy</b>, general information security policies, <b>business continuity</b> and <b>disaster recovery</b> policies, the <b>incident response</b> policy, the <b>software development lifecycle</b> policy, and the <b>change management</b> policy. Standards commonly cover passwords, access control, physical security, and encryption. Procedures include change management, onboarding and offboarding, and playbooks.</p>
          <h4>Structures, roles, and external forces</h4>
          <p>Oversight comes from governance structures such as <b>boards</b>, <b>committees</b>, and government entities, and can be organized in a <b>centralized</b> or <b>decentralized</b> way, trading consistency against flexibility. Clear <b>roles</b> assign accountability: the <b>owner</b> is accountable for the data, the <b>controller</b> determines why and how it is processed, the <b>processor</b> acts on the controller's behalf, and the <b>custodian or steward</b> handles day-to-day protection. Finally, governance must answer to <b>external considerations</b>, the regulatory, legal, and industry requirements that vary across local, regional, national, and global jurisdictions, and it must include ongoing <b>monitoring and revision</b> so it stays current.</p>`},
        {id:"t52",name:"5.2 Risk Management",html:`
          <h3>The risk management process</h3>
          <p>Risk management is a continuous cycle: identify risks, assess and analyze them, respond, and monitor. Assessments vary in cadence, from <b>one-time</b> and <b>ad hoc</b> to <b>recurring</b> and <b>continuous</b>, with continuous giving the most current picture. Analysis comes in two flavors. <b>Qualitative</b> analysis rates risk subjectively as high, medium, or low, which is quick but imprecise. <b>Quantitative</b> analysis puts numbers and money on risk, and this is where the exam's formulas live.</p>
          <div class="diagram">${SVG.riskMgmt()}<div class="cap">The risk management cycle and the four response strategies</div></div>
          <h4>The formulas to memorize</h4>
          <p>Three quantitative terms connect. The <b>Single Loss Expectancy</b> is the money lost in one event, calculated as asset value multiplied by the <b>exposure factor</b>, the percentage of the asset lost. The <b>Annualized Rate of Occurrence</b> is how many times per year the event is expected. The <b>Annualized Loss Expectancy</b> is the yearly expected loss, calculated as SLE multiplied by ARO. If a server worth 50,000 dollars would lose 20 percent in an event that happens twice a year, the SLE is 10,000, and the ALE is 20,000 dollars per year. These numbers justify how much to spend on controls.</p>
          <h4>Appetite, register, and response</h4>
          <p>An organization's <b>risk appetite</b> is the broad level of risk it will pursue, described as expansionary, neutral, or conservative, while <b>risk tolerance</b> is the acceptable variation around a specific risk. Risks are tracked in a <b>risk register</b> with a <b>risk owner</b>, <b>key risk indicators</b>, and a defined <b>threshold</b>. For each risk you choose a response: <b>transfer</b> it to a third party like an insurer, <b>accept</b> it and take no action (sometimes via a documented exception), <b>avoid</b> it by stopping the activity, or <b>mitigate</b> it with controls. Underlying recovery planning, the <b>business impact analysis</b> defines metrics like <b>RTO</b> (how fast to restore), <b>RPO</b> (how much data loss is tolerable), <b>MTTR</b> (mean time to repair), and <b>MTBF</b> (mean time between failures).</p>`},
        {id:"t53",name:"5.3 Third-Party Risk",html:`
          <h3>Third-party risk assessment and management</h3>
          <p>Every vendor, supplier, and partner extends your trust boundary, and their weaknesses can become yours. Managing this starts with <b>vendor assessment</b>, using tools like <b>penetration testing</b>, a <b>right-to-audit clause</b> that lets you inspect their controls, <b>evidence of internal audits</b>, <b>independent assessments</b>, and <b>supply chain analysis</b> that looks past the vendor to their own suppliers. <b>Vendor selection</b> depends on <b>due diligence</b>, the investigation of a vendor's stability and security, and on identifying any <b>conflict of interest</b>.</p>
          <h4>The agreement types</h4>
          <p>The exam tests a cluster of agreement acronyms, so anchor each one. An <b>SLA</b> defines measurable service levels and penalties. An <b>MOU</b> is a non-binding statement of intent, and an <b>MOA</b> is a more formal version defining responsibilities. An <b>MSA</b> sets master terms for an ongoing relationship, under which a <b>work order or statement of work</b> details a specific project. An <b>NDA</b> protects shared confidential information, and a <b>BPA</b> governs the terms between business partners. Once a vendor is engaged, ongoing <b>vendor monitoring</b>, security <b>questionnaires</b>, and clear <b>rules of engagement</b> keep the relationship controlled.</p>`},
        {id:"t54",name:"5.4 Compliance",html:`
          <h3>Effective security compliance</h3>
          <p>Compliance means meeting the legal, regulatory, and contractual obligations that apply to the organization, and it is a genuine business risk. <b>Compliance reporting</b> can be <b>internal</b>, to management, or <b>external</b>, to regulators. The <b>consequences of non-compliance</b> are concrete: <b>fines</b>, <b>sanctions</b>, <b>reputational damage</b>, <b>loss of license</b>, and <b>contractual impacts</b>. This is why compliance is treated as a priority rather than paperwork.</p>
          <h4>Monitoring and privacy</h4>
          <p><b>Compliance monitoring</b> relies on <b>due diligence and due care</b>, on <b>attestation and acknowledgement</b> where parties formally affirm their controls, and increasingly on <b>automation</b> to check controls continuously. Remember the distinction: <b>due diligence</b> is investigating to understand risk, while <b>due care</b> is taking reasonable action on it. Much of compliance today centers on <b>privacy</b>. Laws carry <b>legal implications</b> that differ locally, nationally, and globally, and they define key roles: the <b>data subject</b> whose data it is, and the <b>controller versus processor</b> distinction where the controller sets purpose and the processor acts on instructions. Organizations must manage <b>ownership</b>, keep a <b>data inventory</b> with <b>retention</b> rules, and honor rights like the <b>right to be forgotten</b>, which lets individuals request deletion of their data.</p>`},
        {id:"t55",name:"5.5 Audits & Assessments",html:`
          <h3>Types and purposes of audits and assessments</h3>
          <p>Audits and assessments verify that security actually works as claimed. They split into internal and external. <b>Internal</b> reviews include <b>compliance</b> checks, oversight by an <b>audit committee</b>, and <b>self-assessments</b> run by the organization itself, which are convenient but less objective. <b>External</b> reviews include <b>regulatory</b> examinations, formal <b>assessments</b>, and the <b>independent third-party audit</b>, which offers the greatest objectivity because an outside party performs it.</p>
          <h4>Penetration testing</h4>
          <p><b>Penetration testing</b> is a hands-on assessment that simulates real attacks. It can be <b>physical</b>, <b>offensive</b>, <b>defensive</b>, or <b>integrated</b>, and it is defined by how much the tester knows. A <b>known environment</b> (white box) test gives full information for thoroughness, an <b>unknown environment</b> (black box) test gives none for realism, and a <b>partially known</b> (gray box) test lands in between. Testing begins with <b>reconnaissance</b>, which is <b>passive</b> when it gathers information from public sources without touching the target, and <b>active</b> when it directly scans and probes, yielding more detail at the cost of being more detectable.</p>`},
        {id:"t56",name:"5.6 Security Awareness",html:`
          <h3>Security awareness practices</h3>
          <p>People are both the biggest attack surface and the first line of defense, which makes awareness a program of its own. A central practice is <b>phishing</b> education: running simulated <b>campaigns</b>, teaching staff to <b>recognize a phishing attempt</b>, and ensuring they know how to <b>respond to and report suspicious messages</b>. Because phishing evolves, this is measured and repeated rather than taught once.</p>
          <h4>Behavior, training, and follow-through</h4>
          <p>Training also builds <b>anomalous behavior recognition</b>, helping people notice actions that are <b>risky</b>, <b>unexpected</b>, or <b>unintentional</b>, which is how many insider threats and compromised accounts are first spotted. Broader <b>user guidance and training</b> covers policies and handbooks, <b>situational awareness</b>, insider threat, <b>password management</b>, <b>removable media</b> and cables, <b>social engineering</b>, operational security, and the specific risks of <b>hybrid and remote work</b>. Finally, an effective program includes <b>reporting and monitoring</b>, both <b>initial</b> and <b>recurring</b>, along with deliberate <b>development</b> and <b>execution</b>, so it is measured, improved, and sustained rather than treated as a one-time event.</p>`}
      ],
