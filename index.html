const WHY={"d1":[["Confidentiality keeps data secret from unauthorized parties, not proof that a sender cannot deny an action.","","Availability ensures access when needed, unrelated to preventing denial of a sent message.","Integrity ensures data is unaltered, not that a sender cannot repudiate sending it."],["Confidentiality concerns unauthorized disclosure, but the records are inaccessible, not leaked.","Integrity concerns unauthorized alteration, but here data is blocked, not changed.","","Authentication verifies identity and is not one of the CIA triad goals affected here."],["Authorization cannot precede authentication; you must prove identity before granting access.","","Accounting is last, not first; identity must be proven before anything else.","Accounting logs activity last, so it cannot come before authorization."],["The Policy Engine decides allow or deny in the control plane; it does not enforce at the resource.","The Policy Administrator executes the decision and manages the session, but does not gate the request itself.","","Threat scope reduction is a zero trust design concept, not an enforcement component."],["","A sandbox isolates code for safe analysis, not a decoy to lure and study attackers.","A jump server is a controlled admin access point, not a decoy system.","A bastion host is a hardened gateway to untrusted networks, not bait for attackers."],["Technical controls are implemented in technology like firewalls, not tangible barriers.","Managerial controls are policies and oversight, not physical structures.","Operational controls are day-to-day human processes, not fences or bollards.",""],["Preventive controls physically stop entry; a sign only discourages, it does not block.","Detective controls identify and record events; a warning sign does neither.","","Corrective controls fix damage after an incident; a sign acts beforehand by discouraging."],["Preventive controls stop incidents before they happen; restoration occurs after compromise.","","Deterrent controls discourage attackers; restoring a backup does not discourage anything.","Directive controls mandate behavior via policy; a restore is remediation, not a directive."],["","Preventive controls stop the threat directly; this is a substitute because patching is not feasible.","Detective controls identify events; VLAN isolation restricts access rather than detecting it.","Deterrent controls discourage attackers; isolation actively limits reach instead."],["Detective controls identify events after they occur; a policy instructs behavior beforehand.","","Compensating controls are alternatives when a primary control fails; an AUP is not a substitute.","Corrective controls fix after an incident; a policy directs behavior, it does not remediate."],["Asymmetric encryption uses a public/private key pair, not a single shared key.","","Hashing is a one-way function that uses no key and does not decrypt.","Public key cryptography is asymmetric, using two different keys, not one shared key."],["The sender's private key signs, but anyone with the public key could then read it, not only the recipient.","The sender's public key would need the sender's private key to decrypt, not the recipient.","","The recipient's private key is secret to the recipient; the sender cannot use it to encrypt."],["A hash cannot be reversed with a key; that describes encryption, not hashing.","","A hash uses no shared secret key; that is symmetric encryption.","A hash does not compress a file for storage; it produces a verification digest."],["Salting does not encrypt or make passwords recoverable; hashing remains one-way.","","Salting does not compress the database; it adds random data per password.","Salting does not speed hashing; it adds work rather than reducing it."],["Salting adds randomness to defeat rainbow tables, not to slow the hashing process.","Key escrow stores recoverable key copies, unrelated to slowing password hashing.","","Tokenization swaps values for vault-mapped tokens, not a password hashing defense."],["","The recipient's public key provides confidentiality, not a signature tied to the sender.","A shared symmetric key cannot give non-repudiation since both parties hold it.","The recipient's private key is secret to the recipient; the sender cannot sign with it."],["PKI does not automatically encrypt all traffic; it manages certificates and trust.","","Storing passwords securely is done with hashing and vaults, not PKI.","Generating random symmetric keys is not the primary purpose of PKI."],["A CRL is a bulk downloaded list, slower and less current than a real-time single check.","","A CSR requests a certificate; it does not check revocation status.","Key escrow stores recoverable keys and has nothing to do with revocation checks."],["The private key never leaves the requester's control; a CSR does not contain it.","","The CA's root certificate is not part of the requester's CSR.","A symmetric session key is unrelated to a certificate signing request."],["Steganography hides data inside other files, not replacing card numbers with tokens.","Masking only hides part of a displayed value; the real number still exists in storage.","","Salting adds randomness before hashing; it does not substitute values via a vault."],["A TPM is a chip bound to a single device, not a network-attached appliance for scale.","","A secure enclave isolates operations within one device, not enterprise key management.","A CRL is a list of revoked certificates, not a key management device."],["Network-attached key management for many servers describes an HSM, not a TPM.","","A list of revoked certificates is a CRL, not a TPM capability.","Hiding data in images is steganography, unrelated to a TPM."],["Key stretching slows password derivation; it does not store recoverable key copies.","","Certificate pinning ties a host to a specific certificate, not key recovery.","Perfect forward secrecy protects past sessions; it does not store keys for recovery."],["Asymmetric is not more secure for bulk data; it is slower and used only for exchange.","","Asymmetric can encrypt limited data; it is avoided for bulk due to speed, not inability.","Asymmetric TLS does require certificates, so that is not why it is limited to the start."],["Impact analysis predicts effects beforehand; it does not describe how to reverse a change.","","A maintenance window is the scheduled time, not the reversal procedure.","An SOP is a repeatable set of steps, not specifically a reversal plan."],["A maintenance window does not eliminate the requirement for change approval.","","It does not remove the need for a backout plan.","It does not automatically test the change."],["Version control tracks change history; skipping it does not directly cause an unreviewed outage.","","Data masking is an obfuscation method, not a change-management step.","Key escrow is key recovery, unrelated to change approval."],["","A deterrent control discourages attackers; updating diagrams is not a control.","Tokenization is data obfuscation, not a change-management practice.","A backout plan defines reversal; it is not updating diagrams after deployment."],["Trusting the internal perimeter is the old model that zero trust explicitly rejects.","","Trusting after initial login grants implicit trust, contrary to zero trust.","Encryption alone does not earn trust; zero trust verifies every request regardless."],["A lock is physical, not technical, and it prevents entry rather than detecting it.","","A lock is not managerial oversight nor a directive policy.","A lock is not an operational process and it prevents rather than corrects."],["Tokenization and masking obscure stored or displayed data, not password hash storage.","","Steganography hides data in files; it does not vary identical password hashes.","Key escrow and CRL concern key recovery and revocation, not password hardening."],["Reversed: encryption, not hashing, is reversible with a key.","","Encryption is reversible with a key, so both are not one-way functions.","Symmetric encryption and hashing use no key pair, so this is false."],["Preventive controls stop the event; an IDS only alerts after traffic has entered.","Deterrent controls discourage attackers; an IDS detects rather than discourages.","","Directive controls mandate behavior via policy; an IDS alert is not a directive."],["Technical controls are implemented in technology, not carried out by staff daily.","","Physical controls protect tangible assets, not training or IR procedures.","Managerial controls are the policies and oversight behind, not the daily human execution."],["An implicit trust zone is what zero trust removes, not a concept that limits reach.","","Accounting logs activity; it does not limit the reachable network scope.","Key escrow is key recovery, unrelated to limiting the blast radius."],["Phishing is a social-engineering email attack, not a physical entry problem.","Shoulder surfing is observing screens or keypads, not unauthorized following.","","SQL injection is a database attack, unrelated to physical entry."],["A sandbox isolates code for safe analysis, not bait credentials that trigger alerts.","A honeypot is a whole decoy system, not just fake credentials placed in a file.","A honeynet is a decoy network, broader than planted fake credentials.",""],["","A penetration test actively exploits weaknesses; it does not compare posture to a framework.","Impact analysis predicts a change's effects, not missing controls versus a framework.","Risk transference shifts risk to a third party; it is not a comparison exercise."],["People authentication involves human users; here certificates authenticate machines.","Accounting logs actions; it is not what certificates are authenticating.","","Availability is a CIA goal, not something being authenticated."],["Version control does not encrypt configuration files.","Scheduling maintenance windows is a separate change-management element.","Approving emergency changes is the approval process, not version control.",""],["A backout plan defines reversal, not identifying downstream dependencies beforehand.","The approval process authorizes the change; it does not map the dependencies.","","Version control tracks change history, not the predicted effects on services."],["File-level encryption protects individual files, not the OS and the whole drive.","","Record-level encryption protects database records, not an entire laptop drive.","Transport encryption protects data in transit, not data at rest on the drive."],["A private single-authority database is the opposite of an open public ledger.","A list of revoked certificates is a CRL, not a blockchain ledger.","","A store of symmetric session keys is unrelated to a blockchain."],["A self-signed certificate is not publicly trusted and does not efficiently cover subdomains.","","A root CA certificate anchors trust; it is not issued to secure subdomains.","A code-signing certificate signs software, not TLS subdomains."],["Self-signed certificates do not necessarily use weak keys; the issue is trust, not key strength.","It can encrypt traffic; the warning concerns identity, not encryption ability.","A self-signed certificate does contain a public key.",""],["A CRL is a list of revoked certificates, not a hardware isolation feature.","","A CSR requests a certificate; it does not isolate operations in hardware.","A honeypot is a decoy system, not a hardware isolation feature."],["","Digital signing uses private-key signing, not Diffie-Hellman key agreement.","Revoking a certificate is done via CRL or OCSP, not Diffie-Hellman.","Hashing a password is a one-way function, unrelated to key exchange."],["Tokenization replaces the entire value with a vault-mapped token, not a partial display.","","Steganography hides data inside other files, not showing partial digits.","Hashing produces an irreversible digest, not a partially visible card number."],["","A firewall rule set is a technical control, not a managerial one.","A door lock is a physical control, not a managerial one.","Restoring from backup is a corrective action, not a managerial control."],["Directive controls direct behavior via policy; these are interim technical safeguards.","Deterrent controls discourage attackers; monitoring and isolation actively protect.","","Corrective controls fix after an incident; these substitute for an unmet requirement."],["Detective controls identify events; a policy instructs behavior beforehand.","Physical is a category, not a control type, and this is a policy.","Compensating controls are alternatives when a primary fails; this is a direct mandate.",""],["","Hashing protects integrity, not confidentiality of data in transit.","Load balancing improves availability, not confidentiality.","Logging supports accounting and detection, not confidentiality."],["Confidentiality concerns disclosure; a checksum mismatch shows alteration, not a leak.","Availability concerns access; the file downloaded, so it was available.","","Non-repudiation ties actions to actors; a checksum verifies integrity, not identity."],["The PEP enforces the decision in the data plane; it does not make the decision.","The subject is the user or device requesting access, not a decision-maker.","An implicit trust zone is what zero trust removes, not a decision component.",""],["","An SOP does not make encryption faster; it standardizes the steps.","An SOP does not grant automatic approval; approval is a separate step.","An SOP has nothing to do with encryption key length."],["A backout plan defines reversal, not the scheduled low-impact time.","Impact analysis predicts effects; it is not the scheduled time.","","Ownership assigns responsibility, not the timing of the change."],["A managerial control is policy and oversight, not an allow-list configuration change.","A deterrent control discourages attackers; an allow list is a technical change.","A root of trust anchors PKI; it is unrelated to allow-list changes.",""],["","Longer keys do not make encryption reversible without a key.","A longer key still requires a key; it does not remove the need for one.","Key length does not convert symmetric encryption into asymmetric."],["Real-time revocation checking is OCSP's role, not the offline root CA's.","The root CA does not generate symmetric keys.","","Data masking is obfuscation, unrelated to a root CA's function."],["","The public key is meant to be shared, not kept secret.","The certificate is distributed publicly, not kept secret.","The CSR is sent to the CA; it is not the secret to protect."]],"d2":[["Unskilled attackers have low sophistication and little funding, not the espionage-driven capability described.","Hacktivists act on political beliefs with limited resources, not well-funded national espionage.","","Shadow IT is unsanctioned internal technology, not an external sophisticated attacker."],["Nation-state actors are highly skilled and resourced, not reliant on prewritten tools.","","Organized crime is profit-driven and capable, not defined by using others' scripts.","Insider threats are defined by misusing legitimate access, not by lack of skill."],["Financial gain motivates organized crime, not a public protest defacement.","","Espionage is covert secret-stealing, not a public statement-making attack.","Blackmail extorts payment, not the aim of a protest defacement."],["A watering hole compromises a trusted website, not misuse of internal credentials.","Shadow IT is unsanctioned technology adoption, not theft by an authorized user.","","A hacktivist is a politically motivated outsider, not a departing employee stealing files."],["Ethical disclosure is responsible research, not criminal ransomware extortion.","Political beliefs motivate hacktivists, not profit-seeking organized crime.","","War is a nation-state motivation, not organized crime's profit motive."],["","An advanced persistent threat is a stealthy nation-state actor, not unapproved internal apps.","A logic bomb is malware triggered by a condition, not unsanctioned technology.","A honeynet is a decoy network to trap attackers, not an unapproved cloud app."],["Level of funding describes resources, not location relative to the organization.","","Sophistication describes capability, not whether the actor is inside or outside.","Motivation describes intent, not the actor's location relative to the organization."],["Service disruption aims to deny availability, not to steal and sell data.","Ethical testing is authorized security improvement, not theft for resale.","","Revenge is a personal grievance motive, not stealing data to sell or leak."],["","Espionage is covert intelligence gathering, not extortion for payment.","Chaos is disruption for its own sake, not leveraging stolen data for money.","Ethical is responsible, well-intentioned action, not extortion."],["Revenge is acting on a grievance, not responsibly reporting flaws.","","Espionage is covert theft of secrets, not responsible disclosure.","Financial gain is a profit motive, not improving security through disclosure."],["Vishing is voice-call phishing, not the email link described here.","","Smishing is SMS text phishing, not an email.","Pretexting invents a false scenario, but the channel here is a fraudulent email link."],["Phishing is email-based social engineering, not a phone call.","Smishing is SMS text phishing, not a voice call.","","Typosquatting registers misspelled look-alike domains, not a phone impersonation."],["","Vishing is voice-call phishing, not an SMS message.","Impersonation is broadly posing as another, not specific to a malicious SMS link.","A watering hole compromises a trusted website, not a text message."],["A watering hole compromises a visited site, not an impersonating executive email.","","Shoulder surfing observes screens in person, not an email wire-transfer scam.","Bloatware is unnecessary preinstalled software, not a social engineering email."],["","Tailgating is following someone through a physical door, not a fabricated auditor story.","Typosquatting registers misspelled domains, not an invented backstory.","Vishing is voice-call phishing; here the technique is the fabricated pretext itself."],["Business email compromise impersonates for fraud, not compromising a visited site.","Brand impersonation copies a company's visual identity, not compromising a trusted site.","","Distributed denial-of-service overwhelms a service, not seeding malware on a visited site."],["Pretexting fabricates a scenario, not registering misspelled domains.","","Smishing is SMS phishing, not a look-alike domain.","Impersonation broadly poses as another, not specifically mistyped-domain registration."],["Open service ports are exposed network services, not a physical USB drop.","","A supply chain attack comes through a trusted vendor, not a dropped USB drive.","Default credentials are unchanged factory passwords, not a malicious USB device."],["","A race condition is a TOC/TOU timing flaw, not an unchanged password.","VM escape is breaking out of a virtual machine, not a device password issue.","A zero-day is an unknown unpatched flaw, not a documented default password."],["A watering hole compromises a visited website, not a poisoned vendor update.","Impersonation is posing as a trusted entity, not inserting code into an update.","","Bluesnarfing steals data over Bluetooth, not a software supply-chain attack."],["","Open service ports are exposed services, not the lack of patches on end-of-life software.","Phishing is social engineering, not the risk of unpatched software.","Salting adds randomness to stored hashes, unrelated to unsupported systems."],["Pretexting fabricates a scenario to extract info, not spreading false narratives to sway opinion.","","A watering hole compromises a visited site, not manipulating beliefs.","Vishing is voice phishing, not spreading false information."],["A race condition is a TOC/TOU timing flaw, not copying a bank's visuals.","Bloatware is unneeded preinstalled software, not a spoofed brand site.","","Directory traversal accesses files outside the web root, not mimicking branding."],["","A root of trust is a hardware trust anchor, the opposite of added exposure.","Longer key length is cryptographic strength, unrelated to an exposed service.","A shorter maintenance window is scheduling, not a consequence of an open port."],["","A race condition exploits TOC/TOU timing, not writing past a buffer.","SQL injection manipulates a database via input, not overwriting memory.","A zero-day is an unknown unpatched flaw, not this specific memory-write technique."],["A misconfiguration is an improper setting, not a check-to-use timing gap.","","Cross-site scripting injects scripts into web pages, not a timing flaw.","A buffer overflow overwrites memory bounds, not a check/use timing gap."],["Directory traversal accesses files outside the web root, not manipulating a login query.","XSS runs scripts in browsers, not bypassing a database login check.","","A buffer overflow overwrites memory, not injecting SQL into a query."],["","SQL injection manipulates a database, not running scripts in visitors' browsers.","VM escape breaks out of a virtual machine, not a stored web script.","A firmware flaw is a hardware-level bug, not injected web content."],["A legacy flaw is a known weakness in outdated systems, not an unknown unpatched one.","A misconfiguration is an improper setting, not an undiscovered vendor flaw.","","A race condition is a TOC/TOU timing flaw, not an unknown unpatched vulnerability."],["","Resource reuse is leftover data in reallocated memory, not breaking VM isolation.","Side loading installs apps from unofficial sources, not escaping a guest VM.","Jailbreaking removes mobile device restrictions, not escaping a hypervisor boundary."],["","VM escape breaks out of a guest to the host, not leftover data in reused memory.","A buffer overflow overwrites memory bounds, not reallocated-memory leakage.","A collision is two inputs sharing a hash, unrelated to reused memory."],["Sandboxing isolates an app to contain it, the opposite of removing restrictions.","","Hardening reduces attack surface, the opposite of weakening the security model.","Segmentation isolates network zones, not removing device restrictions."],["","Jailbreaking removes vendor restrictions for privileges, not installing outside the store.","Tokenization replaces data with tokens, unrelated to app installation.","Segmentation isolates network zones, not installing unofficial apps."],["A zero-day is an unknown unpatched flaw, not a permissive settings error.","A buffer overflow overwrites memory, not an exposed storage bucket.","","A logic bomb is malware triggered by a condition, not a settings error."],["Web-based flaws are issues like SQLi or XSS, not a weak hashing algorithm.","","Hardware vulnerabilities are physical or firmware weaknesses, not a deprecated algorithm.","Mobile vulnerabilities are device-specific risks, not an outdated hash function."],["A zero-day is an unknown unpatched flaw, not unsupported hardware.","A race condition is a TOC/TOU timing flaw, not outdated hardware.","","A misconfiguration is an improper setting, not a lack of vendor support."],["","A race condition is a TOC/TOU timing flaw, not a tampered update.","Directory traversal accesses files outside the web root, not a poisoned update.","A watering hole compromises a visited site, not a tampered software update."],["","Spyware covertly gathers information; it does not encrypt files and demand payment.","Bloatware is unnecessary preinstalled software, not extortion malware.","A keylogger records keystrokes, not encrypting files for ransom."],["A worm self-replicates across networks without user action, not disguised software.","","A virus attaches to a host file and needs execution, not defined by disguise.","A rootkit hides deep in the OS for stealth, not simply masquerading as software."],["","A Trojan is disguised software the user installs, not self-replicating malware.","A logic bomb stays dormant until a trigger, not self-propagating across a network.","Spyware secretly gathers information, not network self-replication."],["Bloatware is unneeded preinstalled software, not kernel-level hiding.","Adware displays unwanted ads, not concealing privileged access.","","A keylogger records keystrokes, not embedding in the kernel for stealth."],["","A worm self-replicates across networks, not a triggered dormant payload.","A Trojan is disguised software, not condition-triggered code.","Spyware covertly steals information, not date- or condition-triggered execution."],["A rootkit hides in the OS for stealthy access, not specifically recording keystrokes.","","A worm is self-replicating malware, not a keystroke recorder.","Bloatware is unnecessary preinstalled software, not credential capture."],["","An on-path attack intercepts traffic between two parties, not amplifying DNS responses.","Credential replay reuses captured auth data, not flooding a victim.","A collision attack finds two inputs with the same hash, unrelated to DDoS."],["An amplification attack multiplies traffic to flood a victim, not relaying between hosts.","","Directory traversal accesses files outside the web root, not intercepting traffic.","Privilege escalation gains higher rights, not relaying communications."],["Password spraying tries common passwords across accounts, not reusing a token.","A birthday attack is a hash-collision probability attack, not replaying a token.","","A downgrade attack forces a weaker protocol, not resending a captured token."],["","Brute forcing one account hammers a single account, risking lockout, not spraying many.","A collision is two inputs sharing a hash, unrelated to password guessing.","A downgrade forces a weaker protocol, not a password-guessing attack."],["Account lockout is repeated failed logins locking an account, not distant logins.","","Out-of-cycle logging is logs at unexpected times, not geographically impossible logins.","Concurrent session usage is simultaneous sessions, not distance-based impossibility."],["A collision attack finds two inputs with one hash, not forcing a weaker protocol.","A birthday attack exploits hash-collision probability, not protocol fallback.","","A replay attack resends captured data, not forcing an older protocol version."],["","A downgrade attack forces a weaker protocol, not finding matching hash inputs.","A spraying attack tries common passwords across accounts, not hash collisions.","An on-path attack intercepts traffic, not finding two inputs with one hash."],["Directory traversal accesses files outside the web root, not gaining higher rights.","Forgery falsifies data or requests, not elevating account privileges.","","Replay resends captured data, not raising permission levels."],["","SQL injection manipulates a database via input, not traversing file paths.","Cross-site scripting runs scripts in browsers, not accessing files outside the web root.","A buffer overflow overwrites memory, not path manipulation with ../ sequences."],["Impossible travel is distant logins too quickly, not gaps in log files.","","Account lockout is locked accounts from failed logins, not deleted log entries.","Concurrent sessions are simultaneous sessions, not missing log data."],["","Patching applies updates to fix flaws, not isolating network zones.","Encryption protects data confidentiality, not limiting lateral movement.","Monitoring provides visibility, not dividing the network into zones."],["Defense in depth is layered controls, not restricting access to role needs.","","Implicit trust grants access by default, the opposite of least privilege.","Full access is unrestricted permissions, the opposite of the minimum necessary."],["Isolation quarantines a compromised host, not applying vendor updates.","Segmentation divides the network into zones, not applying updates.","","Decommissioning retires end-of-life systems, not updating them."],["","Access control lists filter traffic by criteria, not disabling ports and removing software.","Encryption protects data, not reducing attack surface by disabling services.","Monitoring provides visibility, not removing unnecessary software and ports."],["An application allow list permits approved software, not filtering network traffic.","An endpoint protection agent is host antimalware, not a router traffic rule set.","","An isolation zone is a quarantined network segment, not a traffic-filtering rule set."],["","An access control list filters network traffic, not controlling which programs run.","A host intrusion prevention system detects and blocks attacks, not an approved-program list.","A deny list blocks named bad items while allowing the rest, the inverse approach."],["Least privilege minimizes access rights, not quarantining a compromised host.","","Monitoring provides visibility, not cutting off a host's connectivity.","Configuration enforcement keeps settings compliant, not quarantining a host."],["Patching applies updates to a system, not securely retiring it.","Hardening reduces a running system's attack surface, not retiring it.","","Segmentation isolates network zones, not wiping and retiring a server."]],"d3":[["Providers secure the infrastructure, but customers always retain responsibility for their data and access.","","Auditors assess controls; they do not own securing the customer's data.","Cloud security is never automatic; someone must configure and manage it."],["","Manual console setup causes configuration drift and is not repeatable or version-controlled.","Shadow IT is unsanctioned technology use, not a provisioning method.","Air gapping is physical isolation, unrelated to repeatable provisioning."],["On-premises means the customer owns and patches all servers themselves.","","Air-gapped describes network isolation, not an on-demand code execution model.","Clustering links servers for failover but still requires server management."],["Microservices add components and APIs, so they do not remove attack surface.","","Microservices still require encryption between services and for data.","Splitting into services does not inherently prevent privilege escalation."],["Running a full guest OS each describes virtual machines, not containers.","","Containers share one engine and kernel, not a hypervisor per container.","Containers exist to run applications, so this is simply false."],["","Encrypting data at rest concerns storage, not the SDN control plane.","SDN does not remove firewalls; it enables programmable policy.","SDN is logical software control, not physical device isolation."],["","Serverless is on-demand cloud code execution, not physical isolation.","Load balancing distributes traffic; it does not isolate from the internet.","Federation shares identity across domains, the opposite of isolation."],["","ICS/SCADA are typically on-premises operational technology, not cloud-hosted.","They control physical processes and have significant real-world impact.","They are networked, which is precisely part of the security concern."],["","RTOS devices are typically resource-constrained, not unlimited in compute.","All devices, including safety-critical ones, still require security.","An RTOS runs on local embedded hardware, not only in the cloud."],["","A single server is itself a single point of failure, defeating high availability.","Disabling backups undermines recovery and resilience.","Removing load balancers reduces availability rather than improving it."],["","Hybrid clearly adds cross-environment consistency and connection-security challenges.","Hybrid security involves far more than physical security alone.","The shared responsibility model still applies to the cloud portion."],["","Air gapping is physical isolation, not shifting risk to a third party.","Data sovereignty concerns legal jurisdiction of stored data, not risk shifting.","Journaling is a backup logging method, unrelated to transferring risk."],["","IoT devices rarely include enterprise-grade firewalls.","IoT devices are resource-constrained, not endowed with unlimited power.","IoT devices do connect to networks, which is part of their risk."],["","Responsiveness measures speed of response, not capacity to grow.","Ease of recovery concerns restoring after failure, not handling more load.","Power refers to electrical or compute resource, not growth capability."],["","Lacking a single point of management describes decentralized, not centralized.","Centralized architectures can be secured; this claim is false.","Cost is not the defining difference; concentration of control is."],["","Exposing an unpatchable controller to the internet increases risk, not reduces it.","Deleting logs removes evidence and does nothing to protect the controller.","Disabling monitoring reduces visibility, worsening rather than mitigating risk."],["","A single flat network has no trust separation or boundary inspection.","Shadow IT is unsanctioned technology, not a zoning practice.","A honeynet is a decoy network for attackers, not trust-level segmentation."],["Fail-open allows traffic on failure, wrong for a sensitive vault system.","","Fail-safe-open still permits traffic, contradicting the block-on-failure design.","Load balanced describes traffic distribution, not a failure mode."],["","A load balancer distributes traffic; it is not a controlled admin entry point.","A honeypot is a decoy to lure attackers, not an admin access path.","A proxy cache stores web content, not a hardened admin gateway."],["","A reverse proxy fronts servers for inbound traffic, not clients outbound.","A load balancer distributes traffic across servers, not client filtering.","An IDS sensor detects and alerts on traffic, it does not proxy requests."],["","Reversed: an IPS blocks inline and an IDS only alerts, not the other way.","They differ in inline blocking versus passive alerting, so not identical.","Both are network security controls, not physical access controls."],["","A jump server is a single admin entry point, not a request distributor.","A WAF inspects web attacks; it does not spread load across servers.","An air gap isolates systems; it does not distribute traffic."],["","TLS 1.3 encrypts sessions; it is not port-based device authentication.","SNMP is a network management protocol, not access control.","NetFlow monitors traffic flows; it does not authenticate devices."],["","A Layer 4 firewall filters ports and connections, not application-layer web attacks.","A load balancer distributes traffic; it does not inspect for SQLi or XSS.","A network tap copies traffic passively and cannot block attacks."],["","Filtering only by IP and port describes traditional firewalls, not an NGFW.","NGFWs can perform TLS inspection, so 'never' is inaccurate.","An NGFW is a logical network control, not purely a physical control."],["","SMTP is an email transport protocol, not a VPN tunneling protocol.","SNMP is for network management, not tunneling traffic.","LDAP is a directory access protocol, not a tunneling protocol."],["","A hardware UTM bundles functions in one box but is not SD-WAN plus cloud security.","A single on-prem firewall is neither cloud-delivered nor SD-WAN converged.","A honeypot is a decoy system, unrelated to SASE."],["","An inline device sits in the path and can block, unlike this mirrored sensor.","Fail-closed is a failure mode, not a monitoring deployment attribute.","Load balanced describes traffic distribution, not a sensor deployment method."],["","A backup power system is a UPS or generator, not a UTM.","A cloud storage service holds data; a UTM is a security appliance.","A password manager stores credentials, not a bundled threat-management appliance."],["","DMZ placement is about isolation, not making the server faster.","DMZ servers still require patching like any other system.","DMZ placement provides no automatic function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function buildTopNav(){
  const nav=document.getElementById('topNav'); nav.innerHTML='';
  DATA.domains.forEach(d=>{
    const b=el('button','tnav'+(state.view===d.id?' active':''),`D${d.n} <span class="pct">${d.weight}%</span>`);
    b.title=d.name; b.onclick=()=>{state.view=d.id;state.subtab='flash';render();};
    nav.appendChild(b);
  });
  const mock=el('button','tnav special'+(state.view==='mock'?' active':''),'★ Mock Exam');
  mock.onclick=()=>{state.view='mock';render();}; nav.appendChild(mock);
  const samp=el('button','tnav special'+(state.view==='samples'?' active':''),'Official Samples');
  samp.onclick=()=>{state.view='samples';render();}; nav.appendChild(samp);
}

function render(){
  buildTopNav();
  // Stop the live countdown whenever we are not actively displaying the running exam
  if(!(state.view==='mock' && state.mock && state.mock.phase==='exam')) stopMockTimer();
  const main=document.getElementById('main'); main.innerHTML='';
  window.scrollTo(0,0);
  if(state.view==='mock'){renderMock(main);return;}
  if(state.view==='samples'){renderSamples(main);return;}
  const d=DATA.domains.find(x=>x.id===state.view);
  if(!d.ready){main.appendChild(domainHead(d));main.appendChild(placeholder('⚙','Domain '+d.n+' — in progress',d.name+' ('+d.weight+'% of the exam) is being built and fact-checked next. Domain 1 is fully ready for you to validate first.'));return;}
  main.appendChild(domainHead(d));
  main.appendChild(buildSubtabs(d));
  const body=el('div','tab-body'); body.id='tabBody'; main.appendChild(body);
  renderSubtab(d,body);
}

function domainHead(d){
  const h=el('div','section-head');
  h.innerHTML=`<h2>Domain ${d.n}: ${esc(d.name)}</h2><p>${d.weight}% of the exam · ${esc(d.objectives||'')}</p>`;
  return h;
}
function placeholder(ic,title,txt){
  return el('div','placeholder',`<div class="ic">${ic}</div><h3>${esc(title)}</h3><p>${txt}</p>`);
}

function renderQuiz(d,body){
  body.innerHTML='';
  if(!state.qScore[d.id])state.qScore[d.id]={correct:0,answered:0,done:{}};
  const sc=state.qScore[d.id];
  const bar=el('div','score-bar');
  const pct=sc.answered?Math.round(sc.correct/sc.answered*100):0;
  bar.innerHTML=`
    <div class="score-chip"><div class="n">${sc.correct}</div><div class="l">Correct</div></div>
    <div class="score-chip"><div class="n">${sc.answered}</div><div class="l">Answered</div></div>
    <div class="score-chip pct"><div class="n">${pct}%</div><div class="l">Score</div></div>`;
  body.appendChild(bar);
  const reset=el('button','btn ghost','Reset score'); reset.style.cssText='padding:7px 14px;font-size:13px;margin-bottom:14px;';
  reset.onclick=()=>{state.qScore[d.id]={correct:0,answered:0,done:{}};renderQuiz(d,body);};
  body.appendChild(reset);

  d.questions.forEach((q,qi)=>{
    const card=el('div','q-card');
    card.innerHTML=`<div class="q-meta"><span class="q-obj">Obj ${q.obj}</span><span class="q-num">Q${qi+1} of ${d.questions.length}</span></div><div class="q-text">${esc(q.q)}</div>`;
    const opts=el('div','opts');
    const already=sc.done[qi];
    if(!q._order)shuffleOptions(q);
    const dispOpts=q._order.map(i=>q.opts[i]);
    dispOpts.forEach((opt,oi)=>{
      const b=el('button','opt');
      b.innerHTML=`<span class="lt">${String.fromCharCode(65+oi)}</span><span>${esc(opt)}</span>`;
      if(already!=null){
        b.disabled=true;
        if(oi===q._ca)b.classList.add('correct');
        else if(oi===already)b.classList.add('wrong');
      }else{
        b.onclick=()=>answer(d,qi,oi,card,body);
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);
    const ex=el('div','explain'+(already!=null?' show':''));
    if(already!=null){
      const dispWhy=q._order.map(i=>(q._w&&q._w[i])||"");
      ex.innerHTML=explainHTML(q.obj,q.e,dispWhy,already,q._ca);
    }
    card.appendChild(ex);
    body.appendChild(card);
  });
}
function shuffleOptions(q){
  const idx=q.opts.map((_,i)=>i);
  for(let k=idx.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]];}
  q._order=idx; q._ca=idx.indexOf(q.a);
}

/* Builds the explanation block shown after answering: right-answer justification,
   plus why each other option is wrong (the chosen wrong option is flagged).
   whyArr and correctIdx are in DISPLAY order; picked is the display index chosen (or null). */
function explainHTML(obj, e, whyArr, picked, correctIdx){
  const gotRight = picked===correctIdx;
  let items='';
  for(let oi=0;oi<4;oi++){
    if(oi===correctIdx) continue;
    const you = (picked!=null && oi===picked);
    const reason = (whyArr && whyArr[oi]) ? whyArr[oi] : 'This option does not best fit what the question asks.';
    items+=`<div class="why-item${you?' you':''}"><span class="why-lt">${String.fromCharCode(65+oi)}</span><span>${you?'<b>Your answer.</b> ':''}${esc(reason)}</span></div>`;
  }
  const verdict = picked==null ? '' :
    (gotRight ? '<div class="verdict right">Correct</div>' : '<div class="verdict wrong">Not quite — here is why</div>');
  return `${verdict}<span class="tag">Correct answer: ${String.fromCharCode(65+correctIdx)} · Obj ${obj}</span><br>${esc(e)}`
    + `<div class="why-list"><div class="why-head">Why the other options are wrong</div>${items}</div>`;
}
function answer(d,qi,oi,card,body){
  const sc=state.qScore[d.id]; if(sc.done[qi]!=null)return;
  sc.done[qi]=oi; sc.answered++; const q=d.questions[qi];
  if(oi===q._ca)sc.correct++;
  const buttons=card.querySelectorAll('.opt');
  buttons.forEach((b,i)=>{b.disabled=true;if(i===q._ca)b.classList.add('correct');else if(i===oi)b.classList.add('wrong');});
  const dispWhy=q._order.map(i=>(q._w&&q._w[i])||"");
  const exEl=card.querySelector('.explain');
  exEl.innerHTML=explainHTML(q.obj,q.e,dispWhy,oi,q._ca);
  exEl.classList.add('show');
  const sc2=state.qScore[d.id];const pct=Math.round(sc2.correct/sc2.answered*100);
  const chips=body.querySelectorAll('.score-chip .n');
  chips[0].textContent=sc2.correct;chips[1].textContent=sc2.answered;chips[2].textContent=pct+'%';
}

function shuffleArray(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

function buildMockSet(){
  const picked=[];
  MOCK_PLAN.forEach(plan=>{
    const dom=DATA.domains.find(x=>x.id===plan.id);
    const pool=shuffleArray(dom.questions.slice()).slice(0,plan.n);
    pool.forEach(q=>{
      const order=shuffleArray(q.opts.map((_,i)=>i));
      picked.push({
        domainId:dom.id, domainName:dom.name, dnum:dom.n, obj:q.obj, q:q.q,
        opts:order.map(i=>q.opts[i]),
        correct:order.indexOf(q.a),
        e:q.e,
        w:order.map(i=>(q._w&&q._w[i])||"")
      });
    });
  });
  shuffleArray(picked); // interleave domains
  return picked;
}

function renderMock(main){
  const m=state.mock;
  if(!m){ renderMockStart(main); return; }
  if(m.phase==='exam'){ renderMockExam(main); return; }

}

function fmtTime(sec){ sec=Math.max(0,Math.floor(sec)); const mm=Math.floor(sec/60), ss=sec%60; return mm+':'+String(ss).padStart(2,'0'); }

function renderMockExam(main){
  const m=state.mock;
  // Timer bar
  const timer=el('div','timer'); timer.id='mockTimer';
  timer.innerHTML=`<div class="clock" id="mockClock">--:--</div><div class="meta"><span id="answeredCount">0</span> of 90 answered</div>`;
  main.appendChild(timer);

  const wrap=el('div'); wrap.id='mockBody'; main.appendChild(wrap);
  renderMockQuestion();

  // Timer tick
  stopMockTimer();
  const tick=()=>{
    const remain=(m.endTime-Date.now())/1000;
    const clock=document.getElementById('mockClock'); const bar=document.getElementById('mockTimer');
    if(!clock){ stopMockTimer(); return; }
    clock.textContent=fmtTime(remain);
    bar.classList.toggle('warn', remain<=900 && remain>300);
    bar.classList.toggle('danger', remain<=300);
    if(remain<=0){ stopMockTimer(); submitMock(true); }
  };
  tick(); mockTimerId=setInterval(tick,1000);
}

function renderMockQuestion(){
  const m=state.mock; const wrap=document.getElementById('mockBody'); if(!wrap)return;
  wrap.innerHTML='';
  const i=m.index; const q=m.questions[i];
  const track=el('div','progress-track'); track.innerHTML=`<div class="progress-fill" style="width:${((i+1)/90)*100}%"></div>`; wrap.appendChild(track);

  const card=el('div','q-card');
  card.innerHTML=`<div class="q-meta"><span class="q-obj">D${q.dnum} · Obj ${q.obj}</span><span class="q-num">Question ${i+1} of 90</span></div><div class="q-text">${esc(q.q)}</div>`;
  const opts=el('div','opts');
  q.opts.forEach((opt,oi)=>{
    const b=el('button','opt'+(m.answers[i]===oi?' picked':''));
    b.innerHTML=`<span class="lt">${String.fromCharCode(65+oi)}</span><span>${esc(opt)}</span>`;
    b.onclick=()=>{ m.answers[i]=oi; renderMockQuestion(); updateAnswered(); };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  wrap.appendChild(card);

  // Nav row
  const nav=el('div','fc-nav');
  const prev=el('button',null,'‹ Prev'); prev.disabled=i===0; prev.onclick=()=>{m.index--;renderMockQuestion();};
  const next=el('button','primary',i===89?'Go to last':'Next ›'); next.disabled=i===89; next.onclick=()=>{m.index++;renderMockQuestion();};
  nav.appendChild(prev); nav.appendChild(next); wrap.appendChild(nav);

  // Question navigator grid
  const navGrid=el('div','qnav');
  m.questions.forEach((_,qi)=>{
    const cell=el('button','qnav-cell'+(m.answers[qi]!=null?' done':'')+(qi===i?' current':''),String(qi+1));
    cell.onclick=()=>{m.index=qi;renderMockQuestion();};
    navGrid.appendChild(cell);
  });
  wrap.appendChild(navGrid);

  // Submit area
  const sub=el('div','submit-area'); sub.id='submitArea';
  const btn=el('button','btn primary big','Submit exam');
  btn.onclick=()=>{
    const unanswered=90-Object.keys(m.answers).length;
    if(unanswered>0){
      sub.innerHTML=`<div class="submit-warn">${unanswered} question${unanswered>1?'s':''} still unanswered. They will be marked wrong.</div>`;
      const c1=el('button','btn primary','Submit anyway'); c1.onclick=()=>submitMock(false);
      const c2=el('button','btn ghost','Keep working'); c2.onclick=()=>{m.index=firstUnanswered();renderMockQuestion();};
      sub.appendChild(c1); sub.appendChild(c2);
    } else { submitMock(false); }
  };
  sub.appendChild(btn); wrap.appendChild(sub);
  updateAnswered();
}
function firstUnanswered(){ const m=state.mock; for(let k=0;k<90;k++){ if(m.answers[k]==null)return k; } return m.index; }
function updateAnswered(){ const el2=document.getElementById('answeredCount'); if(el2)el2.textContent=Object.keys(state.mock.answers).length; }

function submitMock(auto){
  stopMockTimer();
  const m=state.mock;
  m.phase='results'; m.submitted=true; m.autoSubmitted=!!auto;
  m.timeUsed=MOCK_SECONDS-Math.max(0,Math.floor((m.endTime-Date.now())/1000));
  let correct=0; const byDom={};
  MOCK_PLAN.forEach(p=>byDom[p.id]={correct:0,total:0,name:DATA.domains.find(d=>d.id===p.id).name,n:DATA.domains.find(d=>d.id===p.id).n});
  m.questions.forEach((q,i)=>{
    byDom[q.domainId].total++;
    if(m.answers[i]===q.correct){correct++;byDom[q.domainId].correct++;}
  });
  m.correct=correct; m.byDom=byDom;
  render();
}

    <p>The exam is a maximum of 90 questions in 90 minutes. It mixes multiple choice, where some items ask you to select more than one answer, with performance-based questions, which are interactive tasks rather than a list of options. You pass at a scaled score of 750 on a range of 100 to 900, and you get your result the moment you finish.</p>
    <h4>Performance-based questions (PBQs)</h4>
    <p>PBQs simulate real work: configuring a firewall rule set, matching controls to categories, ordering the incident response phases, reading a log, or completing a diagram. They typically appear first, often carry more weight than a single multiple-choice item, and they eat time. The proven tactic is to not let them trap you at the start. Flag each PBQ, skip ahead, and clear all the multiple-choice questions first so you bank the points you are sure of and know exactly how much time is left. Then return to the PBQs. They frequently award partial credit, so complete every part you can even if you are unsure of the whole.</p>
    <h4>Managing the clock</h4>
    <p>Ninety questions in ninety minutes is about a minute each, but PBQs skew that, which is the whole reason to do them last. Never leave anything blank, because there is no penalty for guessing and an unanswered item is simply wrong. Use the flag-and-review feature to mark anything you want to revisit, answer your best guess immediately in case you run out of time, and keep one eye on the timer so the final PBQs do not get squeezed.</p>
    <h4>How the scaled score works</h4>
    <p>Your result is not a raw percentage. CompTIA scales scores from 100 to 900, with 750 to pass, because different questions carry different weight and forms vary in difficulty. That is why the mock exam in this app uses roughly 75 percent correct as its pass line: it is a reasonable proxy, not the official cut. Treat anything comfortably above that as your target, and use the per-domain breakdown to see where to spend your remaining study time.</p>`;
  main.appendChild(strat);

  // Original PBQ-style practice
  main.appendChild(el('div','section-label','PBQ-style practice (original, modeled on the format)'));
  const intro=el('p'); intro.style.cssText='color:var(--text-dim);font-size:14px;margin:0 0 14px;line-height:1.6;';
  intro.textContent='These are original worked examples built to mirror the kind of interactive tasks the exam uses. Read the scenario, work it out, then reveal the approach.';
  main.appendChild(intro);

  PBQS.forEach(p=>{
    const card=el('div','pbq-card');
    card.innerHTML=`<span class="lbl">${esc(p.obj)} · performance-based style</span><h4>${esc(p.title)}</h4><p>${esc(p.scenario)}</p>`;
    const btn=el('button','btn','Show approach &amp; answer');
    const ans=el('div','pbq-answer'); ans.innerHTML=esc(p.answer);
    btn.onclick=()=>{ const open=ans.classList.toggle('show'); btn.innerHTML=open?'Hide answer':'Show approach &amp; answer'; };
    card.appendChild(btn); card.appendChild(ans);
    main.appendChild(card);
  });
}

render();
</script>
