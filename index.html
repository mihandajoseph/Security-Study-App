    {
      id:"d2", n:2, name:"Threats, Vulnerabilities & Mitigations", weight:22, ready:true,
      objectives:"2.1 threat actors · 2.2 threat vectors · 2.3 vulnerabilities · 2.4 malicious activity · 2.5 mitigations",
      flashcards:[
        {tag:"Obj 2.1",term:"Threat Actor Types",def:"CompTIA's named actors: nation-state, unskilled attacker, hacktivist, insider threat, organized crime, and shadow IT. Each differs in resources, sophistication, and motivation."},
        {tag:"Obj 2.1",term:"Nation-state / APT",def:"The most sophisticated and well-funded actor, often carrying out espionage or disruption for a government. Frequently described as an Advanced Persistent Threat: stealthy and long-term."},
        {tag:"Obj 2.1",term:"Insider Threat",def:"A person with legitimate access who misuses it, intentionally or accidentally. Hard to catch because the access is authorized. Motives include revenge, financial gain, or negligence."},
        {tag:"Obj 2.1",term:"Shadow IT",def:"Hardware, software, or cloud services used inside an organization without IT approval or oversight, creating unmanaged and unmonitored risk."},
        {tag:"Obj 2.2",term:"Phishing / Vishing / Smishing",def:"Social engineering by channel: phishing uses email, vishing uses voice calls, and smishing uses SMS text messages. All trick a target into revealing information or taking action."},
        {tag:"Obj 2.2",term:"Business Email Compromise",def:"An attacker impersonates an executive or trusted vendor, usually by email, to trick staff into transferring money or sensitive data. Often urgent and authority-driven."},
        {tag:"Obj 2.2",term:"Pretexting",def:"Inventing a believable scenario or false identity to earn trust and extract information, such as posing as an auditor or IT technician."},
        {tag:"Obj 2.2",term:"Watering Hole Attack",def:"Compromising a legitimate website that a specific target group is known to visit, so their own trusted browsing delivers the malware."},
        {tag:"Obj 2.2",term:"Typosquatting",def:"Registering domains that are common misspellings of a real site to catch users who mistype the address and serve them malicious content."},
        {tag:"Obj 2.2",term:"Supply Chain Vector",def:"Attacking an organization indirectly through its trusted managed service providers, vendors, or software suppliers, so malicious code or access arrives through a trusted channel."},
        {tag:"Obj 2.2",term:"Default Credentials",def:"Factory-set usernames and passwords left unchanged on devices. A trivial attack surface because the defaults are publicly documented."},
        {tag:"Obj 2.3",term:"Buffer Overflow",def:"Writing more data into a memory buffer than it can hold, overwriting adjacent memory. Can crash a program or let an attacker run their own code."},
        {tag:"Obj 2.3",term:"Race Condition (TOC/TOU)",def:"A flaw exploiting the gap between when a resource is checked (time-of-check) and when it is used (time-of-use), when the state can change in between."},
        {tag:"Obj 2.3",term:"SQL Injection (SQLi)",def:"Inserting malicious SQL through an input field to read, alter, or bypass a database, for example to defeat a login check."},
        {tag:"Obj 2.3",term:"Cross-Site Scripting (XSS)",def:"Injecting malicious scripts into a web page so they execute in other users' browsers, stealing sessions or data."},
        {tag:"Obj 2.3",term:"Zero-Day",def:"A vulnerability unknown to the vendor with no patch available, giving defenders zero days to prepare before it is exploited."},
        {tag:"Obj 2.3",term:"VM Escape",def:"Breaking out of a guest virtual machine to reach the hypervisor or host, potentially compromising other VMs on the same hardware."},
        {tag:"Obj 2.4",term:"Ransomware",def:"Malware that encrypts a victim's files and demands payment, usually in cryptocurrency, for the decryption key."},
        {tag:"Obj 2.4",term:"Rootkit",def:"Malware that embeds deep in the operating system to hide itself and maintain stealthy, privileged, persistent access."},
        {tag:"Obj 2.4",term:"On-Path Attack",def:"An attacker secretly positions between two communicating parties to intercept or alter their traffic. Formerly called man-in-the-middle."},
        {tag:"Obj 2.4",term:"Password Spraying",def:"Trying a small number of common passwords across many accounts, staying under lockout thresholds, rather than hammering one account."},
        {tag:"Obj 2.4",term:"Impossible Travel",def:"An indicator of compromise where a single account logs in from geographically distant locations in a timeframe no traveler could cover."},
        {tag:"Obj 2.5",term:"Least Privilege",def:"Granting each user or process only the minimum access required for its role, limiting the damage if it is compromised."},
        {tag:"Obj 2.5",term:"Hardening",def:"Reducing attack surface by patching, disabling unused ports and protocols, removing unneeded software, changing default passwords, and adding endpoint protection."},
        {tag:"Obj 2.5",term:"Segmentation",def:"Dividing a network into isolated zones so a breach in one area cannot spread freely to others."}
      ],
      questions:[
        {obj:"2.1",q:"Which threat actor is typically the most sophisticated and well-funded, often motivated by espionage or national interests?",opts:["Unskilled attacker","Hacktivist","Nation-state","Shadow IT"],a:2,e:"Nation-state actors have the greatest resources and sophistication and are commonly driven by espionage, disruption, or war. They are often described as advanced persistent threats. (Obj 2.1)"},
        {obj:"2.1",q:"An attacker who relies on prewritten tools and scripts without deep technical skill is best described as a:",opts:["Nation-state actor","Unskilled attacker","Organized crime member","Insider threat"],a:1,e:"An unskilled attacker (formerly script kiddie) uses existing tools without understanding them deeply. Sophistication level is one of CompTIA's threat-actor attributes. (Obj 2.1)"},
        {obj:"2.1",q:"A group defaces a company's website to protest its environmental record. What primarily motivates this actor?",opts:["Financial gain","Philosophical or political beliefs","Espionage","Blackmail"],a:1,e:"Hacktivists are driven by philosophical or political beliefs and use attacks to make a statement. (Obj 2.1)"},
        {obj:"2.1",q:"A departing employee with valid credentials copies confidential files before resigning. This is an example of:",opts:["A watering hole attack","Shadow IT","An insider threat","A hacktivist"],a:2,e:"An insider threat is someone with legitimate access who misuses it. The authorized access makes it especially hard to detect. (Obj 2.1)"},
        {obj:"2.1",q:"Organized crime groups running ransomware operations are most often motivated by:",opts:["Ethical disclosure","Political beliefs","Financial gain","War"],a:2,e:"Organized crime is overwhelmingly financially motivated, treating cyberattacks as a profit-making enterprise. (Obj 2.1)"},
        {obj:"2.1",q:"A marketing team adopts an unapproved cloud file-sharing app, bypassing IT review. This unmanaged risk is called:",opts:["Shadow IT","An advanced persistent threat","A logic bomb","A honeynet"],a:0,e:"Shadow IT is technology used without IT's approval or oversight, creating risk that the security team cannot see or manage. (Obj 2.1)"},
        {obj:"2.1",q:"Which attribute describes whether a threat actor operates from within or outside the organization?",opts:["Level of funding","Internal versus external","Sophistication","Motivation"],a:1,e:"Internal versus external is a core threat-actor attribute, alongside resources/funding and level of sophistication. (Obj 2.1)"},
        {obj:"2.1",q:"Stealing large volumes of sensitive data to sell or leak is the motivation known as:",opts:["Service disruption","Ethical testing","Data exfiltration","Revenge"],a:2,e:"Data exfiltration is the motivation of stealing data for resale, leverage, or leaking. (Obj 2.1)"},
        {obj:"2.1",q:"An attacker threatens to publish stolen information unless the victim pays. This motivation is:",opts:["Blackmail","Espionage","Chaos","Ethical"],a:0,e:"Using stolen data as leverage for payment is blackmail, one of CompTIA's listed motivations. (Obj 2.1)"},
        {obj:"2.1",q:"A security researcher probes a vendor's product and responsibly reports the flaws found. This motivation is best labeled:",opts:["Revenge","Ethical","Espionage","Financial gain"],a:1,e:"Ethical motivation describes acting to improve security, such as responsible disclosure by a researcher. (Obj 2.1)"},
        {obj:"2.2",q:"A fraudulent email claiming to be from IT asks users to click a link and enter their credentials. This is:",opts:["Vishing","Phishing","Smishing","Pretexting"],a:1,e:"Phishing is social engineering delivered by email to trick users into revealing information or clicking malicious links. (Obj 2.2)"},
        {obj:"2.2",q:"An attacker phones an employee pretending to be the help desk to extract a password. This is:",opts:["Phishing","Smishing","Vishing","Typosquatting"],a:2,e:"Vishing is voice phishing, conducted over a phone call. (Obj 2.2)"},
        {obj:"2.2",q:"A text message with a malicious link claiming a delivery problem is an example of:",opts:["Smishing","Vishing","Impersonation","Watering hole"],a:0,e:"Smishing is phishing carried out through SMS text messages. (Obj 2.2)"},
        {obj:"2.2",q:"An email appearing to come from the CFO urgently instructs finance to wire funds to a new account. This is best described as:",opts:["Watering hole","Business email compromise","Shoulder surfing","Bloatware"],a:1,e:"Business email compromise impersonates an executive or vendor, often with urgency and authority, to trigger fraudulent payments or data release. (Obj 2.2)"},
        {obj:"2.2",q:"An attacker invents a convincing backstory as an external auditor to persuade staff to hand over records. This technique is:",opts:["Pretexting","Tailgating","Typosquatting","Vishing"],a:0,e:"Pretexting is building a fabricated scenario or identity to gain trust and extract information. (Obj 2.2)"},
        {obj:"2.2",q:"Attackers compromise an industry news site frequently visited by a target company's staff. This is a:",opts:["Business email compromise","Brand impersonation","Watering hole attack","Distributed denial-of-service"],a:2,e:"A watering hole attack compromises a site the target group trusts and visits, letting their normal browsing deliver the payload. (Obj 2.2)"},
        {obj:"2.2",q:"Registering 'gooogle.com' to capture users who mistype a web address is called:",opts:["Pretexting","Typosquatting","Smishing","Impersonation"],a:1,e:"Typosquatting registers misspelled or look-alike domains to catch mistyped traffic and serve malicious content. (Obj 2.2)"},
        {obj:"2.2",q:"Leaving malware-infected USB drives where employees will find and plug them in exploits which threat vector?",opts:["Open service ports","Removable device","Supply chain","Default credentials"],a:1,e:"Removable devices such as USB drives are a physical threat vector that can bypass network defenses when plugged in. (Obj 2.2)"},
        {obj:"2.2",q:"A new IoT camera is deployed without changing its factory admin password. Which attack surface does this create?",opts:["Default credentials","Race condition","VM escape","Zero-day"],a:0,e:"Unchanged default credentials are publicly documented and give attackers trivial access. (Obj 2.2)"},
        {obj:"2.2",q:"Attackers insert malicious code into a trusted software vendor's update, which is then pushed to customers. This vector is:",opts:["Watering hole","Impersonation","Supply chain","Bluesnarfing"],a:2,e:"A supply chain attack reaches victims through a trusted third party such as a vendor, MSP, or supplier. (Obj 2.2)"},
        {obj:"2.2",q:"Continuing to run an operating system that no longer receives security patches primarily creates risk from:",opts:["Unsupported systems and applications","Open service ports","Phishing","Salting"],a:0,e:"Unsupported (end-of-life) systems no longer get patches, so newly discovered flaws stay open permanently. (Obj 2.2)"},
        {obj:"2.2",q:"Spreading deliberately false information to manipulate opinion or behavior is which human vector?",opts:["Pretexting","Misinformation or disinformation","Watering hole","Vishing"],a:1,e:"Misinformation and disinformation are human vectors that manipulate targets by shaping what they believe. (Obj 2.2)"},
        {obj:"2.2",q:"A phishing website copies a bank's exact logo, colors, and layout to appear legitimate. This is:",opts:["Race condition","Bloatware","Brand impersonation","Directory traversal"],a:2,e:"Brand impersonation mimics a trusted organization's visual identity to deceive victims. (Obj 2.2)"},
        {obj:"2.2",q:"Exposing an unnecessary network service to the internet primarily results in what?",opts:["A larger attack surface","A stronger root of trust","A longer key length","A shorter maintenance window"],a:0,e:"Open, unnecessary service ports enlarge the attack surface, giving adversaries more to probe and exploit. (Obj 2.2)"},
        {obj:"2.3",q:"Writing more data than a buffer can hold, overwriting adjacent memory to potentially execute code, is a:",opts:["Buffer overflow","Race condition","SQL injection","Zero-day"],a:0,e:"A buffer overflow overwrites memory beyond an allocated buffer and can lead to crashes or arbitrary code execution. (Obj 2.3)"},
        {obj:"2.3",q:"A flaw exploiting the gap between when a resource is checked and when it is used is a:",opts:["Misconfiguration","Race condition","Cross-site scripting","Buffer overflow"],a:1,e:"A race condition, specifically time-of-check to time-of-use (TOC/TOU), exploits state changes between validation and use. (Obj 2.3)"},
        {obj:"2.3",q:"Entering ' OR '1'='1 into a login field to bypass authentication exploits which vulnerability?",opts:["Directory traversal","XSS","SQL injection","Buffer overflow"],a:2,e:"SQL injection inserts crafted SQL into input to manipulate the database, here to make the login query always evaluate true. (Obj 2.3)"},
        {obj:"2.3",q:"An attacker stores a malicious script in a forum post that then runs in other visitors' browsers. This is:",opts:["Cross-site scripting","SQL injection","VM escape","Firmware flaw"],a:0,e:"Cross-site scripting (XSS) injects scripts into web content that execute in other users' browsers. (Obj 2.3)"},
        {obj:"2.3",q:"A vulnerability exploited before the vendor knows about it or has a patch is called a:",opts:["Legacy flaw","Misconfiguration","Zero-day","Race condition"],a:2,e:"A zero-day is unknown to the vendor with no available patch, leaving defenders no lead time. (Obj 2.3)"},
        {obj:"2.3",q:"Breaking out of a guest virtual machine to access the underlying hypervisor or host is called:",opts:["VM escape","Resource reuse","Side loading","Jailbreaking"],a:0,e:"VM escape breaks the isolation boundary of a virtual machine to reach the hypervisor, threatening other guests. (Obj 2.3)"},
        {obj:"2.3",q:"Sensitive data left in memory that is then reassigned to a different virtual machine illustrates which weakness?",opts:["Resource reuse","VM escape","Buffer overflow","Collision"],a:0,e:"Resource reuse is a virtualization vulnerability where reallocated memory or storage still holds another tenant's data. (Obj 2.3)"},
        {obj:"2.3",q:"Removing a manufacturer's restrictions on a mobile device to gain elevated privileges is called:",opts:["Sandboxing","Jailbreaking","Hardening","Segmentation"],a:1,e:"Jailbreaking (or rooting) removes vendor restrictions, weakening the device's built-in security model. (Obj 2.3)"},
        {obj:"2.3",q:"Installing a mobile app from outside the official app store, bypassing its vetting, is called:",opts:["Side loading","Jailbreaking","Tokenization","Segmentation"],a:0,e:"Side loading installs apps from unofficial sources that skip the app store's security review. (Obj 2.3)"},
        {obj:"2.3",q:"A publicly readable cloud storage bucket that leaks data is an example of which vulnerability type?",opts:["Zero-day","Buffer overflow","Misconfiguration","Logic bomb"],a:2,e:"A misconfiguration, such as overly permissive access settings, is a leading cause of cloud data exposure. (Obj 2.3)"},
        {obj:"2.3",q:"Relying on a deprecated hashing algorithm such as MD5 for security represents which vulnerability category?",opts:["Web-based","Cryptographic","Hardware","Mobile"],a:1,e:"Using weak or outdated algorithms is a cryptographic vulnerability. (Obj 2.3)"},
        {obj:"2.3",q:"Hardware that no longer receives firmware updates or vendor support is best described as:",opts:["Zero-day","Race condition","End-of-life or legacy","Misconfiguration"],a:2,e:"End-of-life or legacy hardware stops receiving updates and support, so its flaws remain unpatched. (Obj 2.3)"},
        {obj:"2.3",q:"A tampered software update that secretly installs malware is an example of a:",opts:["Malicious update","Race condition","Directory traversal","Watering hole"],a:0,e:"A malicious update abuses the trusted update mechanism to deliver harmful code. (Obj 2.3)"},
        {obj:"2.4",q:"Files are encrypted and a note demands cryptocurrency for the decryption key. This malware is:",opts:["Ransomware","Spyware","Bloatware","Keylogger"],a:0,e:"Ransomware encrypts data and extorts payment for its release. (Obj 2.4)"},
        {obj:"2.4",q:"Malware disguised as legitimate software that a user installs willingly is a:",opts:["Worm","Trojan","Virus","Rootkit"],a:1,e:"A Trojan masquerades as a legitimate program to trick the user into installing it. (Obj 2.4)"},
        {obj:"2.4",q:"Self-replicating malware that spreads across a network without user interaction is a:",opts:["Worm","Trojan","Logic bomb","Spyware"],a:0,e:"A worm self-propagates across networks without needing a user to run it, unlike a virus. (Obj 2.4)"},
        {obj:"2.4",q:"Malware that embeds in the OS kernel to hide itself and keep privileged access is a:",opts:["Bloatware","Adware","Rootkit","Keylogger"],a:2,e:"A rootkit operates at a low level to conceal its presence and maintain stealthy, persistent, privileged control. (Obj 2.4)"},
        {obj:"2.4",q:"Malicious code set to execute when a specific date or condition is met is a:",opts:["Logic bomb","Worm","Trojan","Spyware"],a:0,e:"A logic bomb lies dormant until a trigger condition, such as a date or event, activates its payload. (Obj 2.4)"},
        {obj:"2.4",q:"Software that secretly records every keystroke to capture credentials is a:",opts:["Rootkit","Keylogger","Worm","Bloatware"],a:1,e:"A keylogger captures keystrokes to steal passwords and other typed information. (Obj 2.4)"},
        {obj:"2.4",q:"An attacker sends small spoofed DNS queries that trigger large responses aimed at a victim. This is an:",opts:["Amplified, reflected DDoS","On-path attack","Credential replay","Collision attack"],a:0,e:"Amplification and reflection use a third-party service to multiply traffic and direct it at a victim, a form of distributed denial-of-service. (Obj 2.4)"},
        {obj:"2.4",q:"An attacker secretly relays and possibly alters traffic between two hosts. This is an:",opts:["Amplification attack","On-path attack","Directory traversal","Privilege escalation"],a:1,e:"An on-path attack (formerly man-in-the-middle) intercepts communication between two parties. (Obj 2.4)"},
        {obj:"2.4",q:"Capturing an authentication token and resending it later to impersonate a user is a:",opts:["Password spraying","Birthday attack","Credential replay","Downgrade attack"],a:2,e:"A credential (or session) replay attack reuses captured authentication data to gain access. (Obj 2.4)"},
        {obj:"2.4",q:"Trying a few very common passwords across many accounts to avoid triggering lockouts is:",opts:["Password spraying","Brute forcing one account","Collision","Downgrade"],a:0,e:"Password spraying spreads a few common passwords across many accounts, staying under per-account lockout thresholds. (Obj 2.4)"},
        {obj:"2.4",q:"A single account logs in from New York and, ten minutes later, from Tokyo. This indicator is called:",opts:["Account lockout","Impossible travel","Out-of-cycle logging","Concurrent session usage"],a:1,e:"Impossible travel flags logins from locations too far apart to reach in the elapsed time, a strong compromise indicator. (Obj 2.4)"},
        {obj:"2.4",q:"Forcing a secure connection to fall back to an older, weaker protocol version is a:",opts:["Collision attack","Birthday attack","Downgrade attack","Replay attack"],a:2,e:"A downgrade attack coerces the use of a weaker protocol or cipher that is easier to break. (Obj 2.4)"},
        {obj:"2.4",q:"Finding two different inputs that produce the same hash output is a:",opts:["Collision attack","Downgrade attack","Spraying attack","On-path attack"],a:0,e:"A collision attack finds two inputs with the same hash, undermining integrity guarantees. (Obj 2.4)"},
        {obj:"2.4",q:"Exploiting a flaw to move from a standard user account to administrator rights is:",opts:["Directory traversal","Forgery","Privilege escalation","Replay"],a:2,e:"Privilege escalation gains higher permissions than originally granted, often the goal after an initial foothold. (Obj 2.4)"},
        {obj:"2.4",q:"Using ../../ sequences to reach files outside the intended web directory is a:",opts:["Directory traversal","SQL injection","Cross-site scripting","Buffer overflow"],a:0,e:"Directory (path) traversal manipulates file paths to access files outside the web root. (Obj 2.4)"},
        {obj:"2.4",q:"Gaps or deletions in log files discovered after an incident are an indicator known as:",opts:["Impossible travel","Missing logs","Account lockout","Concurrent sessions"],a:1,e:"Missing logs suggest an attacker cleared traces to hide activity, a recognized indicator of malicious activity. (Obj 2.4)"},
        {obj:"2.5",q:"Dividing a network into isolated zones so a breach cannot spread freely is which mitigation?",opts:["Segmentation","Patching","Encryption","Monitoring"],a:0,e:"Segmentation limits lateral movement by isolating parts of the network from one another. (Obj 2.5)"},
        {obj:"2.5",q:"Granting each user only the access their role requires is the principle of:",opts:["Defense in depth","Least privilege","Implicit trust","Full access"],a:1,e:"Least privilege minimizes granted permissions, reducing the impact of a compromised account. (Obj 2.5)"},
        {obj:"2.5",q:"Regularly applying vendor updates to close known vulnerabilities is which mitigation?",opts:["Isolation","Segmentation","Patching","Decommissioning"],a:2,e:"Patching remediates known flaws before they can be exploited. (Obj 2.5)"},
        {obj:"2.5",q:"Disabling unused ports and protocols and removing unnecessary software are examples of:",opts:["Hardening techniques","Access control lists","Encryption","Monitoring"],a:0,e:"These reduce the attack surface and are classic hardening techniques. (Obj 2.5)"},
        {obj:"2.5",q:"A rule set on a router that permits or denies traffic by source, destination, or port is an:",opts:["Application allow list","Endpoint protection agent","Access control list","Isolation zone"],a:2,e:"An access control list (ACL) filters traffic based on defined criteria such as address and port. (Obj 2.5)"},
        {obj:"2.5",q:"Permitting only explicitly approved programs to run and blocking everything else is an:",opts:["Application allow list","Access control list","Host intrusion prevention system","Deny list"],a:0,e:"An application allow list permits only approved software, blocking unknown or unauthorized programs by default. (Obj 2.5)"},
        {obj:"2.5",q:"Placing a compromised host on a quarantine network so it cannot reach other systems is:",opts:["Least privilege","Isolation","Monitoring","Configuration enforcement"],a:1,e:"Isolation contains a threat by cutting off a host's ability to interact with the rest of the environment. (Obj 2.5)"},
        {obj:"2.5",q:"Securely wiping and retiring an end-of-life server so it no longer poses a risk is:",opts:["Patching","Hardening","Decommissioning","Segmentation"],a:2,e:"Decommissioning securely removes systems and data from service at end of life so they cannot be exploited. (Obj 2.5)"}

      topics:[
        {id:"t2ov",name:"Overview",html:`
          <h3>What Domain 2 covers and what to expect</h3>
          <p>Threats, Vulnerabilities, and Mitigations is 22 percent of the exam, the second-largest domain, and it is where you learn the offense so you can build the defense. Five objectives sit here: <b>2.1</b> who attacks and why (threat actors and motivations), <b>2.2</b> how they get in (threat vectors and social engineering), <b>2.3</b> the weaknesses they exploit (vulnerabilities), <b>2.4</b> how to recognize an attack in progress (indicators of malicious activity), and <b>2.5</b> how to reduce the risk (mitigation techniques).</p>
          <p>This domain is heavily scenario-based, especially objective 2.4, which is literally phrased "given a scenario, analyze indicators of malicious activity." You will be handed a situation and asked to name the attack, the malware type, the social engineering technique, or the vulnerability at work. The challenge is less about memorizing definitions in isolation and more about telling closely related terms apart, since the wrong answers are usually real concepts that simply do not match the scenario.</p>
          <p>Study it by grouping and contrasting. Keep the threat actors straight by resources and motivation, learn the social engineering family by delivery method (phishing, vishing, smishing) and by tactic (pretexting, watering hole, business email compromise), sort the malware types by behavior (a worm self-spreads, a trojan hides in something wanted, a rootkit conceals itself), and connect each mitigation to the problem it solves. If you can read a short scenario and immediately name what is happening, you are ready for this domain.</p>`},
        {id:"t21",name:"2.1 Threat Actors",html:`
          <h3>Threat actors and their motivations</h3>
          <p>Understanding who attacks and why shapes how you defend. CompTIA names six actor types. A <b>nation-state</b> actor is the most capable, backed by a government with deep funding and patience, and is often described as an advanced persistent threat because it establishes long-term, stealthy access for espionage or disruption. An <b>unskilled attacker</b> uses tools others built without understanding them deeply. A <b>hacktivist</b> acts on political or philosophical beliefs, often through defacement or leaks. An <b>insider threat</b> already has legitimate access and misuses it, which makes them hard to catch. <b>Organized crime</b> operates like a business, almost always for financial gain. <b>Shadow IT</b> is not a malicious outsider at all but unsanctioned technology adopted inside the organization, creating risk security cannot see.</p>
          <h4>Attributes that distinguish actors</h4>
          <p>You compare actors along a few attributes: whether they are <b>internal or external</b>, their <b>resources and funding</b>, and their <b>level of sophistication and capability</b>. A nation-state scores high on all three; an unskilled attacker scores low.</p>
          <h4>Motivations</h4>
          <p>Motivations explain intent and help predict targets. They include data exfiltration, espionage, service disruption, blackmail, financial gain, philosophical or political beliefs, ethical goals such as responsible research, revenge, general chaos, and war. The same technique can serve very different motives, so tying an actor to a likely motivation guides your response.</p>`},
        {id:"t22",name:"2.2 Threat Vectors",html:`
          <h3>Threat vectors and attack surfaces</h3>
          <p>A threat vector is the path an attacker takes in; the attack surface is the sum of all those paths. Many vectors are <b>message-based</b>, arriving through email, SMS, or instant messaging, and the social engineering family lives here. <b>Phishing</b> uses email, <b>vishing</b> uses voice calls, and <b>smishing</b> uses text messages, all aiming to trick a person into acting against their own interest.</p>
          <h4>Social engineering in depth</h4>
          <p>Beyond the basic three, <b>business email compromise</b> impersonates an executive or vendor to authorize fraudulent payments, usually with manufactured urgency. <b>Pretexting</b> builds a false story to earn trust. A <b>watering hole</b> attack compromises a legitimate site the target group already trusts. <b>Typosquatting</b> and <b>brand impersonation</b> exploit look-alike domains and copied branding, and <b>misinformation or disinformation</b> manipulates through false narratives.</p>
          <h4>Technical and supply-chain surfaces</h4>
          <p>Other vectors are technical. <b>Default credentials</b> on new devices, <b>open service ports</b>, <b>unsupported systems</b>, unsecured wireless, wired, or Bluetooth networks, and <b>removable devices</b> like malicious USB drives all widen the surface. The <b>supply chain</b> deserves special attention: attackers reach a target indirectly through trusted managed service providers, vendors, and suppliers, so the malicious code or access arrives through a channel you already trust.</p>`},
        {id:"t23",name:"2.3 Vulnerabilities",html:`
          <h3>Types of vulnerabilities</h3>
          <p>Vulnerabilities are the weaknesses attackers exploit. <b>Application</b> flaws include memory injection and the classic <b>buffer overflow</b>, where writing past a buffer's bounds can hijack execution, and <b>race conditions</b> of the time-of-check to time-of-use variety, where the state changes between validation and use. <b>Web-based</b> flaws are dominated by <b>SQL injection</b>, which manipulates a database through input, and <b>cross-site scripting</b>, which runs attacker scripts in other users' browsers.</p>
          <h4>Platform and infrastructure</h4>
          <p><b>Operating system</b> and <b>hardware</b> weaknesses include firmware bugs and <b>end-of-life or legacy</b> equipment that no longer receives updates. <b>Virtualization</b> brings <b>VM escape</b>, breaking out of a guest to the hypervisor, and <b>resource reuse</b>, where reallocated memory still holds another tenant's data. <b>Cloud-specific</b> and <b>supply chain</b> weaknesses extend the list, and <b>cryptographic</b> vulnerabilities arise from weak or outdated algorithms.</p>
          <h4>Configuration, mobile, and the unknown</h4>
          <p><b>Misconfiguration</b>, such as a world-readable storage bucket, is one of the most common and preventable causes of exposure. <b>Mobile</b> risks include <b>side loading</b> apps from outside official stores and <b>jailbreaking</b> to remove vendor protections. The hardest to defend is the <b>zero-day</b>: unknown to the vendor with no patch, so there is no lead time. The OSI model helps map where attacks land, since different vulnerabilities and attacks target different layers.</p>
          <div class="diagram">${SVG.osi()}<div class="cap">OSI model with example attacks at each layer</div></div>`},
        {id:"t24",name:"2.4 Malicious Activity",html:`
          <h3>Indicators of malicious activity</h3>
          <p>Recognizing attacks in progress is a scenario-heavy part of the exam. <b>Malware</b> comes in many forms: <b>ransomware</b> encrypts and extorts, a <b>trojan</b> hides inside legitimate-looking software, a <b>worm</b> self-replicates across networks, <b>spyware</b> and <b>keyloggers</b> steal information, a <b>rootkit</b> hides deep in the OS for stealthy privileged access, a <b>logic bomb</b> waits for a trigger, and <b>bloatware</b> clutters and weakens systems.</p>
          <h4>Network, application, and password attacks</h4>
          <p><b>Network attacks</b> include distributed denial-of-service, often <b>amplified and reflected</b> through third-party services, DNS attacks, wireless attacks, <b>on-path</b> interception, and <b>credential replay</b>. <b>Application attacks</b> include injection, buffer overflow, replay, <b>privilege escalation</b>, forgery, and <b>directory traversal</b>. <b>Password attacks</b> feature <b>spraying</b>, which tries a few common passwords across many accounts to dodge lockouts, and brute force. <b>Cryptographic attacks</b> include downgrade, collision, and birthday attacks.</p>
          <h4>Reading the indicators</h4>
          <p>Certain signals point to compromise: account lockouts, concurrent session usage, blocked content, <b>impossible travel</b> where one account appears in two distant places too quickly, unusual resource consumption or inaccessibility, out-of-cycle logging, and <b>missing logs</b> that suggest an attacker covered their tracks. Correlating these indicators is how a SOC separates noise from a real intrusion.</p>`},
        {id:"t25",name:"2.5 Mitigations",html:`
          <h3>Mitigation techniques</h3>
          <p>Mitigations reduce risk before and after an attack. <b>Segmentation</b> divides the network so a breach in one zone cannot spread freely, and <b>isolation</b> takes it further by quarantining a compromised host. <b>Access control</b> through access control lists and carefully scoped permissions enforces who can reach what, and an <b>application allow list</b> permits only approved software to run.</p>
          <div class="diagram">${SVG.segmentation()}<div class="cap">Segmentation with a screened subnet (DMZ) between two firewalls</div></div>
          <h4>Keeping systems clean and minimal</h4>
          <p><b>Patching</b> closes known vulnerabilities, <b>encryption</b> protects data, and <b>monitoring</b> gives visibility to detect problems. <b>Least privilege</b> and <b>configuration enforcement</b> keep access and settings tight, while <b>decommissioning</b> safely retires end-of-life systems so they stop being a liability.</p>
          <h4>Hardening</h4>
          <p><b>Hardening</b> shrinks the attack surface of each host. It combines encryption, endpoint protection, host-based firewalls, a host-based intrusion prevention system, disabling unnecessary ports and protocols, changing default passwords, and removing software that is not needed. Every service you turn off is one an attacker can no longer reach.</p>`}
      ],

      flashcards:[
        {tag:"Obj 3.1",term:"Shared Responsibility Model",def:"In cloud, security duties are split between provider and customer. The provider secures the infrastructure; the customer secures their data, access, and configuration. How much each owns depends on the service model (IaaS, PaaS, SaaS)."},
        {tag:"Obj 3.1",term:"Infrastructure as Code (IaC)",def:"Defining and provisioning infrastructure through machine-readable configuration files rather than manual setup. Enables consistent, repeatable, version-controlled deployments and reduces configuration drift."},
        {tag:"Obj 3.1",term:"Serverless",def:"A cloud model where the provider runs code on demand without the customer managing servers. Reduces patching and infrastructure burden but shifts trust to the provider and can complicate monitoring."},
        {tag:"Obj 3.1",term:"Microservices",def:"Breaking an application into small, independent services that communicate over APIs. Improves scalability and isolation but enlarges the attack surface and adds inter-service security concerns."},
        {tag:"Obj 3.1",term:"Containerization vs Virtualization",def:"VMs each run a full guest OS on a hypervisor, giving strong isolation. Containers share the host kernel and package just the app and dependencies, making them lighter but with a thinner isolation boundary."},
        {tag:"Obj 3.1",term:"Software-Defined Networking (SDN)",def:"Separates the network control plane (decisions) from the data plane (forwarding), managed centrally in software. Enables flexible, programmable segmentation and policy."},
        {tag:"Obj 3.1",term:"Air-Gapped / Physical Isolation",def:"Physically separating a system or network so it has no connection to untrusted networks. Strong protection for critical systems like some ICS, at the cost of convenience and updates."},
        {tag:"Obj 3.1",term:"ICS / SCADA",def:"Industrial Control Systems and Supervisory Control and Data Acquisition manage physical processes like power and water. They prioritize availability and often run legacy, hard-to-patch components."},
        {tag:"Obj 3.1",term:"Embedded / RTOS",def:"Embedded systems are purpose-built computers inside larger devices. A real-time operating system guarantees timely responses. Both are often resource-constrained and difficult to patch."},
        {tag:"Obj 3.1",term:"High Availability (HA)",def:"Designing systems to stay operational with minimal downtime, using redundancy, failover, and load distribution so a single failure does not cause an outage."},
        {tag:"Obj 3.2",term:"Security Zones & Device Placement",def:"Grouping systems by trust level (for example internet, DMZ, internal) and placing security devices at the boundaries so traffic between zones is inspected and controlled."},
        {tag:"Obj 3.2",term:"Fail-Open vs Fail-Closed",def:"When a security device fails, fail-open lets traffic through (favoring availability), while fail-closed blocks it (favoring security). The right choice depends on what the device protects."},
        {tag:"Obj 3.2",term:"Jump Server",def:"A hardened, monitored host that administrators connect through to reach sensitive internal systems, creating a single controlled entry point for privileged access."},
        {tag:"Obj 3.2",term:"Proxy Server",def:"An intermediary for requests. A forward proxy sits in front of clients to filter and log outbound traffic; a reverse proxy sits in front of servers to distribute and protect inbound traffic."},
        {tag:"Obj 3.2",term:"IDS vs IPS",def:"An intrusion detection system monitors and alerts on suspicious traffic (passive). An intrusion prevention system sits inline and can actively block it. IPS trades a possible chokepoint for active defense."},
        {tag:"Obj 3.2",term:"Load Balancer",def:"Distributes incoming traffic across multiple servers to improve availability, performance, and resilience, and to prevent any single server from being overwhelmed."},
        {tag:"Obj 3.2",term:"802.1X / EAP",def:"802.1X is a port-based network access control standard that authenticates devices before granting network access, using EAP (Extensible Authentication Protocol) as the framework and often a RADIUS server."},
        {tag:"Obj 3.2",term:"WAF",def:"A web application firewall inspects HTTP/HTTPS traffic to block web attacks like SQL injection and XSS. It operates at Layer 7, understanding application content rather than just ports."},
        {tag:"Obj 3.2",term:"NGFW vs UTM",def:"A next-generation firewall adds deep packet inspection, application awareness, and IPS to traditional filtering. Unified threat management bundles many security functions (firewall, antivirus, filtering) into one appliance."},
        {tag:"Obj 3.2",term:"VPN & Tunneling (TLS vs IPSec)",def:"A VPN creates an encrypted tunnel over an untrusted network. IPSec secures traffic at the network layer (common for site-to-site); TLS-based VPNs operate higher up and are common for remote user access."},
        {tag:"Obj 3.2",term:"SASE / SD-WAN",def:"SD-WAN intelligently routes WAN traffic across links. SASE (Secure Access Service Edge) combines SD-WAN with cloud-delivered security (like SWG, CASB, ZTNA) into one service close to the user."},
        {tag:"Obj 3.3",term:"Data States",def:"Data at rest (stored), data in transit (moving across a network), and data in use (actively processed in memory). Each state needs different protections, such as disk encryption, TLS, and access control."},
        {tag:"Obj 3.3",term:"Data Classification",def:"Labeling data by sensitivity (for example public, private, confidential, restricted, critical) so the right handling and controls are applied to each level."},
        {tag:"Obj 3.3",term:"Data Sovereignty",def:"The principle that data is subject to the laws of the country where it is physically stored, which drives decisions about where data may reside and cross borders."},
        {tag:"Obj 3.4",term:"Load Balancing vs Clustering",def:"Load balancing spreads traffic across independent servers. Clustering links servers to act as one system with shared state, so if one node fails another takes over its work."},
        {tag:"Obj 3.4",term:"Hot / Warm / Cold Site",def:"Recovery sites by readiness. A hot site is fully equipped and near-instant, a warm site has equipment but needs setup and data, and a cold site is just space and power, cheapest but slowest to bring online."},
        {tag:"Obj 3.4",term:"Backup Types",def:"Snapshots capture point-in-time state, replication keeps a continuously updated copy elsewhere, and journaling logs changes for precise recovery. Offsite copies protect against site-wide disasters."},
        {tag:"Obj 3.4",term:"UPS vs Generator",def:"A UPS provides immediate short-term battery power to ride through brief outages and enable clean shutdown. A generator provides sustained power for long outages but takes seconds to start."}
      ],
      questions:[
        {obj:"3.1",q:"Under the cloud shared responsibility model for an IaaS deployment, who is typically responsible for securing the customer's data and access configuration?",opts:["The cloud provider alone","The customer","A third-party auditor","No one, it is automatic"],a:1,e:"In the shared responsibility model the provider secures the underlying infrastructure, but the customer remains responsible for their data, identities, and configuration. (Obj 3.1)"},
        {obj:"3.1",q:"An organization wants consistent, repeatable, version-controlled provisioning of its cloud infrastructure to avoid manual configuration drift. Which approach fits best?",opts:["Infrastructure as code","Manual console setup","Shadow IT","Air gapping"],a:0,e:"Infrastructure as code defines infrastructure in version-controlled files, giving repeatable deployments and reducing drift. (Obj 3.1)"},
        {obj:"3.1",q:"Which model runs application code on demand without the customer managing or patching servers?",opts:["On-premises","Serverless","Air-gapped","Clustering"],a:1,e:"Serverless computing has the provider run code on demand, removing server management and patching from the customer, though it shifts trust and monitoring considerations to the provider. (Obj 3.1)"},
        {obj:"3.1",q:"What is a key security tradeoff of breaking an application into many microservices?",opts:["It removes all attack surface","It enlarges the attack surface and adds inter-service security concerns","It eliminates the need for encryption","It prevents privilege escalation"],a:1,e:"Microservices improve scalability and isolation but add more components and APIs to secure, enlarging the attack surface. (Obj 3.1)"},
        {obj:"3.1",q:"Compared with virtual machines, containers are lighter primarily because they:",opts:["Run a full guest operating system each","Share the host operating system kernel","Require a dedicated hypervisor per container","Cannot run applications"],a:1,e:"Containers share the host kernel and package only the app and its dependencies, making them lighter than VMs but with a thinner isolation boundary. (Obj 3.1)"},
        {obj:"3.1",q:"Software-defined networking improves security flexibility mainly by:",opts:["Separating the control plane from the data plane for centralized, programmable policy","Encrypting all data at rest","Removing the need for firewalls","Physically isolating every device"],a:0,e:"SDN separates control (decisions) from data (forwarding) and centralizes it in software, enabling programmable segmentation and policy. (Obj 3.1)"},
        {obj:"3.1",q:"A power utility isolates a critical control network so it has no physical connection to the internet. This design is called:",opts:["Air-gapped or physical isolation","Serverless","Load balancing","Federation"],a:0,e:"An air gap physically isolates a system from untrusted networks, strong protection for critical ICS at the cost of convenience and updates. (Obj 3.1)"},
        {obj:"3.1",q:"Which characteristic most complicates securing ICS/SCADA environments?",opts:["They prioritize availability and often run legacy, hard-to-patch components","They are always cloud-hosted","They have no real-world impact","They cannot be networked"],a:0,e:"ICS/SCADA systems control physical processes, prioritize uptime, and frequently include legacy components that are difficult to patch. (Obj 3.1)"},
        {obj:"3.1",q:"A real-time operating system is chosen for a medical device primarily because it:",opts:["Guarantees timely, deterministic responses","Has unlimited compute resources","Requires no security","Runs only in the cloud"],a:0,e:"An RTOS guarantees predictable, timely responses, which matters for embedded and safety-critical devices. Such devices are often resource-constrained and hard to patch. (Obj 3.1)"},
        {obj:"3.1",q:"An architecture achieves high availability chiefly through:",opts:["Redundancy and failover so a single failure does not cause an outage","A single powerful server","Disabling backups","Removing load balancers"],a:0,e:"High availability relies on redundancy, failover, and distribution so one component failing does not take the service down. (Obj 3.1)"},
        {obj:"3.1",q:"A hybrid cloud deployment introduces which additional security consideration compared with a single environment?",opts:["Securing and monitoring consistently across both on-prem and cloud, including their connections","No new considerations","Only physical security","Elimination of the shared responsibility model"],a:0,e:"Hybrid setups must apply consistent controls and monitoring across environments and secure the links between them. (Obj 3.1)"},
        {obj:"3.1",q:"Choosing to move a service to a managed cloud provider so the provider assumes some operational risk is an example of which consideration?",opts:["Risk transference","Air gapping","Data sovereignty","Journaling"],a:0,e:"Using a third party to assume some of the risk is risk transference, one of the architecture considerations in 3.1. (Obj 3.1)"},
        {obj:"3.1",q:"An IoT sensor fleet is difficult to secure largely because the devices often have:",opts:["Limited compute and infrequent or unavailable patches","Enterprise-grade firewalls built in","Unlimited processing power","No network connectivity at all"],a:0,e:"IoT and embedded devices are typically resource-constrained with limited or no patching, a recurring architecture concern. (Obj 3.1)"},
        {obj:"3.1",q:"Which consideration describes how easily a system can grow to handle increased load?",opts:["Scalability","Responsiveness","Ease of recovery","Power"],a:0,e:"Scalability is the ability to expand capacity to meet demand, one of the listed architecture considerations. (Obj 3.1)"},
        {obj:"3.1",q:"A centralized architecture differs from a decentralized one primarily in that centralized designs:",opts:["Concentrate control and management in one place, simplifying oversight but creating a potential single point of failure","Have no single point of management","Cannot be secured","Always cost more"],a:0,e:"Centralized architectures ease management and oversight but concentrate risk; decentralized ones spread it out. This tradeoff is a 3.1 consideration. (Obj 3.1)"},
        {obj:"3.1",q:"An inability to patch a legacy embedded controller is best mitigated by which architectural choice?",opts:["Isolating or segmenting it away from untrusted networks","Exposing it directly to the internet","Deleting its logs","Disabling all monitoring"],a:0,e:"When patching is impossible, isolation and segmentation reduce exposure, a common compensating design for legacy and embedded systems. (Obj 3.1)"},
        {obj:"3.2",q:"Grouping systems by trust level and placing inspection devices at the boundaries between them is the practice of establishing:",opts:["Security zones","A single flat network","Shadow IT","A honeynet"],a:0,e:"Security zones separate systems by trust and force traffic crossing boundaries to be inspected and controlled. (Obj 3.2)"},
        {obj:"3.2",q:"A firewall protecting a bank vault system is configured so that if it fails, all traffic is blocked. This failure mode is:",opts:["Fail-open","Fail-closed","Fail-safe-open","Load balanced"],a:1,e:"Fail-closed blocks traffic when the device fails, favoring security over availability, appropriate for highly sensitive systems. (Obj 3.2)"},
        {obj:"3.2",q:"Administrators must route all privileged access to internal servers through one hardened, monitored host. What is this host called?",opts:["Jump server","Load balancer","Honeypot","Proxy cache"],a:0,e:"A jump server (jump box) is a hardened, audited single entry point for administrative access to sensitive systems. (Obj 3.2)"},
        {obj:"3.2",q:"A device that sits in front of internal clients to filter and log their outbound web traffic is a:",opts:["Forward proxy","Reverse proxy","Load balancer","IDS sensor"],a:0,e:"A forward proxy sits in front of clients, filtering and logging outbound requests. A reverse proxy instead fronts servers for inbound traffic. (Obj 3.2)"},
        {obj:"3.2",q:"Which statement correctly distinguishes an IPS from an IDS?",opts:["An IPS sits inline and can block traffic; an IDS passively monitors and alerts","An IDS blocks traffic; an IPS only alerts","They are identical","Both are physical access controls"],a:0,e:"An IPS is inline and can actively block malicious traffic, while an IDS passively detects and alerts. (Obj 3.2)"},
        {obj:"3.2",q:"To keep a busy web service available and responsive by spreading requests across several servers, you would deploy a:",opts:["Load balancer","Jump server","WAF","Air gap"],a:0,e:"A load balancer distributes incoming traffic across multiple servers, improving availability and performance. (Obj 3.2)"},
        {obj:"3.2",q:"Which standard authenticates a device before it is granted access to a network port, commonly using EAP and a RADIUS server?",opts:["802.1X","TLS 1.3","SNMP","NetFlow"],a:0,e:"802.1X provides port-based network access control, authenticating devices via EAP before allowing network access. (Obj 3.2)"},
        {obj:"3.2",q:"A security appliance that inspects HTTP traffic to block SQL injection and cross-site scripting operates at Layer 7 and is called a:",opts:["Web application firewall","Layer 4 firewall","Load balancer","Network tap"],a:0,e:"A web application firewall (WAF) understands application-layer content and blocks web attacks like SQLi and XSS. (Obj 3.2)"},
        {obj:"3.2",q:"How does a next-generation firewall (NGFW) differ from a traditional packet-filtering firewall?",opts:["It adds deep packet inspection, application awareness, and integrated IPS","It only filters by IP and port","It cannot inspect encrypted traffic ever","It is purely a physical control"],a:0,e:"An NGFW adds application awareness, deep packet inspection, and often IPS beyond simple port and address filtering. (Obj 3.2)"},
        {obj:"3.2",q:"For a site-to-site connection between two data centers, which tunneling protocol operates at the network layer and is commonly used?",opts:["IPSec","SMTP","SNMP","LDAP"],a:0,e:"IPSec secures traffic at the network layer and is common for site-to-site VPNs. TLS-based VPNs are more common for individual remote users. (Obj 3.2)"},
        {obj:"3.2",q:"Which solution combines SD-WAN with cloud-delivered security services close to the user?",opts:["Secure access service edge (SASE)","A hardware UTM only","A single on-prem firewall","A honeypot"],a:0,e:"SASE converges SD-WAN networking with cloud-delivered security (such as secure web gateway, CASB, and zero trust access) at the edge near users. (Obj 3.2)"},
        {obj:"3.2",q:"An intrusion detection sensor is deployed on a mirrored port so it sees a copy of traffic without sitting in the path. This device attribute is:",opts:["Passive (tap/monitor)","Inline","Fail-closed","Load balanced"],a:0,e:"A passive sensor on a tap or monitor port observes copied traffic without being inline, so it cannot block but also cannot become a chokepoint. (Obj 3.2)"},
        {obj:"3.2",q:"A unified threat management (UTM) appliance is best described as:",opts:["A single appliance bundling multiple security functions like firewall, antivirus, and filtering","A backup power system","A cloud storage service","A password manager"],a:0,e:"UTM consolidates many security functions into one appliance, simplifying management at the cost of a potential single point of failure. (Obj 3.2)"},
        {obj:"3.2",q:"Placing a public-facing web server in a screened subnet (DMZ) rather than the internal LAN primarily:",opts:["Limits the damage if the server is compromised, since it cannot directly reach internal systems","Makes the server run faster","Removes the need for patching","Encrypts the server automatically"],a:0,e:"A DMZ isolates public-facing services so a compromise there cannot directly pivot into the trusted internal network. (Obj 3.2)"},
        {obj:"3.2",q:"A remote employee connects to the corporate network over an encrypted tunnel across the public internet. This is a:",opts:["VPN","LAN","DMZ","Load balancer"],a:0,e:"A virtual private network creates an encrypted tunnel over an untrusted network so remote access is protected. (Obj 3.2)"},
        {obj:"3.2",q:"When selecting effective controls for a segment, the guiding aim is to:",opts:["Match the control to the specific risk and the value of what is protected","Always pick the most expensive option","Apply every possible control everywhere","Avoid all controls to reduce cost"],a:0,e:"Effective control selection weighs the risk and the asset's value so protection is proportionate, not blanket or arbitrary. (Obj 3.2)"},
        {obj:"3.2",q:"Which firewall distinction refers to filtering based on application-layer content versus only ports and connections?",opts:["Layer 7 versus Layer 4","Fail-open versus fail-closed","Active versus passive","Hot versus cold"],a:0,e:"A Layer 7 firewall inspects application content, while a Layer 4 firewall filters by ports and transport connections. (Obj 3.2)"},
        {obj:"3.3",q:"Encrypting a laptop's stored files protects data in which state?",opts:["Data at rest","Data in transit","Data in use","Data in motion"],a:0,e:"Data at rest is stored data; disk or file encryption protects it if the device is lost or stolen. (Obj 3.3)"},
        {obj:"3.3",q:"Using TLS to protect information as it moves between a browser and a server protects data in which state?",opts:["Data in transit","Data at rest","Data in use","Data classified"],a:0,e:"Data in transit is data moving across a network; TLS encrypts it against eavesdropping. (Obj 3.3)"},
        {obj:"3.3",q:"Data being actively processed in a system's memory is in which state, and is often the hardest to protect?",opts:["Data in use","Data at rest","Data in transit","Data archived"],a:0,e:"Data in use is being processed in memory and is the most challenging to protect, addressed by techniques like access control and confidential computing. (Obj 3.3)"},
        {obj:"3.3",q:"Labeling records as public, private, confidential, or restricted so appropriate controls are applied is called:",opts:["Data classification","Data sovereignty","Tokenization","Journaling"],a:0,e:"Data classification assigns sensitivity levels so handling and controls match the data's importance. (Obj 3.3)"},
        {obj:"3.3",q:"A company must keep certain records within its country because local law governs data stored there. This principle is:",opts:["Data sovereignty","Load balancing","Air gapping","Federation"],a:0,e:"Data sovereignty means data is subject to the laws of the jurisdiction where it is stored, driving where data may reside. (Obj 3.3)"},
        {obj:"3.3",q:"Which method replaces sensitive values with non-sensitive substitutes mapped in a secure vault, so the real data never appears in the working system?",opts:["Tokenization","Hashing","Compression","Load balancing"],a:0,e:"Tokenization swaps sensitive data for tokens, keeping the real values in a protected vault. (Obj 3.3)"},
        {obj:"3.3",q:"Trade secrets, intellectual property, and regulated personal data are examples of:",opts:["Data types that warrant specific protection","Backup schedules","Network appliances","Recovery sites"],a:0,e:"CompTIA lists data types such as regulated, trade secret, intellectual property, legal, and financial, each needing appropriate protection. (Obj 3.3)"},
        {obj:"3.3",q:"Restricting which users or roles can read a data set, enforced by the system, is which method of securing data?",opts:["Permission restrictions","Geographic dispersion","Clustering","Failover"],a:0,e:"Permission restrictions limit access to data by user or role, one of the listed methods to secure data. (Obj 3.3)"},
        {obj:"3.3",q:"Applying geographic restrictions to data primarily helps an organization:",opts:["Comply with laws about where data may be stored or accessed","Increase server speed","Eliminate the need for encryption","Remove access controls"],a:0,e:"Geographic restrictions control where data can reside or be accessed, supporting sovereignty and regulatory compliance. (Obj 3.3)"},
        {obj:"3.3",q:"Showing only the last four digits of an account number to a call-center agent is an example of:",opts:["Masking","Clustering","Replication","Air gapping"],a:0,e:"Masking hides part of a value while revealing only what is needed, protecting data during display. (Obj 3.3)"},
        {obj:"3.3",q:"Which data classification would most likely apply to information whose loss would cause severe or catastrophic harm to the organization?",opts:["Critical","Public","Unclassified","Ordinary"],a:0,e:"Critical data is the most sensitive tier, where loss or exposure would cause severe harm, warranting the strongest controls. (Obj 3.3)"},
        {obj:"3.3",q:"Human-readable versus non-human-readable is a distinction about:",opts:["The form data takes, which affects how it must be handled and protected","The speed of the network","The color of the label","The number of backups"],a:0,e:"Data can be human-readable (like a document) or non-human-readable (like binary or encoded formats), which influences handling. (Obj 3.3)"},
        {obj:"3.4",q:"Which resilience technique links servers so they act as one system, with another node taking over if one fails?",opts:["Clustering","Simple load balancing","Journaling","Air gapping"],a:0,e:"Clustering ties servers together to share workload and state, providing failover; load balancing merely distributes traffic across independent servers. (Obj 3.4)"},
        {obj:"3.4",q:"A recovery site that is fully equipped and can take over operations almost immediately is a:",opts:["Hot site","Cold site","Warm site","Mobile site"],a:0,e:"A hot site is fully provisioned and near-instant to activate, the fastest and most expensive recovery option. (Obj 3.4)"},
        {obj:"3.4",q:"An organization wants the cheapest recovery site and accepts that bringing it online will take significant time. This is a:",opts:["Cold site","Hot site","Warm site","Clustered site"],a:0,e:"A cold site provides only space and power, making it cheapest but slowest to become operational. (Obj 3.4)"},
        {obj:"3.4",q:"Keeping backup copies at a separate physical location primarily protects against:",opts:["A disaster that destroys the primary site","Slow application performance","Weak passwords","Expired certificates"],a:0,e:"Offsite backups ensure recovery is possible even if the primary site is destroyed by fire, flood, or other disaster. (Obj 3.4)"},
        {obj:"3.4",q:"Which backup concept keeps a continuously updated copy of data at another location?",opts:["Replication","Snapshot","Tabletop exercise","Air gap"],a:0,e:"Replication maintains an up-to-date copy elsewhere, supporting fast recovery and availability. A snapshot is a point-in-time image. (Obj 3.4)"},
        {obj:"3.4",q:"A tabletop exercise is best described as:",opts:["A discussion-based walkthrough of a scenario to test plans and roles","A full physical failover of production","An automated code scan","A hardware power test"],a:0,e:"A tabletop exercise is a discussion-based test where participants walk through a scenario to validate plans without disrupting systems. (Obj 3.4)"},
        {obj:"3.4",q:"Which power solution provides immediate battery power to bridge a brief outage and allow a clean shutdown?",opts:["Uninterruptible power supply (UPS)","Generator","Load balancer","Cold site"],a:0,e:"A UPS supplies instant short-term battery power, unlike a generator, which sustains longer outages but takes seconds to start. (Obj 3.4)"},
        {obj:"3.4",q:"Deploying services across multiple providers to avoid dependence on any one vendor is called:",opts:["Multi-cloud","Air gapping","Single sourcing","Journaling"],a:0,e:"Multi-cloud spreads systems across providers, improving resilience and reducing single-vendor risk. (Obj 3.4)"},
        {obj:"3.4",q:"Using different vendors or technologies for the same function so one shared flaw cannot take everything down is called:",opts:["Platform diversity","Clustering","Snapshotting","Failing closed"],a:0,e:"Platform diversity avoids a monoculture, so a single vulnerability does not compromise every system at once. (Obj 3.4)"},
        {obj:"3.4",q:"Distributing data centers across regions so a regional disaster does not disable everything is called:",opts:["Geographic dispersion","Vertical scaling","Sandboxing","Tokenization"],a:0,e:"Geographic dispersion places resources in different locations to survive localized disasters. (Obj 3.4)"},
        {obj:"3.4",q:"Capacity planning for resilience considers people, technology, and infrastructure primarily to:",opts:["Ensure enough resources exist to meet demand and recover from disruption","Reduce the number of employees","Eliminate backups","Increase attack surface"],a:0,e:"Capacity planning ensures sufficient staffing, technology, and infrastructure to handle load and recover from incidents. (Obj 3.4)"},
        {obj:"3.4",q:"A failover test differs from a tabletop exercise in that a failover test:",opts:["Actually switches operations to the backup system to prove it works","Is only a discussion","Requires no systems","Tests passwords"],a:0,e:"A failover test actively shifts operations to standby systems to validate real recovery, whereas a tabletop is discussion-based. (Obj 3.4)"},
        {obj:"3.4",q:"Which backup method records incremental changes so data can be restored to a precise point?",opts:["Journaling","Cold site","Air gapping","Load balancing"],a:0,e:"Journaling logs changes over time, enabling precise recovery to a chosen point. (Obj 3.4)"},
        {obj:"3.4",q:"A warm site sits between hot and cold because it:",opts:["Has equipment in place but still needs configuration and current data before use","Is fully operational instantly","Has nothing but floor space","Is always cheaper than a cold site"],a:0,e:"A warm site has hardware ready but requires setup and restoring current data, balancing cost and recovery time. (Obj 3.4)"}

      topics:[
        {id:"t3ov",name:"Overview",html:`
          <h3>What Domain 3 covers and what to expect</h3>
          <p>Security Architecture is 18 percent of the exam and marks a shift in thinking. Domain 1 asked what concepts mean and Domain 2 asked how attacks work, but Domain 3 asks you to design. Given a scenario, you choose an architecture or a control and explain the security tradeoff behind that choice. The exam rarely wants a definition here. It wants to know why you would put a web server in a DMZ instead of the internal network, why you would pick a hot site over a cold site, or when fail-closed beats fail-open.</p>
          <p>There are four objectives. <b>3.1</b> compares architecture models such as cloud, on-premises, serverless, containers, and industrial control systems, and the considerations that separate them like availability, cost, scalability, and the ability to patch. <b>3.2</b> is about securing enterprise infrastructure with the right device placement, zones, firewalls, and secure access methods. <b>3.3</b> is about protecting data through classification, understanding its state, and applying encryption, masking, and tokenization. <b>3.4</b> is about resilience and recovery: staying available and getting back up after failure.</p>
          <p>The most reliable way to study this domain is to think in tradeoffs. For every option, ask what it gives you and what it costs. A hot site gives speed and costs money. An air gap gives strong isolation and costs convenience and easy updates. Containers give efficiency and cost isolation strength. When a question describes a goal, pick the option whose tradeoff matches that goal, and the answer usually falls out cleanly.</p>`},
        {id:"t31",name:"3.1 Architecture Models",html:`
          <h3>Architecture models and their tradeoffs</h3>
          <p>Every deployment model carries its own security implications, and the exam tests whether you can weigh them. In the <b>cloud</b>, the shared responsibility model splits duties between provider and customer. The provider secures the physical infrastructure and, depending on the service model, some of the stack above it, while the customer always remains responsible for their own data, identities, and configuration. A responsibility matrix makes this explicit, and hybrid setups add the challenge of securing two environments and the links between them consistently. Third-party vendors extend that trust boundary further.</p>
          <h4>Modern deployment styles</h4>
          <p><b>Infrastructure as code</b> provisions systems from version-controlled configuration files, which makes deployments repeatable and reduces the configuration drift that leads to misconfiguration. <b>Serverless</b> hands server management and patching to the provider, reducing operational burden but concentrating trust and complicating monitoring. <b>Microservices</b> split an application into small independent services that talk over APIs, improving scalability and isolation while enlarging the attack surface. <b>Containerization</b> packages an app with its dependencies and shares the host kernel, which is efficient but offers a thinner isolation boundary than full <b>virtualization</b>, where each virtual machine runs its own guest operating system on a hypervisor.</p>
          <h4>Networks and specialized systems</h4>
          <p>On the network side, you can rely on <b>physical isolation</b> or air-gapping for the most critical systems, <b>logical segmentation</b> to separate traffic without separate hardware, or <b>software-defined networking</b>, which separates the control plane from the data plane for centralized, programmable policy. Specialized environments demand extra care. <b>ICS and SCADA</b> systems run physical processes like power and water, prioritize availability over confidentiality, and often include legacy components that cannot be easily patched. <b>Embedded systems</b>, real-time operating systems, and the broad world of <b>IoT</b> are frequently resource-constrained and hard to update, so isolation and segmentation become the practical defense.</p>
          <h4>The considerations that decide the choice</h4>
          <p>CompTIA lists the factors that drive these decisions: availability, resilience, cost, responsiveness, scalability, ease of deployment, risk transference, ease of recovery, patch availability, the inability to patch, power, and compute. When a scenario states a priority, the right model is the one whose strengths line up with it. If availability and easy recovery matter most, a resilient cloud design may win. If a system cannot be patched, isolation is the move.</p>`},
        {id:"t32",name:"3.2 Secure Infrastructure",html:`
          <h3>Securing enterprise infrastructure</h3>
          <p>This objective is about placing and configuring the right pieces so the network defends itself. It starts with <b>device placement</b> and <b>security zones</b>: you group systems by trust level, such as the untrusted internet, a semi-trusted DMZ or screened subnet, and the trusted internal network, and you force traffic crossing those boundaries to be inspected. Putting a public web server in the DMZ means that if it is compromised, the attacker still cannot reach internal systems directly.</p>
          <div class="diagram">${SVG.segmentation()}<div class="cap">Zones and placement: public services isolated in a screened subnet</div></div>
          <h4>Failure modes and device attributes</h4>
          <p>How a device behaves when it fails matters. <b>Fail-open</b> lets traffic through when the device dies, favoring availability, while <b>fail-closed</b> blocks it, favoring security. A firewall guarding highly sensitive systems usually fails closed. Devices also differ by attribute: <b>active versus passive</b> and <b>inline versus tap or monitor</b>. An inline device sits in the traffic path and can block, while a passive sensor on a mirrored port only observes, so it cannot block but never becomes a chokepoint.</p>
          <h4>Appliances and access control</h4>
          <p>Key appliances include the <b>jump server</b>, a hardened single entry point for administrative access; the <b>proxy server</b>, which fronts clients (forward) or servers (reverse) to filter and distribute traffic; the <b>IDS and IPS</b>, where the detection system alerts passively and the prevention system blocks inline; the <b>load balancer</b>, which spreads traffic for availability; and various <b>sensors</b>. <b>Port security</b> through <b>802.1X</b> with <b>EAP</b> authenticates devices before they touch the network, usually backed by a RADIUS server. Firewalls span a range from Layer 4 filtering to Layer 7 inspection, including the <b>web application firewall</b> for web attacks, <b>unified threat management</b> that bundles many functions, and the <b>next-generation firewall</b> that adds deep inspection, application awareness, and IPS.</p>
          <h4>Secure communication and access</h4>
          <p>To connect safely across untrusted networks, a <b>VPN</b> builds an encrypted tunnel. <b>IPSec</b> secures traffic at the network layer and suits site-to-site links, while TLS-based tunnels are common for remote users. <b>SD-WAN</b> intelligently routes traffic across WAN links, and <b>SASE</b> converges that networking with cloud-delivered security close to the user, so protection follows the user rather than sitting only at a headquarters. Through all of this, control selection should be proportionate: match the strength of the control to the risk and the value of what it protects.</p>
          <div class="diagram">${SVG.tls()}<div class="cap">The TLS handshake that underpins VPNs and secure web traffic (simplified)</div></div>`},
        {id:"t33",name:"3.3 Protecting Data",html:`
          <h3>Concepts and strategies to protect data</h3>
          <p>You cannot protect data well until you know what it is and where it lives. CompTIA groups data into <b>types</b> such as regulated data, trade secrets, intellectual property, legal information, and financial information, and into <b>classifications</b> by sensitivity such as public, private, sensitive, confidential, restricted, and critical. Classification is the foundation: once data is labeled, the right handling and controls follow automatically, and the strongest protections concentrate on restricted and critical information.</p>
          <h4>The three states of data</h4>
          <p>Data exists in three states, and each needs different protection. <b>Data at rest</b> is stored on a disk or in a database and is protected by encryption so a stolen device or drive reveals nothing. <b>Data in transit</b> moves across a network and is protected by TLS or IPSec against eavesdropping. <b>Data in use</b> is actively being processed in memory and is the hardest to protect, since it must be readable to be used; access controls and emerging confidential-computing techniques address it. A complete strategy covers all three, not just one.</p>
          <h4>Sovereignty, location, and methods</h4>
          <p>Where data physically sits carries legal weight. <b>Data sovereignty</b> means data is subject to the laws of the country where it is stored, and <b>geolocation</b> and <b>geographic restrictions</b> control where it may reside or be accessed, which matters for regulatory compliance. To secure the data itself you draw on a familiar toolkit: <b>encryption</b> and <b>hashing</b>, <b>masking</b> that reveals only part of a value, <b>tokenization</b> that swaps sensitive values for vault-mapped tokens, broader <b>obfuscation</b>, <b>segmentation</b> that separates sensitive stores, and <b>permission restrictions</b> that limit who can reach the data at all.</p>`},
        {id:"t34",name:"3.4 Resilience & Recovery",html:`
          <h3>Resilience and recovery</h3>
          <p>Resilience keeps systems running through trouble, and recovery brings them back after failure. Both are architecture decisions you make before anything breaks. <b>High availability</b> is achieved through redundancy and two related techniques that are easy to confuse. <b>Load balancing</b> spreads traffic across independent servers, while <b>clustering</b> links servers so they act as one system with shared state, letting a surviving node take over a failed node's work. Load balancing improves performance and availability; clustering specifically provides failover.</p>
          <h4>Recovery sites</h4>
          <p>When a whole site goes down, a recovery site takes over, and they differ by readiness and cost. A <b>hot site</b> is fully equipped and current, ready almost instantly, and is the most expensive. A <b>cold site</b> is little more than space and power, the cheapest option but the slowest to bring online because everything must be installed and restored. A <b>warm site</b> sits in between, with equipment in place but needing configuration and current data. <b>Geographic dispersion</b> spreads these sites across regions so a single regional disaster cannot disable everything, and <b>multi-cloud</b> and <b>platform diversity</b> avoid depending on one provider or one technology that could share a single fatal flaw.</p>
          <h4>Testing, backups, and power</h4>
          <p>Plans are only as good as their testing. A <b>tabletop exercise</b> is a discussion-based walkthrough, a <b>simulation</b> models an incident more realistically, <b>failover</b> testing actually switches to standby systems to prove they work, and <b>parallel processing</b> runs the backup alongside production. <b>Backups</b> come in several forms: <b>snapshots</b> capture a point in time, <b>replication</b> keeps a continuously updated copy elsewhere, and <b>journaling</b> logs changes for precise recovery, with copies kept both onsite for speed and <b>offsite</b> for disaster protection, encrypted for safety. Finally, power resilience relies on a <b>UPS</b> for immediate short-term battery power and clean shutdown, and a <b>generator</b> for sustained power through long outages. <b>Continuity of operations</b> and sound <b>capacity planning</b> across people, technology, and infrastructure tie it all together.</p>`}
      ],
