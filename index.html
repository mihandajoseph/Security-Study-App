<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Security+">
<meta name="theme-color" content="#0f1419">
<meta name="description" content="CompTIA Security+ SY0-701 study app. Flashcards, practice questions, topic breakdowns, and a timed mock exam. Verified against the official CompTIA exam objectives.">
<title>Security+ SY0-701 Study</title>
<style>
:root{
  --bg:#0f1419;
  --surface:#161c24;
  --surface-2:#1d2530;
  --surface-3:#26303d;
  --border:#2c3846;
  --text:#e6edf3;
  --text-dim:#9aa7b4;
  --text-faint:#6b7885;
  --accent:#e8a33d;
  --accent-soft:rgba(232,163,61,0.14);
  --accent-border:rgba(232,163,61,0.4);
  --teal:#4fd1c5;
  --green:#3fb950;
  --green-soft:rgba(63,185,80,0.14);
  --red:#f85149;
  --red-soft:rgba(248,81,73,0.14);
  --orange:#e3873c;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 6px 24px rgba(0,0,0,0.35);
  --maxw:940px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.6;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
a{color:var(--teal);}
button{font-family:inherit;cursor:pointer;}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(15,20,25,0.92);
  backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0;
}
.hrow{
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;gap:12px;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,var(--accent),#c77d1e);
  display:grid;place-items:center;color:#1a1205;font-weight:800;font-size:15px;
}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand .sub{font-size:11px;color:var(--text-faint);margin-top:-2px;}
.hactions{display:flex;align-items:center;gap:8px;flex:none;}
.accent-pick{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
  padding:0;overflow:hidden;background:var(--accent);position:relative;
}
.accent-pick input{position:absolute;inset:-6px;opacity:0;cursor:pointer;}
.objlink{
  font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-border);
  padding:6px 10px;border-radius:20px;white-space:nowrap;background:var(--accent-soft);
}
.objlink:hover{background:var(--accent);color:#1a1205;}

/* ---------- Top nav ---------- */
nav.top{
  max-width:var(--maxw);margin:0 auto;
  display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;
  scrollbar-width:none;
}
nav.top::-webkit-scrollbar{display:none;}
.tnav{
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  padding:8px 14px;border-radius:22px;font-size:13.5px;font-weight:600;white-space:nowrap;
  transition:.15s;
}
.tnav .pct{font-size:11px;color:var(--text-faint);font-weight:500;margin-left:5px;}
.tnav.active{background:var(--accent);color:#1a1205;border-color:var(--accent);}
.tnav.active .pct{color:#5a4212;}
.tnav.special{border-color:var(--accent-border);color:var(--accent);}
.tnav.special.active{color:#1a1205;}

/* ---------- Layout ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:18px 16px 60px;}
.section-head{margin-bottom:14px;}
.section-head h2{font-size:21px;margin:0 0 3px;font-weight:750;}
.section-head p{margin:0;color:var(--text-dim);font-size:13.5px;}

/* ---------- Sub tabs ---------- */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.stab{
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.15s;
}
.stab.active{background:var(--surface-3);color:var(--text);border-color:var(--accent-border);}

/* ---------- Flashcards ---------- */
.fc-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.fc-count{font-size:13px;color:var(--text-dim);}
.fc-count b{color:var(--text);}
.card-flip{
  perspective:1600px;width:100%;min-height:300px;margin-bottom:16px;cursor:pointer;
}
.card-inner{
  position:relative;width:100%;min-height:300px;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.card-flip.flipped .card-inner{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--radius);border:1px solid var(--border);
  padding:28px 24px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:var(--shadow);
}
.card-front{background:linear-gradient(160deg,var(--surface-2),var(--surface));}
.card-back{background:linear-gradient(160deg,var(--surface-3),var(--surface-2));transform:rotateY(180deg);}
.card-tag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.card-term{font-size:26px;font-weight:750;line-height:1.3;}
.card-def{font-size:16.5px;color:var(--text);line-height:1.62;}
.card-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--text-faint);}
.fc-nav{display:flex;gap:10px;}
.fc-nav button{
  flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:13px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;transition:.15s;
}
.fc-nav button:active{background:var(--surface-3);}
.fc-nav button.primary{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent);}

/* ---------- Questions ---------- */
.score-bar{
  display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;
}
.score-chip{
  flex:1;min-width:90px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 12px;text-align:center;
}
.score-chip .n{font-size:22px;font-weight:750;line-height:1;}
.score-chip .l{font-size:11px;color:var(--text-faint);margin-top:5px;text-transform:uppercase;letter-spacing:.4px;}
.score-chip.pct .n{color:var(--accent);}
.q-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 20px;margin-bottom:16px;
}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.q-obj{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:12px;}
.q-num{font-size:12px;color:var(--text-faint);}
.q-text{font-size:16.5px;font-weight:600;margin-bottom:14px;line-height:1.5;}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:13px 14px;border-radius:var(--radius-sm);margin-bottom:9px;font-size:15px;line-height:1.45;transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--text-faint);}
.opt .lt{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface-3);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-dim);
}
.opt.correct{background:var(--green-soft);border-color:var(--green);}
.opt.correct .lt{background:var(--green);color:#08210d;}
.opt.wrong{background:var(--red-soft);border-color:var(--red);}
.opt.wrong .lt{background:var(--red);color:#2b0806;}
.opt:disabled{cursor:default;}
.explain{
  margin-top:6px;padding:13px 14px;border-radius:var(--radius-sm);font-size:14.5px;line-height:1.6;
  background:var(--surface-2);border-left:3px solid var(--accent);color:var(--text-dim);display:none;
}
.explain.show{display:block;}
.explain b{color:var(--text);}
.explain .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;}
.verdict{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.verdict.right{color:var(--green);}
.verdict.wrong{color:var(--red);}
.why-list{margin-top:12px;border-top:1px solid var(--border);padding-top:11px;}
.why-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);margin-bottom:8px;}
.why-item{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--text-dim);margin-bottom:7px;}
.why-item .why-lt{flex:none;width:19px;height:19px;border-radius:5px;background:var(--surface-3);color:var(--text-faint);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px;}
.why-item.you{color:var(--text);}
.why-item.you .why-lt{background:var(--red);color:#2b0806;}
.why-item.you b{color:var(--red);}
.q-actions{display:flex;gap:10px;margin-top:4px;}
.btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:12px 18px;border-radius:var(--radius-sm);font-size:14.5px;font-weight:650;transition:.15s;
}
.btn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);}
.btn.ghost{background:transparent;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Topic breakdown ---------- */
.topic-body{}
.topic-body h3{font-size:19px;margin:6px 0 8px;font-weight:750;}
.topic-body h4{font-size:15px;margin:22px 0 6px;font-weight:700;color:var(--accent);}
.topic-body p{color:var(--text-dim);margin:0 0 14px;font-size:15.5px;line-height:1.68;}
.topic-body p b, .topic-body p strong{color:var(--text);font-weight:650;}
.diagram{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 14px;margin:8px 0 20px;overflow-x:auto;
}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto;}
.diagram .cap{text-align:center;font-size:12px;color:var(--text-faint);margin-top:10px;}

/* ---------- Quick reference ---------- */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.qr-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 15px;border-top:3px solid var(--accent);
}
.qr-card h5{margin:0 0 6px;font-size:14.5px;font-weight:700;}
.qr-card p{margin:0;font-size:13.5px;color:var(--text-dim);line-height:1.55;}
.qr-card .obj{font-size:10.5px;color:var(--text-faint);font-weight:700;letter-spacing:.4px;text-transform:uppercase;display:block;margin-top:8px;}

/* ---------- Placeholder ---------- */
.placeholder{
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  padding:40px 24px;text-align:center;color:var(--text-dim);
}
.placeholder .ic{font-size:34px;margin-bottom:10px;}
.placeholder h3{color:var(--text);margin:0 0 8px;font-size:18px;}
.placeholder p{margin:0 auto;max-width:440px;font-size:14.5px;}

/* ---------- Mock exam ---------- */
.timer{
  position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;margin-bottom:14px;font-variant-numeric:tabular-nums;
}
.timer .clock{font-size:20px;font-weight:750;letter-spacing:.5px;}
.timer.warn{border-color:var(--orange);} .timer.warn .clock{color:var(--orange);}
.timer.danger{border-color:var(--red);animation:pulse 1s infinite;} .timer.danger .clock{color:var(--red);}
@keyframes pulse{50%{opacity:.55;}}
.timer .meta{font-size:12px;color:var(--text-dim);}
.badge{display:inline-block;padding:7px 18px;border-radius:30px;font-weight:750;font-size:17px;}
.badge.pass{background:var(--green-soft);color:var(--green);border:1px solid var(--green);}
.badge.fail{background:var(--red-soft);color:var(--red);border:1px solid var(--red);}

.footer-note{max-width:var(--maxw);margin:30px auto 0;padding:0 16px;color:var(--text-faint);font-size:12px;text-align:center;line-height:1.6;}
.hidden{display:none !important;}
.progress-track{height:5px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-bottom:16px;}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s;}

/* ---------- Mock exam ---------- */
.mock-start{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;}
.mock-start p{color:var(--text-dim);font-size:15px;line-height:1.65;margin:0 0 14px;}
.mock-start p b{color:var(--text);}
.mock-meta{display:flex;gap:10px;margin:18px 0;}
.mock-meta div{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
.mock-meta div span{display:block;font-size:22px;font-weight:750;color:var(--accent);margin-bottom:4px;text-transform:none;letter-spacing:0;}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:4px;}
.mock-note{font-size:13px;color:var(--text-faint);margin-top:14px !important;}
.opt.picked{background:var(--accent-soft);border-color:var(--accent);}
.opt.picked .lt{background:var(--accent);color:#1a1205;}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:16px 0;}
.qnav-cell{aspect-ratio:1;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:7px;font-size:12.5px;font-weight:600;padding:0;}
.qnav-cell.done{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent);}
.qnav-cell.current{outline:2px solid var(--accent);outline-offset:1px;color:var(--text);}
.submit-area{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.submit-area .btn{flex:1;}
.submit-warn{flex-basis:100%;background:var(--red-soft);border:1px solid var(--red);color:var(--text);padding:11px 14px;border-radius:var(--radius-sm);font-size:14px;}
.results{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;text-align:center;}
.result-score{font-size:52px;font-weight:800;line-height:1;margin:16px 0 6px;}
.result-sub{color:var(--text-dim);font-size:14px;}
.result-stats{display:flex;gap:10px;margin-top:20px;}
.result-stats div{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 6px;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
.result-stats div span{display:block;font-size:20px;font-weight:750;color:var(--text);margin-bottom:4px;text-transform:none;letter-spacing:0;}
.dom-breakdown{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-top:16px;}
.dom-breakdown h4{margin:0 0 14px;font-size:15px;}
.dom-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.dom-name{flex:0 0 40%;font-size:13px;color:var(--text-dim);line-height:1.3;}
.dom-bar{flex:1;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.dom-fill{height:100%;background:var(--accent);border-radius:4px;}
.dom-num{flex:none;font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
.result-actions{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}
.result-actions .btn{flex:1;min-width:150px;}

/* ---------- Official Samples ---------- */
.samples-note{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;color:var(--text-dim);line-height:1.6;margin:2px 0 4px;}
.samples-note b{color:var(--text);}
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin:24px 0 11px;}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.res-card{display:block;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:14px 15px;text-decoration:none;color:var(--text);transition:.15s;}
.res-card:hover{border-color:var(--accent-border);background:var(--surface-2);}
.res-card h5{margin:0 0 5px;font-size:14.5px;color:var(--text);}
.res-card p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.5;}
.res-card .go{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent);font-weight:700;}
.pbq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;margin-bottom:14px;}
.pbq-card .lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);}
.pbq-card h4{margin:6px 0 8px;font-size:16px;font-weight:700;}
.pbq-card>p{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin:0 0 12px;}
.pbq-card .btn{padding:10px 16px;font-size:14px;}
.pbq-answer{display:none;margin-top:11px;padding:13px 14px;background:var(--surface-2);border-left:3px solid var(--green);border-radius:var(--radius-sm);font-size:14px;color:var(--text-dim);line-height:1.62;}
.pbq-answer.show{display:block;}
.pbq-answer b{color:var(--text);}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="logo">S+</div>
      <div>
        <h1>Security+ SY0-701</h1>
        <div class="sub">Study &amp; Mock Exam</div>
      </div>
    </div>
    <div class="hactions">
      <a class="objlink" id="objPdf" href="#" target="_blank" rel="noopener">Exam Objectives PDF</a>
      <button class="accent-pick" title="Pick accent color">
        <input type="color" id="accentInput" value="#e8a33d">
      </button>
    </div>
  </div>
  <nav class="top" id="topNav"></nav>
</header>

<main id="main"></main>

<div class="footer-note">
  Content verified against the official CompTIA Security+ SY0-701 Exam Objectives (v5.0) and primary sources (NIST, CISA, RFCs).
  This is an independent study aid and is not affiliated with or endorsed by CompTIA.
</div>

<script>
/* =========================================================================
   Safe storage (works on GitHub Pages / iOS home screen; degrades silently)
   ========================================================================= */
const store = (()=> {
  let ok=true; try{const k='__s+t';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){ok=false;}
  const mem={};
  return {
    get:k=>{try{return ok?localStorage.getItem(k):mem[k];}catch(e){return mem[k];}},
    set:(k,v)=>{try{ok?localStorage.setItem(k,v):mem[k]=v;}catch(e){mem[k]=v;}}
  };
})();

/* =========================================================================
   Accent color
   ========================================================================= */
(function(){
  const saved=store.get('accent');
  if(saved){document.documentElement.style.setProperty('--accent',saved);
    document.getElementById('accentInput').value=saved; setSoft(saved);}
  document.getElementById('accentInput').addEventListener('input',e=>{
    const c=e.target.value;
    document.documentElement.style.setProperty('--accent',c);
    setSoft(c); store.set('accent',c);
  });
  function setSoft(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    document.documentElement.style.setProperty('--accent-soft',`rgba(${r},${g},${b},0.14)`);
    document.documentElement.style.setProperty('--accent-border',`rgba(${r},${g},${b},0.4)`);
  }
})();

const OBJECTIVES_PDF="https://assets.ctfassets.net/82ripq7fjls2/6TYWUym0Nudqa8nGEnegjG/0f9b974d3b1837fe85ab8e6553f4d623/CompTIA-Security-Plus-SY0-701-Exam-Objectives.pdf";
const COMPTIA_CERT="https://www.comptia.org/en-us/certifications/security/";
document.getElementById('objPdf').href=OBJECTIVES_PDF;

/* =========================================================================
   SVG DIAGRAM LIBRARY  (dark-theme friendly, semantically labeled)
   ========================================================================= */
const SVG = {
  ciaTriad(){return `

      id:"d1", n:1, name:"General Security Concepts", weight:12, ready:true,
      objectives:"1.1 security controls · 1.2 fundamental concepts · 1.3 change management · 1.4 cryptographic solutions",
      flashcards:[
        {tag:"Obj 1.2",term:"CIA Triad",def:"The three core goals of information security: Confidentiality (keep data secret from unauthorized parties), Integrity (data is accurate and unaltered), and Availability (data and systems are accessible when needed)."},
        {tag:"Obj 1.2",term:"Non-repudiation",def:"Assurance that someone cannot deny an action they took. Digital signatures provide it: only the holder of the private key could have signed, so the sender cannot later deny sending."},
        {tag:"Obj 1.2",term:"AAA",def:"Authentication (prove who you are), Authorization (what you are allowed to do), and Accounting (logging what you did). The backbone of access control."},
        {tag:"Obj 1.2",term:"Zero Trust",def:"A model that trusts no user or device by default, inside or outside the network. Every access request is verified. Enforced through a control plane (decisions) and data plane (enforcement)."},
        {tag:"Obj 1.2",term:"Policy Enforcement Point (PEP)",def:"The data-plane component that sits in front of a resource and actually allows or blocks a request, based on the decision made by the control plane's Policy Engine and Policy Administrator."},
        {tag:"Obj 1.2",term:"Policy Engine / Policy Administrator",def:"Control-plane components in zero trust. The Policy Engine decides grant or deny; the Policy Administrator carries out that decision and establishes or shuts the session."},
        {tag:"Obj 1.2",term:"Honeypot",def:"A decoy system designed to attract attackers so their behavior can be studied and real assets stay protected. A honeynet is a whole decoy network; a honeyfile or honeytoken is bait data that triggers an alert when touched."},
        {tag:"Obj 1.1",term:"Security Control Categories",def:"Technical (implemented in tech, e.g. firewalls), Managerial (policies and oversight), Operational (day-to-day human processes like awareness training), and Physical (locks, guards, fences)."},
        {tag:"Obj 1.1",term:"Security Control Types",def:"Preventive (stop it), Deterrent (discourage it), Detective (identify it), Corrective (fix after it), Compensating (alternative when the primary isn't feasible), and Directive (direct behavior via policy)."},
        {tag:"Obj 1.4",term:"Symmetric Encryption",def:"One shared secret key encrypts and decrypts. Fast, good for bulk data (e.g. AES). Weakness: securely distributing the shared key."},
        {tag:"Obj 1.4",term:"Asymmetric Encryption",def:"A public/private key pair. What one key encrypts only the other can decrypt. Solves key exchange and enables digital signatures (e.g. RSA, ECC)."},
        {tag:"Obj 1.4",term:"Hashing",def:"A one-way function producing a fixed-length digest of input. Used to verify integrity, not to encrypt. The same input always yields the same hash; you cannot reverse it (e.g. SHA-256)."},
        {tag:"Obj 1.4",term:"Salting",def:"Adding random data to a password before hashing so identical passwords produce different hashes. Defeats precomputed rainbow-table attacks."},
        {tag:"Obj 1.4",term:"Key Stretching",def:"Deliberately making key or password derivation slow and computationally expensive (e.g. PBKDF2, bcrypt, scrypt) to make brute-force attacks impractical."},
        {tag:"Obj 1.4",term:"Digital Signature",def:"The sender hashes the message and encrypts the hash with their private key. The receiver verifies with the sender's public key, confirming integrity, authentication, and non-repudiation."},
        {tag:"Obj 1.4",term:"PKI",def:"Public Key Infrastructure: the framework of certificate authorities, certificates, and keys that binds public keys to identities and enables trust at scale."},
        {tag:"Obj 1.4",term:"Key Escrow",def:"A trusted third party securely holds a copy of cryptographic keys so data can be recovered if the original key is lost. Introduces a recovery path and a risk if the escrow is compromised."},
        {tag:"Obj 1.4",term:"TPM vs HSM",def:"A TPM is a chip built into a device for secure key storage and boot integrity on that one machine. An HSM is a dedicated, often network-attached, hardened device for generating and managing keys at scale."},
        {tag:"Obj 1.4",term:"CRL vs OCSP",def:"Both check whether a certificate is revoked. A CRL is a downloaded list of revoked certs; OCSP queries the CA in real time for a single certificate's status, which is faster and more current."},
        {tag:"Obj 1.4",term:"CSR",def:"Certificate Signing Request: a file containing your public key and identifying details that you send to a CA to request a signed certificate. The matching private key never leaves your control."},
        {tag:"Obj 1.4",term:"Steganography vs Tokenization vs Masking",def:"Obfuscation methods. Steganography hides data inside other files (e.g. an image). Tokenization swaps sensitive data for a non-sensitive token mapped in a secure vault. Masking shows partial data (e.g. ****1234)."},
        {tag:"Obj 1.3",term:"Change Management",def:"A formal process to control changes: approval, ownership, stakeholders, impact analysis, test results, a backout plan, and a maintenance window. Reduces security incidents caused by unmanaged changes."}
      ],
      questions:[
        {obj:"1.2",q:"An organization wants to ensure that a user who sends a signed message cannot later deny having sent it. Which security concept does this describe?",opts:["Confidentiality","Non-repudiation","Availability","Integrity"],a:1,e:"Non-repudiation prevents a party from denying an action. Digital signatures provide it because only the holder of the private key could have produced the signature."},
        {obj:"1.2",q:"A hospital's patient records system goes offline during a ransomware attack, blocking staff from retrieving records. Which part of the CIA triad is most directly affected?",opts:["Confidentiality","Integrity","Availability","Authentication"],a:2,e:"Availability is the assurance that systems and data are accessible when needed. An outage that blocks legitimate access is an availability failure."},
        {obj:"1.2",q:"Which pairing correctly matches the AAA components in order?",opts:["Authorization, Authentication, Accounting","Authentication, Authorization, Accounting","Accounting, Authentication, Authorization","Authentication, Accounting, Authorization"],a:1,e:"AAA is Authentication (who you are), then Authorization (what you may do), then Accounting (logging what you did). Identity is always proven before access is granted."},
        {obj:"1.2",q:"In a zero trust architecture, which component actually enforces the allow-or-deny decision at the resource?",opts:["Policy Engine","Policy Administrator","Policy Enforcement Point","Threat scope reduction"],a:2,e:"The Policy Enforcement Point (PEP) sits in the data plane and enforces the decision. The Policy Engine (control plane) makes the decision and the Policy Administrator executes it."},
        {obj:"1.2",q:"A security team deploys a decoy server with fake data to observe attacker techniques without risking production systems. What is this called?",opts:["Honeypot","Sandbox","Jump server","Bastion host"],a:0,e:"A honeypot is a decoy designed to attract and study attackers. A honeynet is a network of them; honeyfiles and honeytokens are bait data that alert when accessed."},
        {obj:"1.1",q:"A company installs bollards and fencing around its data center. Which category of security control are these?",opts:["Technical","Managerial","Operational","Physical"],a:3,e:"Bollards, fences, locks, and guards are physical controls. Technical controls are implemented in technology, managerial are policy/oversight, operational are human processes."},
        {obj:"1.1",q:"A warning sign stating 'Premises under 24-hour video surveillance' is intended to discourage would-be intruders. Which control TYPE is this?",opts:["Preventive","Detective","Deterrent","Corrective"],a:2,e:"A deterrent control discourages an attacker from acting. It does not physically stop entry (preventive) or record it (detective); it changes behavior through discouragement."},
        {obj:"1.1",q:"After a server is compromised, the team restores it from a clean backup. Which control type does the restoration represent?",opts:["Preventive","Corrective","Deterrent","Directive"],a:1,e:"A corrective control acts after an incident to fix or restore. Restoring from backup remediates the damage, which is corrective."},
        {obj:"1.1",q:"An organization cannot patch a legacy system, so it isolates it on a segmented VLAN with strict firewall rules instead. The VLAN isolation is best described as which control type?",opts:["Compensating","Preventive","Detective","Deterrent"],a:0,e:"A compensating control is an alternative safeguard used when the primary control (patching) isn't feasible. It provides comparable protection by other means."},
        {obj:"1.1",q:"An acceptable use policy that instructs employees on required behavior is an example of which control type?",opts:["Detective","Directive","Compensating","Corrective"],a:1,e:"A directive control directs or mandates behavior, typically through policy or procedure. It tells people what they must do."},
        {obj:"1.4",q:"Which encryption approach uses a single shared key for both encryption and decryption?",opts:["Asymmetric","Symmetric","Hashing","Public key"],a:1,e:"Symmetric encryption uses one shared secret key for both operations. It is fast and suited to bulk data (e.g. AES). Its challenge is securely distributing the key. (Obj 1.4)"},
        {obj:"1.4",q:"A sender wants to encrypt a message so that only the intended recipient can read it, using asymmetric cryptography. Which key should the sender use?",opts:["The sender's private key","The sender's public key","The recipient's public key","The recipient's private key"],a:2,e:"To ensure only the recipient can decrypt, encrypt with the recipient's public key. Only the matching private key, held solely by the recipient, can decrypt it."},
        {obj:"1.4",q:"Which property makes a cryptographic hash function suitable for verifying file integrity?",opts:["It can be reversed with the correct key","It produces a fixed-length, one-way digest","It uses a shared secret key","It compresses the file for storage"],a:1,e:"A hash is a one-way function producing a fixed-length digest. Any change to the input changes the hash, which is why it verifies integrity. It is not reversible and uses no key."},
        {obj:"1.4",q:"Why is a unique salt added to each password before hashing?",opts:["To encrypt the password so it can be recovered","To make identical passwords hash differently and defeat rainbow tables","To compress the password database","To speed up the hashing process"],a:1,e:"Salting adds random data so two users with the same password get different hashes, defeating precomputed rainbow-table attacks. It does not make hashing faster or reversible."},
        {obj:"1.4",q:"Techniques like bcrypt and PBKDF2 intentionally make password hashing slow. What is this defense called?",opts:["Salting","Key escrow","Key stretching","Tokenization"],a:2,e:"Key stretching deliberately increases the computational cost of deriving a key from a password, making brute-force attacks impractically slow. (Obj 1.4)"},
        {obj:"1.4",q:"To create a digital signature, the sender encrypts the message's hash with which key?",opts:["The sender's private key","The recipient's public key","A shared symmetric key","The recipient's private key"],a:0,e:"The sender signs by encrypting the hash with their own private key. Anyone can verify it with the sender's public key, providing integrity, authentication, and non-repudiation."},
        {obj:"1.4",q:"What is the primary purpose of a Public Key Infrastructure (PKI)?",opts:["To encrypt all network traffic automatically","To bind public keys to verified identities through trusted certificate authorities","To store passwords securely","To generate random symmetric keys"],a:1,e:"PKI is the framework of CAs, certificates, and keys that binds public keys to identities so trust can scale. (Obj 1.4)"},
        {obj:"1.4",q:"A certificate authority needs a fast, real-time way to tell clients whether a single certificate has been revoked. Which mechanism fits best?",opts:["CRL","OCSP","CSR","Key escrow"],a:1,e:"OCSP (Online Certificate Status Protocol) checks one certificate's revocation status in real time. A CRL is a bulk downloaded list, which is slower and less current."},
        {obj:"1.4",q:"An administrator generates a CSR to obtain a TLS certificate. What does the CSR contain?",opts:["The private key only","The public key and identifying information","The CA's root certificate","The symmetric session key"],a:1,e:"A Certificate Signing Request contains the public key and identity details sent to the CA. The matching private key never leaves the requester's control. (Obj 1.4)"},
        {obj:"1.4",q:"A payment system replaces stored credit card numbers with randomly generated values mapped in a secure vault. Which obfuscation method is this?",opts:["Steganography","Data masking","Tokenization","Salting"],a:2,e:"Tokenization substitutes sensitive data with a non-sensitive token, with the real value held in a secure vault. Masking only hides part of the visible data; steganography hides data inside other files."},
        {obj:"1.4",q:"Which device is a dedicated, hardened appliance used to generate and manage cryptographic keys at enterprise scale, often network-attached?",opts:["TPM","HSM","Secure enclave","CRL"],a:1,e:"An HSM (Hardware Security Module) is a dedicated appliance for key generation and management at scale. A TPM is a chip bound to a single device's motherboard."},
        {obj:"1.4",q:"A TPM chip is best described as providing which capability?",opts:["Network-attached key management for many servers","Hardware-based key storage and boot integrity for a single device","A list of revoked certificates","A method for hiding data in images"],a:1,e:"A Trusted Platform Module is a chip on a device's board that stores keys and supports secure/measured boot for that machine. Scale-out key management is the HSM's role."},
        {obj:"1.4",q:"An organization stores a recoverable copy of encryption keys with a trusted third party so data isn't lost if a key is misplaced. What is this arrangement?",opts:["Key stretching","Key escrow","Certificate pinning","Perfect forward secrecy"],a:1,e:"Key escrow places a copy of keys with a trusted party for recovery. It enables data recovery but adds risk if the escrow itself is compromised. (Obj 1.4)"},
        {obj:"1.4",q:"During a TLS session, why is asymmetric encryption typically used only at the start of the connection?",opts:["It is more secure than symmetric for bulk data","It is slower, so it is used only to exchange a symmetric session key","It cannot encrypt large messages at all","It does not require certificates"],a:1,e:"Asymmetric operations are computationally expensive, so TLS uses them to authenticate and exchange a symmetric session key, then switches to fast symmetric encryption for the actual data."},
        {obj:"1.3",q:"Before deploying a major firewall change, a team documents how to reverse it if something breaks. What is this part of change management called?",opts:["Impact analysis","Backout plan","Maintenance window","Standard operating procedure"],a:1,e:"A backout plan defines how to revert a change if it fails or causes problems, limiting downtime and risk. (Obj 1.3)"},
        {obj:"1.3",q:"Why is a defined maintenance window important in change management?",opts:["It eliminates the need for approval","It schedules changes for low-impact times to reduce disruption","It removes the need for a backout plan","It automatically tests the change"],a:1,e:"A maintenance window schedules changes during periods of least impact (e.g. overnight), reducing disruption to users and services. It does not replace approval or testing."},
        {obj:"1.3",q:"An unmanaged emergency change bypasses the normal approval process and causes an outage. Which change-management element was most likely skipped?",opts:["Version control","Approval process and impact analysis","Data masking","Key escrow"],a:1,e:"Skipping approval and impact analysis means the change's risks were not reviewed before deployment, a common root cause of change-induced outages. (Obj 1.3)"},
        {obj:"1.3",q:"After a network change is deployed, updating the network diagrams and procedures reflects which change-management practice?",opts:["Documentation","Deterrent control","Tokenization","Backout plan"],a:0,e:"Keeping diagrams, policies, and procedures current is the documentation element of change management, ensuring records match the real environment. (Obj 1.3)"},
        {obj:"1.2",q:"Which statement best captures the core principle of zero trust?",opts:["Trust everything inside the corporate network perimeter","Trust no user or device by default and verify every request","Trust devices that pass an initial login","Trust traffic that uses encryption"],a:1,e:"Zero trust removes implicit trust based on network location. Every request is authenticated and authorized, inside or outside the perimeter. (Obj 1.2)"},
        {obj:"1.1",q:"A door lock is installed to stop unauthorized physical entry. Classify it by category and type.",opts:["Technical control, detective type","Physical control, preventive type","Managerial control, directive type","Operational control, corrective type"],a:1,e:"A lock is a physical control (category) that prevents unauthorized entry (preventive type). Category describes how it's implemented; type describes what it does."},
        {obj:"1.4",q:"A company wants each user's identical password to be stored differently in the database and also wants to slow down offline cracking. Which two techniques together achieve this?",opts:["Tokenization and masking","Salting and key stretching","Steganography and hashing","Key escrow and CRL"],a:1,e:"Salting makes identical passwords hash differently; key stretching slows each guess. Together they strongly harden stored password hashes against offline attacks. (Obj 1.4)"},
        {obj:"1.4",q:"Which best describes the difference between hashing and encryption?",opts:["Hashing is reversible with a key; encryption is not","Encryption is reversible with a key; hashing is a one-way function","Both are one-way functions","Both require a public/private key pair"],a:1,e:"Encryption is reversible using the appropriate key so data can be recovered. Hashing is one-way and used to verify integrity, not to recover the original data. (Obj 1.4)"},
        {obj:"1.1",q:"An intrusion detection system alerts the SOC after malicious traffic has already entered the network. Which control type is the IDS acting as?",opts:["Preventive","Deterrent","Detective","Directive"],a:2,e:"A detective control identifies and records that an event has occurred, such as an IDS alert or log review. It does not stop the event, which would be preventive. (Obj 1.1)"},
        {obj:"1.1",q:"Which control category covers security awareness training and incident response procedures carried out by staff day to day?",opts:["Technical","Operational","Physical","Managerial"],a:1,e:"Operational controls are executed by people in daily operations, such as awareness training and following IR procedures. Managerial controls are the policies and oversight behind them. (Obj 1.1)"},
        {obj:"1.2",q:"Which zero trust concept limits how much of the network a verified subject can reach, shrinking the blast radius of a compromise?",opts:["Implicit trust zone","Threat scope reduction","Accounting","Key escrow"],a:1,e:"Threat scope reduction applies least privilege so a subject can reach only what it needs, limiting damage if it is compromised. It is part of CompTIA's zero trust control plane. (Obj 1.2)"},
        {obj:"1.2",q:"An access control vestibule with two interlocking doors is primarily designed to prevent which of the following?",opts:["Phishing","Shoulder surfing","Tailgating or piggybacking","SQL injection"],a:2,e:"An access control vestibule (mantrap) allows one person through at a time, preventing tailgating or piggybacking into a secure area. It is a physical control. (Obj 1.2)"},
        {obj:"1.2",q:"A set of fake credentials is placed in a configuration file. Any attempt to use them signals an intrusion. What is this?",opts:["Sandbox","Honeypot","Honeynet","Honeytoken"],a:3,e:"A honeytoken is bait data, such as fake credentials or records, with no legitimate use. Any access to it reveals malicious activity. (Obj 1.2)"},
        {obj:"1.2",q:"Comparing an organization's current security posture against a target framework to find missing controls is called what?",opts:["Gap analysis","Penetration test","Impact analysis","Risk transference"],a:0,e:"A gap analysis compares the current state against a desired standard or framework to identify gaps that need remediation. (Obj 1.2)"},
        {obj:"1.2",q:"Two servers present certificates to authenticate to each other before exchanging data. This is an example of authenticating what?",opts:["People","Accounting","Systems","Availability"],a:2,e:"AAA includes authenticating systems, commonly through certificates or mutual TLS, not only human users. (Obj 1.2)"},
        {obj:"1.3",q:"What is the main purpose of version control in change management?",opts:["Encrypt configuration files","Schedule maintenance windows","Approve emergency changes","Track and roll back changes with a full history"],a:3,e:"Version control keeps a traceable history of changes so you can see what changed, by whom, and revert if a change causes problems. (Obj 1.3)"},
        {obj:"1.3",q:"Recognizing before deployment that a service restart will affect several dependent applications is part of which change-management step?",opts:["Backout plan","Approval process","Impact analysis","Version control"],a:2,e:"Impact analysis identifies dependencies and downstream effects, such as other applications that rely on a service being restarted. (Obj 1.3)"},
        {obj:"1.4",q:"A stolen laptop reveals nothing because its entire drive, including the operating system, is encrypted. Which encryption level is this?",opts:["File-level encryption","Full-disk encryption","Record-level encryption","Transport encryption"],a:1,e:"Full-disk encryption (FDE) protects the whole volume including the OS, which is ideal for lost or stolen devices. File-level encryption protects only individual files. (Obj 1.4)"},
        {obj:"1.4",q:"Which statement best describes an open public ledger as used in blockchain?",opts:["A private database controlled by one authority","A list of revoked certificates","A distributed, append-only record that all participants can verify","A store of symmetric session keys"],a:2,e:"A blockchain is an open public ledger: a distributed, tamper-evident, append-only record that participants can independently verify. (Obj 1.4)"},
        {obj:"1.4",q:"A company needs a single certificate to secure mail.example.com, vpn.example.com, and shop.example.com. Which certificate type is most efficient?",opts:["A self-signed certificate","A wildcard certificate","A root CA certificate","A code-signing certificate"],a:1,e:"A wildcard certificate (*.example.com) secures multiple subdomains under one domain with a single certificate. (Obj 1.4)"},
        {obj:"1.4",q:"Why do browsers warn users about a self-signed certificate on a public website?",opts:["It uses weak symmetric keys","It cannot encrypt traffic at all","It contains no public key","It is not issued by a trusted third-party CA in the browser's trust store"],a:3,e:"A self-signed certificate is not vouched for by a trusted third-party CA, so the client cannot verify the identity and warns the user. It can still encrypt but provides no external trust. (Obj 1.4)"},
        {obj:"1.4",q:"Which hardware feature isolates sensitive operations such as key handling from the main operating system?",opts:["Certificate revocation list","Secure enclave","Certificate signing request","Honeypot"],a:1,e:"A secure enclave is an isolated hardware region that protects sensitive operations and keys from the main OS. (Obj 1.4)"},
        {obj:"1.4",q:"Diffie-Hellman allows two parties to accomplish what over an insecure channel?",opts:["Agree on a shared secret key without transmitting the key itself","Digitally sign a message","Revoke a compromised certificate","Hash a stored password"],a:0,e:"Diffie-Hellman key exchange lets two parties derive a shared symmetric secret over an insecure channel without ever sending the key. (Obj 1.4)"},
        {obj:"1.4",q:"A support screen shows a stored card number as **** **** **** 1234. Which obfuscation technique is this?",opts:["Tokenization","Data masking","Steganography","Hashing"],a:1,e:"Data masking reveals only part of a value, such as the last four digits, while hiding the rest during display. Tokenization instead replaces the whole value with a vault-mapped token. (Obj 1.4)"},
        {obj:"1.1",q:"Which of the following is an example of a managerial control?",opts:["An annual risk assessment and written security policy","A firewall rule set","A door lock","Restoring a system from backup"],a:0,e:"Managerial controls are administrative decisions and oversight, such as risk assessments and security policies. Firewalls are technical, locks physical, and a restore is corrective. (Obj 1.1)"},
        {obj:"1.1",q:"A retailer cannot immediately meet an encryption requirement, so it adds extra monitoring and network isolation in the interim. These interim measures are best described as:",opts:["Directive controls","Deterrent controls","Compensating controls","Corrective controls"],a:2,e:"Compensating controls are alternative safeguards used when the primary control cannot yet be implemented, providing comparable protection by other means. (Obj 1.1)"},
        {obj:"1.1",q:"A policy that requires employees to lock their screens when away from their desks is which control type?",opts:["Detective control","Physical control","Compensating control","Directive control"],a:3,e:"A directive control directs required behavior, usually through policy or procedure. Note that 'physical' is a category, not a type. (Obj 1.1)"},
        {obj:"1.2",q:"Which measure most directly preserves the confidentiality of data while it is in transit?",opts:["Encrypting the connection with TLS","Hashing the data","Load balancing the servers","Logging all access"],a:0,e:"Encrypting the connection (for example with TLS) keeps data unreadable to eavesdroppers in transit, protecting confidentiality. Hashing protects integrity, not confidentiality. (Obj 1.2)"},
        {obj:"1.2",q:"A checksum mismatch on a downloaded file most directly indicates a failure of which security goal?",opts:["Confidentiality","Availability","Integrity","Non-repudiation"],a:2,e:"A checksum verifies integrity. A mismatch means the file was altered or corrupted, an integrity failure. (Obj 1.2)"},
        {obj:"1.2",q:"In a zero trust architecture, which control-plane component actually makes the allow-or-deny decision?",opts:["Policy Enforcement Point","Subject","Implicit trust zone","Policy Engine"],a:3,e:"The Policy Engine makes the grant-or-deny decision in the control plane. The Policy Enforcement Point only enforces that decision in the data plane. (Obj 1.2)"},
        {obj:"1.3",q:"Following a documented standard operating procedure during a change primarily ensures what?",opts:["Consistent, repeatable execution","Faster encryption","Automatic approval","Shorter key length"],a:0,e:"A standard operating procedure (SOP) provides a repeatable, consistent set of steps so changes are performed the same reliable way each time. (Obj 1.3)"},
        {obj:"1.3",q:"Scheduling a change for 2 a.m. Sunday to minimize user impact defines the change's:",opts:["Backout plan","Impact analysis","Maintenance window","Ownership"],a:2,e:"A maintenance window is the scheduled period, chosen for least impact, during which the change is performed. (Obj 1.3)"},
        {obj:"1.3",q:"A change updates the application allow list to permit a new tool. This is an example of which change-management area?",opts:["A managerial control","A deterrent control","A root of trust","A technical implication"],a:3,e:"Allow lists and deny lists are technical implications of change management, controlling what is permitted after a change. (Obj 1.3)"},
        {obj:"1.4",q:"All else being equal, increasing the key length of an encryption algorithm primarily does what?",opts:["Increases resistance to brute-force attacks","Makes the algorithm reversible without a key","Removes the need for a key","Converts symmetric encryption to asymmetric"],a:0,e:"A longer key exponentially increases the number of possible keys, making brute-force attacks far less feasible. (Obj 1.4)"},
        {obj:"1.4",q:"In PKI, an offline root certificate authority primarily serves as the:",opts:["Real-time revocation checker","Symmetric key generator","Root of trust that anchors the certificate chain","Data masking engine"],a:2,e:"The root CA is the root of trust that anchors the entire certificate chain. It is kept offline and delegates issuance to intermediate CAs. (Obj 1.4)"},
        {obj:"1.4",q:"In an asymmetric key pair, which key must always be kept secret by its owner?",opts:["The private key","The public key","The certificate","The CSR"],a:0,e:"The private key must remain secret; it decrypts data encrypted with the public key and creates digital signatures. The public key, certificate, and CSR are meant to be shared. (Obj 1.4)"}
      ],
      topics:[
        {id:"t1ov",name:"Overview",html:`
          <h3>What Domain 1 covers and what to expect</h3>
          <p>General Security Concepts is 12 percent of the exam, the smallest domain by weight, but it is the foundation everything else builds on. The vocabulary and principles here reappear in every other domain, so time spent getting these exactly right pays off across the whole test. There are four objectives: <b>1.1</b> the types of security controls, <b>1.2</b> the fundamental concepts including the CIA triad, AAA, and zero trust, <b>1.3</b> change management, and <b>1.4</b> cryptographic solutions, which is the largest and most heavily tested part of this domain.</p>
          <p>Expect mostly definitional and recognition questions rather than deep scenarios. You will be asked to tell one term from another, to classify a control, or to pick the cryptographic tool that fits a need. The classic trap in 1.1 is confusing a control's <b>category</b> (how it is implemented: technical, managerial, operational, physical) with its <b>type</b> (what it does: preventive, deterrent, detective, corrective, compensating, directive). Every control has one of each, and questions love to test whether you can separate them.</p>
          <p>The best way to study this domain is precise vocabulary. Learn the CIA triad and non-repudiation cold, know the AAA order, be able to place the zero trust components (Policy Engine decides, Policy Administrator executes, Policy Enforcement Point enforces), and drill the cryptography terms until symmetric versus asymmetric, hashing versus encryption, and the certificate and key concepts are second nature. If you can define it crisply, you can answer it.</p>`},
        {id:"t11",name:"1.1 Security Controls",html:`
          <h3>Security controls: categories and types</h3>
          <p>CompTIA splits controls along two independent axes. The <b>category</b> describes how a control is implemented, and the <b>type</b> describes what the control is trying to do about a threat. A single control has one category and one type, and the exam loves to test whether you can separate the two. A door lock is a <b>physical</b> control (category) that is <b>preventive</b> (type). A CCTV warning sign is physical and deterrent. The same camera can be detective when it records evidence.</p>
          <h4>The four categories</h4>
          <p><b>Technical</b> controls are implemented in technology, such as firewalls, encryption, and access control lists. <b>Managerial</b> controls are administrative decisions and oversight, like risk assessments and security policies. <b>Operational</b> controls are carried out by people day to day, such as security awareness training and guard rotations. <b>Physical</b> controls protect the tangible world: fences, locks, bollards, lighting, and access vestibules.</p>
          <h4>The six types</h4>
          <p><b>Preventive</b> controls stop an action before it happens, like a firewall rule denying traffic. <b>Deterrent</b> controls discourage an attacker without necessarily blocking them, like a warning sign. <b>Detective</b> controls identify and record that something happened, like log monitoring or an IDS. <b>Corrective</b> controls fix things afterward, like restoring from backup. <b>Compensating</b> controls are the alternative you use when the ideal control isn't feasible, such as isolating an unpatchable legacy server. <b>Directive</b> controls direct behavior through policy, like an acceptable use policy.</p>`},
        {id:"t12",name:"1.2 Fundamental Concepts",html:`
          <h3>The CIA triad</h3>
          <p>Every security decision traces back to three goals. <b>Confidentiality</b> keeps information away from those who shouldn't see it, achieved through encryption and access control. <b>Integrity</b> ensures data has not been altered, verified through hashing and digital signatures. <b>Availability</b> ensures systems and data are usable when legitimately needed, supported by redundancy and backups. An outage harms availability, a leak harms confidentiality, and unauthorized modification harms integrity.</p>
          <div class="diagram">${SVG.ciaTriad()}<div class="cap">The CIA triad — the foundation of every control decision</div></div>
          <h4>Non-repudiation and AAA</h4>
          <p><b>Non-repudiation</b> means an actor cannot credibly deny an action. Digital signatures deliver it: because only one person holds the signing private key, a valid signature ties the action to that person. <b>AAA</b> is the access-control backbone. Authentication proves identity, authorization determines what that identity may access, and accounting logs what was actually done. Identity is always established before access is granted.</p>
          <div class="diagram">${SVG.aaa()}<div class="cap">Authentication then authorization then accounting</div></div>
          <h4>Zero trust</h4>
          <p>Zero trust abandons the old idea that everything inside the network perimeter is safe. Instead, no subject is trusted by default and every request is verified. CompTIA describes it in two planes. The <b>control plane</b> makes decisions through a Policy Engine (which decides allow or deny) and a Policy Administrator (which executes the decision), guided by adaptive identity, threat-scope reduction, and policy-driven access control. The <b>data plane</b> is where the Policy Enforcement Point actually gates each request between the subject and the resource.</p>
          <div class="diagram">${SVG.zeroTrust()}<div class="cap">Zero trust: control plane decides, data plane enforces</div></div>
          <h4>Deception and disruption</h4>
          <p>Defenders can plant traps. A <b>honeypot</b> is a single decoy system that lures attackers so their methods can be studied while real assets stay untouched. A <b>honeynet</b> is a whole decoy network. A <b>honeyfile</b> is bait data, and a <b>honeytoken</b> is a piece of data that should never be accessed legitimately, so any touch of it raises an alert.</p>`},
        {id:"t13",name:"1.3 Change Management",html:`
          <h3>Change management and why security cares</h3>
          <p>Most outages and many breaches trace back to changes made without proper control. Change management is the formal process that keeps changes from becoming incidents. It matters to security because an unreviewed change can silently open a firewall, break a dependency, or disable a control.</p>
          <h4>The business process</h4>
          <p>A sound change moves through an <b>approval process</b> with a clear <b>owner</b> and identified <b>stakeholders</b>. An <b>impact analysis</b> predicts what the change will affect, <b>test results</b> confirm it works, and a <b>backout plan</b> defines how to reverse it if it fails. The work happens during a scheduled <b>maintenance window</b> to minimize disruption, following the relevant <b>standard operating procedure</b>.</p>
          <h4>Technical implications</h4>
          <p>Changes ripple through systems. Updating <b>allow lists and deny lists</b> can grant or cut access. Some changes involve <b>restricted activities</b>, <b>downtime</b>, or a required <b>service or application restart</b>. <b>Legacy applications</b> and their <b>dependencies</b> often constrain what can safely change. Throughout, <b>documentation</b> such as diagrams and procedures must be updated, and <b>version control</b> keeps a traceable history of what changed and when.</p>`},
        {id:"t14",name:"1.4 Cryptography",html:`
          <h3>Cryptographic solutions</h3>
          <p>Cryptography protects confidentiality, integrity, and authenticity. The first fork to understand is symmetric versus asymmetric. <b>Symmetric</b> encryption uses one shared secret key for both encryption and decryption. It is fast and ideal for bulk data, but distributing the shared key securely is the challenge. <b>Asymmetric</b> encryption uses a public/private key pair: whatever one key encrypts, only the other can decrypt. It solves key distribution and enables digital signatures, but it is slower, so it is typically used to exchange a symmetric session key rather than to encrypt large data directly.</p>
          <div class="diagram">${SVG.symAsym()}<div class="cap">Symmetric shares one key; asymmetric uses a key pair</div></div>
          <h4>Hashing, salting, and stretching</h4>
          <p><b>Hashing</b> is a one-way function producing a fixed-length digest used to verify integrity, not to encrypt. Because it can't be reversed, it's ideal for storing password verifiers and detecting tampering. <b>Salting</b> adds random data before hashing so identical passwords produce different hashes, defeating rainbow tables. <b>Key stretching</b> (bcrypt, PBKDF2, scrypt) makes each hash deliberately slow, so brute-forcing becomes impractical. A <b>digital signature</b> combines hashing and asymmetric keys: the sender encrypts the message's hash with their private key, and anyone can verify it with the public key, proving integrity, authentication, and non-repudiation.</p>
          <h4>PKI and certificates</h4>
          <p><b>PKI</b> is the framework that binds public keys to identities at scale through certificate authorities. A <b>root CA</b> is the ultimate root of trust, usually kept offline, and it delegates to <b>intermediate CAs</b> that issue the end-entity certificates used by servers, users, and devices. To get a certificate you generate a <b>CSR</b> containing your public key and identity while keeping the private key secret. Revocation is checked through a <b>CRL</b> (a downloaded list) or <b>OCSP</b> (a real-time query for one certificate).</p>
          <div class="diagram">${SVG.pki()}<div class="cap">PKI hierarchy: root delegates to intermediates, which issue end-entity certs</div></div>
          <h4>Protecting keys and hiding data</h4>
          <p>Keys need protection. A <b>TPM</b> is a chip bound to one device for key storage and boot integrity, while an <b>HSM</b> is a dedicated appliance for managing keys at scale. A <b>secure enclave</b> isolates sensitive operations in hardware, and <b>key escrow</b> keeps a recoverable copy of keys with a trusted party. For obfuscation, <b>steganography</b> hides data inside other files, <b>tokenization</b> swaps sensitive values for vault-mapped tokens, and <b>data masking</b> reveals only part of a value such as the last four digits.</p>`}
      ],
      quickref:[
        {t:"CIA triad",obj:"1.2",d:"Confidentiality (secrecy), Integrity (unaltered), Availability (accessible when needed)."},
        {t:"Non-repudiation",obj:"1.2",d:"Can't deny an action. Provided by digital signatures."},
        {t:"AAA order",obj:"1.2",d:"Authentication → Authorization → Accounting. Prove identity, grant access, log activity."},
        {t:"Zero trust planes",obj:"1.2",d:"Control plane decides (Policy Engine + Administrator); data plane enforces (PEP)."},
        {t:"Deception tech",obj:"1.2",d:"Honeypot (system), honeynet (network), honeyfile/honeytoken (bait data that alerts)."},
        {t:"Control categories",obj:"1.1",d:"Technical, Managerial, Operational, Physical — how a control is implemented."},
        {t:"Control types",obj:"1.1",d:"Preventive, Deterrent, Detective, Corrective, Compensating, Directive — what it does."},
        {t:"Compensating control",obj:"1.1",d:"Alternative safeguard when the primary isn't feasible (e.g. isolate an unpatchable host)."},
        {t:"Symmetric",obj:"1.4",d:"One shared key, fast, for bulk data (AES). Hard part: key distribution."},
        {t:"Asymmetric",obj:"1.4",d:"Public/private pair (RSA, ECC). Solves key exchange; enables signatures. Slower."},
        {t:"Encrypt for recipient",obj:"1.4",d:"Use the recipient's PUBLIC key. Only their private key decrypts."},
        {t:"Digital signature",obj:"1.4",d:"Sign the hash with your PRIVATE key; verify with your public key."},
        {t:"Hashing",obj:"1.4",d:"One-way, fixed-length digest for integrity (SHA-256). Not reversible, no key."},
        {t:"Salting",obj:"1.4",d:"Random data per password before hashing. Beats rainbow tables."},
        {t:"Key stretching",obj:"1.4",d:"Slow hashing (bcrypt, PBKDF2, scrypt) to resist brute force."},
        {t:"TPM vs HSM",obj:"1.4",d:"TPM = chip in one device. HSM = appliance for keys at scale."},
        {t:"CRL vs OCSP",obj:"1.4",d:"CRL = downloaded revocation list. OCSP = real-time single-cert check."},
        {t:"CSR",obj:"1.4",d:"Request to a CA with your public key + identity. Private key stays with you."},
        {t:"Obfuscation",obj:"1.4",d:"Steganography (hide in files), tokenization (vault-mapped token), masking (partial reveal)."},
        {t:"Key escrow",obj:"1.4",d:"Trusted third party holds recoverable key copy. Recovery vs compromise risk."},
        {t:"Change management",obj:"1.3",d:"Approval, owner, stakeholders, impact analysis, test, backout plan, maintenance window."},
        {t:"Backout plan",obj:"1.3",d:"Predefined way to reverse a change if it fails. Limits downtime."}
      ]
